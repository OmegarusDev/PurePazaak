      <nav class="kotor-menu" aria-label="Main menu">
        <button type="button" id="bt-new">NEW GAME</button>
        <button type="button" id="bt-continue">LOAD GAME</button>
        <button type="button" id="bt-how">HOW TO PLAY</button>
        <button type="button" id="bt-options">OPTIONS</button>

      </nav>

  <section id="scr-circuit" class="screen">
    <div class="steel-console circuit-console">
      <div class="steel-headers steel-headers-2">
        <div class="steel-hbadge" data-credits data-credits-after>0 CREDITS</div>
        <div class="steel-hbadge">OUTER RIM CIRCUIT</div>
      </div>
      <div class="steel-well circuit-well">
        <div id="rungs"></div>
      </div>
      <div class="steel-foot circuit-actions">
        <button type="button" id="bt-cback" class="kplate">TITLE</button>
        <button type="button" id="bt-store" class="kplate">STORE</button>
        <button type="button" id="bt-challenge" class="kplate">CHALLENGE</button>
      </div>
    </div>
  </section>
  <section id="scr-store" class="screen">
    <div class="steel-console store-console">
      <div class="steel-headers steel-headers-2">
        <div class="steel-hbadge" data-credits data-credits-after>0 CREDITS</div>
        <div class="steel-hbadge">CANTINA COUNTER</div>
      </div>
      <p id="store-note" class="store-note">STOCK IMPROVES AS YOU CLIMB THE CIRCUIT.</p>
      <div class="steel-well store-well">
        <div id="stock"></div>
      </div>
      <div class="steel-foot">
        <button type="button" id="bt-sback" class="kplate">CIRCUIT</button>
      </div>
    </div>

  <section id="scr-deck" class="screen">

      <div class="steel-headers deck-headers">
        <div class="steel-hbadge" data-credits data-credits-after>0 CREDITS</div>
        <div class="steel-hbadge steel-hbadge-wide deck-hbadge-wide">CHOOSE CARDS</div>
        <div class="steel-hbadge">SIDEDECK <span id="deckcount">0/10</span></div>
      </div>
      <div class="steel-well deck-body">
        <div class="deck-collection"><div id="collection"></div></div>
        <div class="deck-rail" aria-hidden="true"></div>
        <div class="deck-side"><div id="sidedeck"></div></div>
      </div>
      <div class="steel-foot deck-foot">
        <div class="deck-foot-left">
          <button type="button" id="bt-dback" class="kplate">BACK</button>
          <button type="button" id="bt-autofill" class="kplate">AUTO-FILL</button>
        </div>
        <div class="deck-foot-right">
          <button type="button" id="bt-begin" class="kplate" disabled>PLAY</button>
        </div>
      </div>
    </div>
  </section>
  <section id="scr-match" class="screen">
    <div class="match-wrap">
      <div class="match-board"><canvas id="table"></canvas></div>
    </div>
  </section>
