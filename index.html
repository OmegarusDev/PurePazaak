<style>
:root{
  /* KOTOR 1 engine GUI — KotOR.js / PyKotor defaults:
     text/rails RGB(0, 0.658824, 0.980392), highlight RGB(1,1,0).
     In-game panels: teal-cyan 9-slice border, charcoal fill, rounded corners. */
  --abyss:#04050b;
  --navy:#0a0f1c;
  --navy-2:#060a14;
  --well:#020409;
  --bar:#0b1322;
  --line:#2a6a62;
  --line-hi:#3cb8a8;
  --rail:#00a8fa;
  --ink:#c9d4e4;
  --dim:#8b96ab;
  --faint:#5a6376;
  --cyan:#00a8fa;
  --ice:#00a8fa;
  --pale:#7ad4ff;
  --gold:#e8c34a;
  --gold-hi:#ffe14d;
  --select:#ffff4a;
  --green:#46e06a;
  --orange:#e87020;
  --k1:#00a8fa;
  --k1-hi:#ffff4a;
  --tan:#d4c89a;
  --gui-fill:#222224;
  --gui-fill-2:#2a2a2e;
  --gui-edge:#3cb8a8;
  --gui-edge-dim:#1a5c54;
  --gui-edge-hi:#7ae0d4;
  --gui-r:14px;
  /* legacy names (kept for compat) */
  --amber:#e8c34a;
  --red:#e05555;
  /* type — system stacks only, zero-asset.
     Gold lockup: Trajan. Title-menu items ≈ Bank Gothic; Mac stand-in is
     DIN Alternate (square gothic). HUD uses the same stack. */
  --serif:"Trajan Pro",Trajan,Cinzel,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"DIN Alternate","Bank Gothic","Eurostile","Microgramma","Avenir Next Condensed","Century Gothic","Futura","Trebuchet MS",sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* deep-space backdrop: vignette + sparse starfield, pure CSS, zero assets */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1px 1px at 68% 8%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 34%,rgba(190,220,255,.8),transparent 60%),
    radial-gradient(1px 1px at 32% 68%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 55% 82%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 84%,rgba(190,220,255,.6),transparent 60%),
    radial-gradient(1px 1px at 44% 12%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 92% 72%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 24% 44%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 76% 56%,rgba(190,220,255,.5),transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 10%,rgba(20,40,80,.35),transparent 60%),
    radial-gradient(ellipse 140% 120% at 50% 115%,rgba(0,0,0,.85),transparent 55%),
    linear-gradient(180deg,#070b16 0%,#04050b 55%,#020308 100%);
}
#app{position:relative;width:100vw;height:100vh;height:100dvh;z-index:1}
/* Shell: every screen is a centred column that can scroll internally.
   justify-content stays centered for tall viewports; min-height:0 + overflow
   keep short/landscape viewports reachable instead of clipped. */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);overflow-y:auto;min-height:0;padding:clamp(10px,2.5vh,24px) env(safe-area-inset-right) clamp(10px,2.5vh,24px) env(safe-area-inset-left);padding-top:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-top));padding-bottom:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-bottom))}
.screen.active{display:flex}
/* Children never squash (that causes overlap, not scroll); designated wells
   (.steel-console) re-enable shrink + internal scroll. */
.screen > *{flex-shrink:0;min-width:0}
.screen > .steel-console{flex:1 1 auto;min-height:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#141416}
::-webkit-scrollbar-thumb{background:var(--gui-edge-dim);border-radius:5px;border:2px solid #141416}
/* KOTOR 1 main-menu bars: charcoal plate, cyan side rails, 2px black gaps.
   Idle text/rails = engine cyan #00A8FA. Hover/select = yellow. */
.kbtn{display:block;position:relative;width:min(420px,92vw);padding:clamp(10px,1.8vmin,15px) clamp(18px,2.4vmin,26px);background:linear-gradient(180deg,#14161a,#0c0e10 50%,#08090a 100%);border:1px solid #000;border-radius:0;color:var(--k1);font-family:var(--sans);font-size:clamp(13px,2.1vmin,16px);font-weight:700;letter-spacing:.14em;text-indent:.04em;text-transform:uppercase;text-align:left;cursor:pointer;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 4px 0 0 var(--k1),inset -4px 0 0 var(--k1)}
.kbtn:hover,.kbtn:focus-visible,.kbtn.sel{color:var(--select);text-shadow:0 0 8px rgba(255,255,74,.4);outline:none;background:linear-gradient(180deg,#181a1e,#101214 50%,#0a0c0e 100%);box-shadow:inset 4px 0 0 var(--select),inset -4px 0 0 var(--select)}
.kbtn:active:not(:disabled){transform:translateY(1px)}
.kbtn:disabled{opacity:.32;cursor:default;color:var(--k1);text-shadow:none;box-shadow:inset 4px 0 0 var(--k1),inset -4px 0 0 var(--k1)}
.kbtn.danger{color:#c07070;box-shadow:inset 4px 0 0 #8a3030,inset -4px 0 0 #8a3030}
.kbtn.danger:hover,.kbtn.danger.sel{color:#ff9a9a;text-shadow:0 0 8px rgba(224,85,85,.35);box-shadow:inset 4px 0 0 #ff8080,inset -4px 0 0 #ff8080}
.kbtn.sm{width:auto;min-width:72px;padding:6px 14px;font-size:11px;letter-spacing:.1em;text-indent:.06em}
/* Title lockup. CARD WARS is a single text node — per-letter transforms
   break background-clip on WebKit (letters vanish). */
.kotor-lockup{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:min(100%,92vw);max-width:92vw;text-align:center;position:relative;box-sizing:border-box;padding:0 2vw}
.sw-mark{display:block;width:max-content;max-width:100%;box-sizing:border-box;font-family:"Arial Black","Helvetica Neue",sans-serif;font-weight:900;font-size:clamp(26px,9.5vw,68px);line-height:1;letter-spacing:.06em;text-indent:.06em;text-align:center;white-space:nowrap;margin:0 0 .12em;user-select:none;
  background:linear-gradient(180deg,#ffffff 0%,#f8f6f1 40%,#efe9da 75%,#e6dfcc 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 .5px rgba(20,18,14,.95)) drop-shadow(0 1px 0 rgba(0,0,0,.4)) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
/* Gold stack shrink-wraps to PAZAAK / OLD REPUBLIC so the OF THE bars match that width. */
.kotor-gold{display:flex;flex-direction:column;align-items:center;width:max-content;max-width:100%;box-sizing:border-box}
.logo-main,.logo-or{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:.92;background:linear-gradient(180deg,#fff8d0 0%,#f2d468 28%,#c9a030 64%,#7a5a14 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 0 #2a1c08) drop-shadow(0 0 16px rgba(232,195,74,.28));white-space:nowrap;max-width:100%}
.logo-main{font-size:clamp(40px,16.5vw,120px);letter-spacing:.08em;padding-left:.08em}
.logo-or{font-size:clamp(16px,5.6vw,46px);letter-spacing:.16em;padding-left:.16em;margin-top:.08em}
/* OF THE: gold plaque + gold taper bars — width follows .kotor-gold. */
.logo-mid{display:flex;align-items:center;gap:clamp(6px,1.2vw,12px);width:100%;margin:.18em auto .06em;box-sizing:border-box}
.logo-ofthe{flex:0 0 auto;font-family:var(--serif);font-size:clamp(9px,2.4vw,15px);letter-spacing:.24em;text-indent:.24em;padding:.16em .65em .14em;color:#e8c34a;border:1px solid #c4a048;background:linear-gradient(180deg,#3a3014,#161008);text-shadow:0 1px 0 #000;white-space:nowrap;text-align:center;box-sizing:border-box}
.logo-bar{flex:1 1 auto;min-width:0;height:clamp(6px,1.1vh,11px);background:linear-gradient(180deg,#ead080,#a07828 48%,#5a4010);box-shadow:0 1px 0 #1a1204,inset 0 1px 0 rgba(255,240,180,.35)}
.logo-bar:first-child{clip-path:polygon(6% 0,100% 0,92% 100%,0 100%)}
.logo-bar:last-child{clip-path:polygon(0 0,94% 0,100% 100%,8% 100%)}
/* Menu barrel — leave as-is for now (passable). */
.kotor-menu-shell{position:relative;width:min(340px,42vw);flex:0 0 auto;isolation:isolate}
.kotor-menu-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.km-fill{fill:#071018;fill-opacity:.92}
.km-sec{fill:#123a58;fill-opacity:.55;stroke:none}
.km-rail{fill:none;stroke:#7ec8e8;stroke-width:2.15;stroke-linecap:round;filter:drop-shadow(0 0 2.5px rgba(90,190,230,.55))}
.km-rail-in{fill:none;stroke:#2a6a88;stroke-width:1.05;stroke-linecap:round;opacity:.75}
.km-div{fill:none;stroke:#000;stroke-width:1.1;opacity:.82}
.kotor-menu{position:relative;z-index:1;display:flex;flex-direction:column;padding:4% 12% 4%}
.kotor-menu button{appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;width:100%;margin:0;padding:clamp(10px,2vh,16px) 4px;background:transparent;border:0;border-bottom:0;color:#5eb4dc;font-family:"DIN Alternate",var(--sans);font-size:clamp(12px,2.05vh,16px);font-weight:700;letter-spacing:.18em;word-spacing:.28em;text-indent:.09em;text-transform:uppercase;text-align:center;cursor:pointer;text-shadow:0 0 7px rgba(60,170,230,.3)}
.kotor-menu button:last-child{border-bottom:0}
.kotor-menu button:hover,.kotor-menu button:focus-visible,.kotor-menu button.sel{color:#cce666;text-shadow:0 0 8px rgba(200,220,70,.5);outline:none}
.kotor-menu:hover button.sel:not(:hover){color:#5eb4dc;text-shadow:0 0 7px rgba(60,170,230,.3)}
.kotor-menu button:disabled{opacity:.34;cursor:default;color:#5eb4dc;text-shadow:none}
/* Soft title haze on the full screen so it never hard-crops above the lockup. */
#scr-title{flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4.2vh,44px);padding:calc(clamp(16px,4vh,48px) + env(safe-area-inset-top)) clamp(12px,4vw,64px) calc(clamp(16px,4vh,36px) + env(safe-area-inset-bottom));overflow-x:hidden}
#scr-title.active{display:flex}
#scr-title::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 26%,rgba(48,90,160,.3),rgba(20,40,80,.1) 42%,transparent 72%);pointer-events:none;z-index:0}
#scr-title > *{position:relative;z-index:1}
/* In-game GUI panel: rounded teal-cyan rim, plain charcoal fill (modals use wager style) */
.gui,.panel{
  background:var(--gui-fill);
  border:4px solid var(--gui-edge);
  border-radius:var(--gui-r);
  box-shadow:inset 0 0 0 1px #0c2422,0 0 0 1px #081414,0 14px 36px rgba(0,0,0,.55);
}
.panel{display:flex;flex-direction:column;gap:clamp(8px,2vw,12px);align-items:center;width:min(560px,94vw);padding:clamp(14px,3.5vw,24px) clamp(16px,4vw,28px)}
.scrh{font-family:var(--serif);font-weight:400;font-size:clamp(18px,4.2vw,26px);letter-spacing:.32em;text-indent:.32em;color:var(--gold);text-shadow:0 0 14px rgba(232,195,74,.3),0 2px 0 #000;text-align:center}
.foot{font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--faint);text-align:center}
.volrow{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--k1);font-size:12px;letter-spacing:.12em;text-indent:0;padding:12px 20px 0;font-family:var(--sans)}
.volrow input[type=range]{width:min(150px,38vw);accent-color:var(--k1)}
/* K2 wager-style dialogue — cyan computer overlay (ALL modals) */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#modal.hidden{display:none}
#modalbox{
  --dlg:#5eb4dc;
  --dlg-hi:#7ec8e8;
  --dlg-gold:#ffe14d;
  width:min(420px,92vw);
  max-height:86dvh;
  overflow-y:auto;
  padding:18px 20px 16px;
  display:flex;
  flex-direction:column;
  gap:0;
  align-items:stretch;
  text-align:center;
  background:rgba(2,8,18,.94);
  border:2px solid #3a78d0;
  border-radius:14px;
  box-shadow:
    0 0 0 1px rgba(90,160,255,.25),
    0 0 18px rgba(40,110,220,.55),
    inset 0 0 0 1px rgba(60,120,200,.35),
    0 18px 48px rgba(0,0,0,.55);
}
#modalbox h2{
  position:relative;
  font-family:var(--sans);
  font-weight:700;
  font-size:clamp(13px,3.2vw,16px);
  letter-spacing:.1em;
  text-indent:0;
  color:var(--dlg);
  text-shadow:0 0 10px rgba(60,160,230,.45);
  background:none;
  border:0;
  padding:4px 12px 10px;
  text-align:center;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
/* Hollow square bullet — wager dialog marker */
#modalbox h2::before{
  content:"";
  flex:0 0 auto;
  width:11px;
  height:11px;
  border:2px solid var(--dlg);
  box-shadow:0 0 6px rgba(60,160,230,.5);
  box-sizing:border-box;
}
#modalbox p,#modalbox li{
  font-family:var(--sans);
  font-size:clamp(12px,3.1vw,14px);
  letter-spacing:.06em;
  line-height:1.5;
  color:var(--dlg);
  text-shadow:0 0 6px rgba(40,140,220,.25);
}
#modalbox p,#modalbox ul{padding:6px 10px 0}
#modalbox ul{padding-left:28px;text-align:left}
#modalbox .mrow{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  padding:16px 8px 6px;
}
#modalbox .volrow{padding:10px 8px 0;color:var(--dlg)}
/* Wager-style pill buttons: cyan idle, gold selected/hover */
#modalbox .kbtn{
  width:auto;
  min-width:96px;
  margin:0;
  padding:8px 22px;
  border:2px solid var(--dlg);
  border-radius:10px;
  background:rgba(0,10,24,.55);
  color:var(--dlg);
  letter-spacing:.12em;
  text-indent:0;
  text-align:center;
  box-shadow:0 0 8px rgba(40,120,220,.25);
  text-shadow:none;
  white-space:nowrap;
  overflow:visible;
}
#modalbox > .kbtn{margin:10px auto 4px}
#modalbox .kbtn:hover,#modalbox .kbtn:focus-visible,#modalbox .kbtn.sel{
  border-color:var(--dlg-gold);
  color:var(--dlg-gold);
  background:rgba(40,36,8,.35);
  box-shadow:0 0 14px rgba(255,225,77,.35),inset 0 0 12px rgba(255,225,77,.08);
  text-shadow:0 0 8px rgba(255,225,77,.4);
}
#modalbox .kbtn.danger{border-color:#e07070;color:#e09090;box-shadow:0 0 8px rgba(220,80,80,.2)}
#modalbox .kbtn.danger:hover,#modalbox .kbtn.danger.sel{border-color:#ffb0b0;color:#ffc8c8;box-shadow:0 0 12px rgba(255,140,140,.3);background:rgba(40,10,10,.35)}
.mcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:12px 10px 0}
.mcard{display:flex;flex-direction:column;align-items:center;gap:4px}
button.mcard{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;padding:6px 8px;font:inherit;color:inherit}
button.mcard:hover,button.mcard:focus-visible{border-color:var(--select);box-shadow:0 0 12px rgba(255,255,74,.28);outline:none}
.mcard canvas{width:68px;height:auto;aspect-ratio:572/772}
.mcard span{font-size:11px;color:var(--k1);letter-spacing:.12em}
.credits{font-size:clamp(10px,1.7vmin,13px);letter-spacing:.28em;color:var(--gold);text-align:center;text-indent:.28em}
/* Shared K1 blue-steel console + cyan menu plates.
   Title barrel stays separate. Match table metal stays canvas. */
:root{
  --steel-hi:#c4ccd6;
  --steel-mid:#8a96a4;
  --steel-lo:#5a6572;
  --steel-deep:#3a4450;
  --eq-cyan:#4580c4;
  --eq-cyan-hi:#5eb0dc;
  --eq-cyan-text:#7ec8e8;
  --eq-gold:#ced049;
  --eq-gold-hi:#ffe14d;
  --eq-fill:#0c101c;
}

.steel-console{
  display:flex;
  flex-direction:column;
  gap:clamp(8px,1.4vh,12px);
  width:min(980px,96vw);
  min-height:0;
  padding:clamp(10px,1.8vh,16px);
  border-radius:18px;
  box-sizing:border-box;
  position:relative;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.01) 1px,
      rgba(0,0,0,.04) 2px,
      transparent 3px
    ),
    linear-gradient(145deg,rgba(160,200,255,.1),transparent 42%),
    linear-gradient(180deg,#a8b4c2 0%,#7a8796 28%,#5c6876 62%,#3e4854 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.48),
    inset 0 -3px 0 rgba(0,0,0,.4),
    inset 2px 0 0 rgba(255,255,255,.22),
    inset -3px 0 0 rgba(0,0,0,.28),
    0 0 0 1px #1a222c,
    0 16px 40px rgba(0,0,0,.55);
}
.steel-console::after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  pointer-events:none;
  z-index:0;
}
.steel-console > *{position:relative;z-index:1}

.steel-headers{
  display:grid;
  grid-template-columns:minmax(96px,0.9fr) minmax(0,2.2fr) minmax(110px,1fr);
  gap:clamp(6px,1vw,10px);
  flex:0 0 auto;
}
.steel-headers.steel-headers-2{
  grid-template-columns:minmax(110px,1fr) minmax(0,2.4fr);
}
.steel-hbadge{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:clamp(28px,4.2vh,36px);
  padding:4px 10px;
  background:linear-gradient(180deg,#12151a,#06070a);
  border:1px solid var(--steel-hi);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.18);
  color:#e8eef6;
  font-family:var(--sans);
  font-size:clamp(10px,1.7vh,13px);
  font-weight:700;
  letter-spacing:.16em;
  text-indent:.08em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.steel-well{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#0c1016,#06080c);
  border-radius:10px;
  box-shadow:
    inset 0 3px 10px rgba(0,0,0,.75),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 0 0 1px rgba(0,0,0,.5);
  overflow:hidden;
}

.steel-foot{
  display:flex;
  align-items:stretch;
  justify-content:stretch;
  gap:10px;
  flex:0 0 auto;
  padding:2px 0 0;
}
.steel-foot > .kplate{flex:1;min-width:0}

/* Cyan Use Item / Close plates — shared menu language */
.kplate{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  position:relative;
  min-width:0;
  min-height:44px;
  padding:clamp(11px,1.8vh,15px) 12px;
  background:#1b1e25;
  border:1px solid var(--eq-cyan);
  border-radius:4px;
  color:var(--eq-cyan-hi);
  font-family:var(--sans);
  font-size:clamp(12px,2vh,14px);
  font-weight:700;
  letter-spacing:.12em;
  text-indent:.06em;
  text-transform:uppercase;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:none;
  box-shadow:
    inset 1px 1px 0 rgba(120,180,230,.28),
    inset -1px -1px 0 rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(20,28,40,.6);

// RefPlus 572x772. Every drawn card letterboxes into this aspect so wells,
// badge, and plate stay in the measured places at catalog/hand/table sizes.
const CARD_ASPECT=572/772;
function fitCard(w,h){
  let cw=w,ch=w/CARD_ASPECT;
  if(ch>h){ch=h;cw=h*CARD_ASPECT;}
  return {ox:(w-cw)/2,oy:(h-ch)/2,w:cw,h:ch};
}
function cardChamfer(w,frac){return Math.max(0.55,frac*w);}
function mulberry(seed){

}

function startSet(){

  M.sel=-1;M.orient=1;M.varV=1;M.phase='turn';M.anims.deal=null;

function drawTo(w){

function bustFlash(w){

/** Shared post-draw / post-play checks. Fill wins only at ≤20. */
function resolveBoard(w){
  const S=sideOf(w);S.score=boardScore(S.board);
  if(boardCount(S.board)===9){
    if(S.score>20){bustFlash(w);endSet(other(w),'bust');return 'bust';}
    endSet(w,'fill');return 'fill';
  }
  if(S.score===20){S.stood=true;toast('TWENTY!');return 'stood';}
  return 'ok';
}
function resolveAfterDraw(w){return resolveBoard(w);}
function beginTurn(w){
  M.turn=w;
  if(sideOf(w).stood){
    if(sideOf(other(w)).stood){resolveStandoff();return;}
    beginTurn(other(w));
    return;
  }
  drawTo(w);
  const res=resolveAfterDraw(w);
  if(res==='fill'||res==='bust')return;
  if(res==='stood'){
    if(sideOf(other(w)).stood){resolveStandoff();return;}
    beginTurn(other(w));
    return;
  }
  if(w==='p'){M.sidePlayed=false;M.phase='pAction';}else{M.phase='oTurn';aiTurn(M.token);}
}
function passToOpp(){beginTurn('o');}
function endPlayerTurn(){
  if(M.phase!=='pAction')return;AUDIO.play('click');M.sel=-1;
  if(M.p.score>20){bustFlash('p');endSet('o','bust');return;}
  passToOpp();
}
function playerStand(){
  if(M.phase!=='pAction')return;AUDIO.play('click');
  if(M.p.score>20){bustFlash('p');endSet('o','bust');return;}
  M.p.stood=true;M.sel=-1;toast('YOU STAND');
  if(M.o.stood)resolveStandoff();else passToOpp();
}
function cycleFlex(){
  if(M.orient>0&&M.varV===1)M.varV=2;
  else if(M.orient>0&&M.varV===2){M.orient=-1;M.varV=1;}
  else if(M.orient<0&&M.varV===1)M.varV=2;
  else{M.orient=1;M.varV=1;}
}
function flipArmed(){
  if(M.phase!=='pAction'||M.sel<0)return;
  const card=M.p.hand[M.sel];
  if(!canFlip(card))return;
  AUDIO.play('click');
  if(card.kind==='flex')cycleFlex();
  else M.orient*=-1;
}
function confirmPlay(i){
  if(M.phase!=='pAction'||M.sidePlayed)return;
  const card=M.p.hand[i];if(!card)return;
  if(card.kind==='dbl'&&!lastSlot(M.p.board)){toast('NOTHING TO DOUBLE');return;}
  if(card.kind==='flip'){
    const n=applyFlip(M.p.board,card.vals);
    if(!n){toast('NOTHING TO FLIP');return;}
    AUDIO.play('place');
    toast('FLIPPED '+n+' CARD'+(n===1?'':'S'));
  }else{
    AUDIO.play('place');
    if(card.kind==='dbl')applyDouble(M.p.board);
    else{const si=placeSide(M.p,card,M.orient,M.varV);if(si>=0)M.anims.deal={who:'p',slot:si,t0:performance.now()};}
  }
  if(card.kind==='tie')M.p.tiebreak=true;
  M.p.hand[i]=null;M.sel=-1;M.sidePlayed=true;
  const res=resolveBoard('p');
  if(res==='fill'||res==='bust')return;
  if(res==='stood'){if(M.o.stood)resolveStandoff();else passToOpp();}
}
function bustRisk(w){
  const S=sideOf(w),rem=M.deck.length;
  if(!rem)return 1;

  return bad/rem;

async function aiTurn(tk){
  await sleep(650);if(!M||tk!==M.token||M.phase!=='oTurn')return;
  await sleep(520);if(!M||tk!==M.token||M.phase!=='oTurn')return;
  const snap={score:M.o.score,board:M.o.board,hand:M.o.hand,oppScore:M.p.score,oppStood:M.p.stood,tier:M.opp.tier,bustRisk:bustRisk('o'),setsO:M.setsO};
  const d=aiDecide(snap);
  if(d.play){
    const card=M.o.hand[d.play.idx];
    AUDIO.play('place');
    if(d.play.tag==='dbl')applyDouble(M.o.board);
    else if(d.play.tag==='flip')applyFlip(M.o.board,card.vals);
    else{const si=placeSide(M.o,card,d.play.orient,d.play.varV);if(si>=0)M.anims.deal={who:'o',slot:si,t0:performance.now()};}
    if(card.kind==='tie')M.o.tiebreak=true;
    M.o.hand[d.play.idx]=null;
    await sleep(430);if(!M||tk!==M.token||M.phase!=='oTurn')return;
    const res=resolveBoard('o');
    if(res==='fill'||res==='bust')return;
    if(res==='stood'){if(M.p.stood)resolveStandoff();else beginTurn('p');return;}
    const after={...snap,score:M.o.score,board:M.o.board,hand:M.o.hand,bustRisk:bustRisk('o')};
    // Plus/side plays that raise the total: stand (human play). Exception: still
    // losing to a stood opponent — standing would concede, so keep going.
    const raised=M.o.score>snap.score;
    const losingToStood=M.p.stood&&M.o.score<M.p.score;
    if((raised&&!losingToStood)||shouldStand(M.o.score,after)){
      M.o.stood=true;toast(M.opp.name.toUpperCase()+' STANDS');
      if(M.p.stood)resolveStandoff();else beginTurn('p');return;
    }
  }else if(d.stand){
    M.o.stood=true;toast(M.opp.name.toUpperCase()+' STANDS');
    if(M.p.stood)resolveStandoff();else beginTurn('p');
    return;
  }
  if(M.o.score>20){bustFlash('o');endSet('p','bust');return;}
  beginTurn('p');
}
function resolveStandoff(){
  const ps=M.p.score,os=M.o.score;
  let winner=null;
  if(ps>os)winner='p';else if(os>ps)winner='o';
  else if(M.p.tiebreak&&!M.o.tiebreak)winner='p';
  else if(M.o.tiebreak&&!M.p.tiebreak)winner='o';
  if(winner){endSet(winner,'score');return;}
  M.phase='over';
  presentDialog('THE SET IS TIED.','NO POINT AWARDED',()=>{M.setStarter=other(M.setStarter);startSet();});
}
function endSet(winner,reason){
  M.phase='over';M.sel=-1;
  if(winner==='p'){M.setsP++;AUDIO.play('win');}
  else{M.setsO++;AUDIO.play(reason==='bust'?'bust':'lose');}
  const lines=setEndText(winner,reason);
  presentDialog(lines[0],lines[1],()=>{
    if(M.setsP>=3){matchEnd('p');return;}
    if(M.setsO>=3){matchEnd('o');return;}
    M.setStarter=winner;startSet();
  });
}
function setEndText(winner,reason){
  if(winner==='p'){
    if(reason==='bust')return ['YOU WIN THE SET.','OPPONENT BUSTED'];
    if(reason==='fill')return ['YOU WIN THE SET.','BOARD FILLED - NINE CARDS'];
    return ['YOU WIN THE SET.',M.p.score+' TO '+M.o.score];
  }
  if(reason==='bust')return ['OPPONENT WINS THE SET.','YOU WENT BUST'];
  if(reason==='fill')return ['OPPONENT WINS THE SET.','THEIR BOARD FILLED'];
  return ['OPPONENT WINS THE SET.',M.o.score+' TO '+M.p.score];
}
function matchEnd(winner){

    AUDIO.play('win');
    const rematch=M.replayRung!=null,wager=M.wager||0;
    SAVE.credits+=wager*2;
    if(!rematch)SAVE.circuit+=1;
    persist();
    if(gameHooks.spoils)gameHooks.spoils(wager,rematch);
  }else{
    AUDIO.play('lose');
    persist();
    presentDialog('DEFEAT.','YOU LOSE THE WAGER  \u00B7  '+(M.wager||0)+' CR',()=>leaveMatch());
  }
}

function startMatch(rung){

  if(SAVE.credits<wager){
    presentDialog('NOT ENOUGH CREDITS','THIS TABLE WANTS '+wager+' CR',()=>{});
    return;
  }
  SAVE.credits-=wager;persist();
  newMatch(opp,rung<SAVE.circuit?rung:null);
  M.wager=wager;
  if(gameHooks.onEnterMatch)gameHooks.onEnterMatch();
  presentDialog('VS '+opp.name.toUpperCase(),'WAGER '+wager+' CR  \u00B7  TIER '+opp.tier+'  \u00B7  FIRST TO 3 SETS',()=>startSet());

function autoFill(){
  deckSel=[];
  const priority=['1\u00B12','\u00B16','\u00B15','\u00B14','\u00B13','\u00B12','\u00B11','TIE','+5','-5','+4','-4','+3','-3','+2','-2','+1','-1','DBL','2&4','3&6'];
  for(const id of priority){
    let avail=SAVE.unlocked[id]||0;
    while(deckSel.length<10&&avail>0){deckSel.push(id);avail--;}
    if(deckSel.length>=10)break;
  }
  AUDIO.play('click');buildDeckUI();
}
function spoilList(){
  const counts={};
  if(M&&M.o&&M.o.side)for(const c of M.o.side)counts[c.id]=(counts[c.id]||0)+1;
  return DECK_ORDER.filter(id=>counts[id]).map(id=>({id,n:counts[id]}));
}
function showSpoilsModal(wager,rematch){
  const list=spoilList();
  const clutter=list.length>0&&list.every(x=>isClutterId(x.id));
  const cells=list.map((x,i)=>'<button type="button" class="mcard spoil" data-i="'+i+'"><canvas></canvas><span>'+(x.n>1?'\u00D7'+x.n:'TAKE')+'</span></button>').join('');
  openModal(
    '<h2>'+(rematch?'REMATCH WON':'MATCH WON')+'</h2>'+
    '<p>+'+wager+' CR. '+(clutter?'THEIR DECK IS MOSTLY CLUTTER \u2014 TAKE ONE, OR SKIP.':'TAKE ONE CARD FROM THEIR SIDE DECK.')+'</p>'+
    '<div class="mcards">'+(cells||'<p>NO CARDS TO TAKE</p>')+'</div>'+
    '<div class="mrow"><button id="mskip" class="kbtn sel">SKIP</button></div>');
  document.querySelectorAll('.mcard.spoil canvas').forEach((cvs,i)=>drawMini(cvs,list[i].id,68));
  document.querySelectorAll('.mcard.spoil').forEach((btn,i)=>{
    btn.onclick=()=>{
      AUDIO.play('click');
      addToCollection(list[i].id);persist();
      closeModal();leaveMatch();
    };
  });
  $('#mskip').onclick=()=>{AUDIO.play('click');closeModal();leaveMatch();};
}
function buildStoreUI(){
  const wrap=$('#stock');if(!wrap)return;
  wrap.innerHTML='';
  storeStock().forEach(id=>{
    const price=CARD_PRICE[id], owned=SAVE.unlocked[id]||0, maxed=owned>=STORE_CAP, broke=SAVE.credits<price;
    const cell=document.createElement('div');
    cell.className='cell'+(maxed||broke?' maxed':'');
    const cvs=document.createElement('canvas');
    cell.appendChild(cvs);
    const cnt=document.createElement('span');
    cnt.className='cnt';
    cnt.textContent=maxed?'OWN '+owned:price+' CR'+(owned?' \u00B7 OWN '+owned:'');
    cell.appendChild(cnt);
    drawMini(cvs,id);
    if(!maxed&&!broke)cell.onclick=()=>{
      AUDIO.play('click');
      SAVE.credits-=price;addToCollection(id);persist();buildStoreUI();
    };
    wrap.appendChild(cell);
  });
  const note=$('#store-note');
  if(note)note.textContent=SAVE.circuit>=6?'FULL CANTINA STOCK.':'STOCK IMPROVES AS YOU CLIMB THE CIRCUIT.';
}
function openStore(){
  buildStoreUI();
  showScreen('store');
}
function openModal(html){$('#modalbox').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
function hasSave(){return !!(SAVE.begun||SAVE.circuit>0||(SAVE.lastDeck&&SAVE.lastDeck.length));}
function wipeKeepAudio(){
  const vol=AUDIO.vol,muted=AUDIO.muted;
  SAVE=defaultSave();SAVE.vol=vol;SAVE.muted=muted;SAVE.roster=buildRoster();persist();
}
function enterCircuit(){
  SAVE.begun=true;persist();
  circuitSel=circuitDefaultSel();
  buildCircuit();
  showScreen('circuit');
}
function startNewGame(){
  AUDIO.play('click');
  if(!hasSave()){wipeKeepAudio();enterCircuit();return;}
  openModal(
    '<h2>NEW GAME</h2><p>THIS WIPES YOUR CIRCUIT, CARD COLLECTION, AND CREDITS.</p>'+
    '<div class="mrow"><button id="mno" class="kbtn">CANCEL</button><button id="myes" class="kbtn sel">START</button></div>');
  $('#myes').onclick=()=>{AUDIO.play('click');closeModal();wipeKeepAudio();enterCircuit();};
  $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
}
function confirmReset(){
  AUDIO.play('click');
  openModal(
    '<h2>RESET PROGRESS</h2><p>THIS WIPES YOUR CIRCUIT, CARD COLLECTION, AND CREDITS.</p>'+
    '<div class="mrow"><button id="mno" class="kbtn">KEEP IT</button><button id="myes" class="kbtn danger sel">WIPE IT</button></div>');
  $('#myes').onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();};
  $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
}
function openOptions(){
  openModal(
    '<h2>OPTIONS</h2>'+
    '<div class="volrow"><span>VOLUME</span><input id="vol" type="range" min="0" max="100" value="'+Math.round(AUDIO.vol*100)+'"><button id="bt-mute" class="kbtn sm">MUTE</button></div>'+
    '<div class="mrow"><button id="bt-reset" class="kbtn danger">RESET PROGRESS</button><button id="oclose" class="kbtn sel">CLOSE</button></div>');
  $('#vol').oninput=e=>{AUDIO.setVol(e.target.value/100);SAVE.vol=AUDIO.vol;persist();};
  $('#bt-mute').textContent=AUDIO.muted?'UNMUTE':'MUTE';
  $('#bt-mute').onclick=()=>{AUDIO.setMuted(!AUDIO.muted);SAVE.muted=AUDIO.muted;persist();$('#bt-mute').textContent=AUDIO.muted?'UNMUTE':'MUTE';};
  $('#bt-reset').onclick=confirmReset;
  $('#oclose').onclick=()=>{AUDIO.play('click');closeModal();};
}
function askQuit(){
  AUDIO.play('click');
  openModal(
    '<h2>QUIT</h2><p>LEAVE THE TABLE?</p>'+
    '<div class="mrow"><button id="mno" class="kbtn">NO</button><button id="myes" class="kbtn sel">YES</button></div>');
  $('#myes').onclick=()=>{
    AUDIO.play('click');
    try{window.close();}catch(e){}
    closeModal();
  };
  $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
}
function refreshTitle(){
  const load=$('#bt-continue');
  load.disabled=!hasSave();
  document.querySelectorAll('.kotor-menu button').forEach(b=>b.classList.remove('sel'));
  (hasSave()?load:$('#bt-new')).classList.add('sel');
  refreshCredits();
}
let rafOn=false;
function kickRender(){
  if(rafOn)return;
  rafOn=true;
  requestAnimationFrame(loop);
}
function loop(t){
  render(t);
  if(curScreen==='match'&&M)requestAnimationFrame(loop);
  else rafOn=false;
}
/**
 * Register the service worker and pull updates when the app is opened.
 * When a new SW activates, reload once so players land on the latest build.
 * Checks on open only — not on focus/visibility regain.
 */
function registerPwa(){
  if(!('serviceWorker' in navigator))return;

  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      try{reg.update();}catch(_){/* ignore */}

      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
      reg.addEventListener('updatefound',()=>{
        const sw=reg.installing;
        if(!sw)return;
        sw.addEventListener('statechange',()=>{
          if(sw.state==='installed'&&navigator.serviceWorker.controller){
            sw.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }catch(err){
      console.warn('PWA register failed:',err);
    }
  });

  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
}
function init(){
  registerPwa();
  gameHooks.dialog=bindMatchDialog;
  gameHooks.closeModal=closeModal;
  gameHooks.spoils=showSpoilsModal;
  gameHooks.onEnterMatch=()=>{showScreen('match');fit();kickRender();};
  gameHooks.onLeaveMatch=()=>{circuitSel=circuitDefaultSel();buildCircuit();showScreen('circuit');};
  initTextures();
  AUDIO.vol=SAVE.vol;AUDIO.muted=SAVE.muted;
  if(!SAVE.roster||!SAVE.roster.length){SAVE.roster=buildRoster();persist();}
  const table=$('#table');
  cv=table;ctx=table.getContext('2d');
  fit();
  $('#bt-new').onclick=startNewGame;
  $('#bt-continue').onclick=()=>{if(!hasSave())return;AUDIO.play('click');enterCircuit();};
  $('#bt-challenge').onclick=()=>{
    if(circuitSel>SAVE.circuit)return;
    AUDIO.play('click');openDeckBuilder(circuitSel);
  };
  $('#bt-cback').onclick=()=>{AUDIO.play('click');refreshTitle();showScreen('title');};
  $('#bt-how').onclick=()=>{AUDIO.play('click');openModal(
    '<h2>HOW TO PLAY</h2><ul>'+
    '<li>Get closer to 20 than your opponent without going over. First to win 3 sets takes the match.</li>'+
    '<li>Each turn you automatically draw a main deck card (values 1-10) onto your 3x3 board.</li>'+
    '<li>You may then play at most one side-deck card from your 4-card hand, then END TURN or STAND.</li>'+
    '<li>Over 20 is a BUST and loses the set. Exactly 20 auto-stands. Fill all 9 slots without busting for an instant win.</li>'+
    '<li>Tied sets award no point and replay. Your 4 hand cards last the entire match - spend them wisely.</li>'+
    '<li>Click a hand card to arm it, click again to play. FLIP, F, or right-click cycles +/- on duals, tiebreakers, and the 1\u00B12 card.</li>'+
    '<li>Keys: Space end turn, Enter stand, F or right-click flip, Esc cancel. Click a hand card twice to play it.</li>'+
    '<li>Matches are played for a credits wager. Win and you may take one card from their side deck, or skip if it is clutter.</li>'+
    '<li>The cantina store sells side-deck cards. Better stock unlocks as you climb the circuit.</li>'+
    '</ul><div class="mrow"><button id="mclose" class="kbtn sel">CLOSE</button></div>');
    $('#mclose').onclick=()=>{AUDIO.play('click');closeModal();};
  };
  $('#bt-store').onclick=()=>{AUDIO.play('click');openStore();};
  $('#bt-sback').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-options').onclick=()=>{AUDIO.play('click');openOptions();};
  $('#bt-quit').onclick=askQuit;
  $('#bt-autofill').onclick=autoFill;
  $('#bt-dback').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-begin').onclick=()=>{
    if(deckSel.length!==10)return;
    AUDIO.play('click');
    SAVE.lastDeck=deckSel.slice();persist();
    startMatch(deckRung);
  };
  table.addEventListener('pointerdown',onTablePointer);
  table.addEventListener('pointermove',onTableHover);
  table.addEventListener('contextmenu',onTableContext);
  window.addEventListener('keydown',e=>{
    if(curScreen!=='match'||!M)return;
    const k=e.key.toLowerCase();
    if(matchDlg){
      if(k==='enter'){e.preventDefault();dialogOK();}
      else if(k==='escape'&&matchDlg.onCancel){e.preventDefault();dialogCancel();}
      return;
    }
    if(M.phase!=='pAction')return;
    if(k==='e'||k===' '){e.preventDefault();endPlayerTurn();}
    else if(k==='enter'||k==='s'){e.preventDefault();playerStand();}
    else if(k==='f'){e.preventDefault();flipArmed();}
    else if(k==='escape'){e.preventDefault();M.sel=-1;}
  });
  window.addEventListener('resize',fit);
  renderStatic();
  refreshTitle();
}
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  computeLayout();
  if(cv){cv.width=W*DPR;cv.height=H*DPR;}
  if(M&&ctx){renderStatic();render(performance.now());kickRender();}
}
function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/Math.max(1,r.width)*W, y:(e.clientY-r.top)/Math.max(1,r.height)*H};
}
function askForfeit(){
  AUDIO.play('click');
  presentDialog('FORFEIT THE MATCH?','THE WAGER WILL BE LOST',()=>{AUDIO.play('lose');leaveMatch();},{cancelText:'NO',onCancel(){}});
}
function hitTable(p){
  if(!M||matchDlg)return null;
  if(L.handP&&!M.sidePlayed){
    for(let i=0;i<4;i++){
      if(inRect(p,handSlot(L.handP,i))&&M.p.hand[i])return {kind:'hand',i};
    }
  }
  const ui=tableUI();
  if(inRect(p,L.btnEnd)&&ui.act)return {kind:'end'};
  if(inRect(p,L.btnStand)&&ui.act)return {kind:'stand'};
  if(inRect(p,L.btnFlip)&&ui.flipOk)return {kind:'flip'};
  if(inRect(p,L.btnForf)&&M.phase==='pAction')return {kind:'forfeit'};
  return null;
}
function onTableHover(e){
  if(curScreen!=='match'||!cv)return;
  cv.style.cursor=hitTable(canvasPoint(e))?'pointer':'default';
}
function onTablePointer(e){
  if(curScreen!=='match'||!M||matchDlg)return;
  if(e.button!=null&&e.button!==0)return;
  const hit=hitTable(canvasPoint(e));
  if(!hit)return;
  e.preventDefault();
  if(hit.kind==='hand'){
    if(M.phase!=='pAction')return;
    if(M.sel===hit.i)confirmPlay(hit.i);
    else{AUDIO.play('click');M.sel=hit.i;M.orient=1;M.varV=1;}
  }else if(hit.kind==='end')endPlayerTurn();
  else if(hit.kind==='stand')playerStand();
  else if(hit.kind==='flip')flipArmed();
  else if(hit.kind==='forfeit')askForfeit();
}
function onTableContext(e){
  if(curScreen!=='match')return;
  e.preventDefault();
  if(!M||matchDlg||M.phase!=='pAction')return;
  const hit=hitTable(canvasPoint(e));
  if(!hit||hit.kind!=='hand')return;
  const card=M.p.hand[hit.i];
  if(!canFlip(card))return;
  if(M.sel!==hit.i){M.sel=hit.i;M.orient=1;M.varV=1;}
  flipArmed();
}
globalThis.PZ={shuffle,buildMainDeck,boardScore,placeMain,placeSide,applyDouble,applyFlip,aiDecide,shouldStand,genSideDeck,generateOpponent,cardLabel,CARD_DEFS,buildRoster,makeCard,faceVal,canFlip,playValue,
  startSet,beginTurn,endPlayerTurn,playerStand,confirmPlay,endSet,resolveBoard,resolveStandoff,boardCount,dialogOK,
  newMatchForTest:(deckIds,opp)=>{SAVE.lastDeck=deckIds;newMatch(opp,null);},
  getM:()=>M,setSleepScale:v=>{SLEEP_SCALE=v;},chanState,fitCard,CARD_ASPECT,
  matchWager,storeStock,storeMinCircuit,addToCollection,isClutterId,CARD_PRICE,getSave:()=>SAVE};
if(typeof document!=='undefined'){
  document.addEventListener('DOMContentLoaded',init);
}
</script>
