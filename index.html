<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazaak: Outer Rim Circuit</title>
<style>
:root{--amber:#e8a41f;--cyan:#3aa2e8;--gold:#ecd883;--red:#e05555}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;touch-action:none}
body{background:#141417;color:#cfd4de;font-family:"Arial Narrow",Arial,Helvetica,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100vw;height:100vh}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:20px;overflow-y:auto;background-image:var(--metal);background-size:256px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}
.kbtn{display:block;min-width:clamp(220px,70vw,300px);padding:12px 28px;background:linear-gradient(180deg,#3c3c44,#232329);border:1px solid #101014;border-top-color:rgba(255,255,255,.14);border-radius:6px;color:var(--amber);font-family:inherit;font-size:clamp(13px,3.5vw,15px);font-weight:700;letter-spacing:clamp(2px,1vw,4px);text-transform:uppercase;cursor:pointer;text-shadow:0 0 6px rgba(232,164,31,.45);touch-action:manipulation}
.kbtn:hover{border-color:var(--amber);color:#ffd060;box-shadow:0 0 14px rgba(232,164,31,.35),inset 0 0 8px rgba(232,164,31,.12)}
.kbtn:disabled{opacity:.35;cursor:default;box-shadow:none;border-color:#101014;color:var(--amber)}
.kbtn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.kbtn.danger{color:var(--red);text-shadow:0 0 6px rgba(224,85,85,.4)}
.kbtn.danger:hover{border-color:var(--red);color:#ff8080;box-shadow:0 0 14px rgba(224,85,85,.3)}
.kbtn.sm{min-width:clamp(90px,50vw,110px);padding:8px 14px;font-size:clamp(11px,3vw,13px);letter-spacing:clamp(2px,1vw,3px)}
.logo{font-size:clamp(48px,12vw,82px);font-weight:700;letter-spacing:clamp(12px,3vw,24px);margin-left:clamp(8px,2vw,24px);color:#7fd4ff;text-shadow:0 0 18px rgba(58,162,232,.9),0 0 46px rgba(58,162,232,.45)}
.logo-sub{font-size:clamp(14px,4vw,20px);font-weight:700;letter-spacing:clamp(8px,2vw,15px);margin-left:clamp(6px,1vw,15px);color:var(--amber);text-shadow:0 0 12px rgba(232,164,31,.6)}
.panel{background:linear-gradient(180deg,rgba(72,72,80,.92),rgba(38,38,44,.94));border:1px solid rgba(200,200,212,.35);border-radius:14px;padding:clamp(16px,4vw,26px) clamp(20px,5vw,34px);box-shadow:0 8px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;gap:clamp(8px,2vw,12px);align-items:center;width:100%;max-width:90vw}
.scrh{font-size:26px;font-weight:700;letter-spacing:10px;color:#7fd4ff;text-shadow:0 0 12px rgba(58,162,232,.7)}
.foot{font-size:12px;letter-spacing:3px;color:#6a6a74}
.volrow{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:13px;letter-spacing:3px}
.volrow input[type=range]{width:150px;accent-color:var(--amber)}
#rungs{display:flex;flex-direction:column;gap:10px}
.rung{display:grid;grid-template-columns:46px 1fr auto 110px;gap:16px;align-items:center;width:100%;max-width:660px;padding:12px 20px;background:linear-gradient(180deg,rgba(58,58,66,.88),rgba(32,32,38,.92));border:1px solid #1a1a20;border-radius:8px}
.rung.next{border-color:var(--amber);cursor:pointer;box-shadow:0 0 12px rgba(232,164,31,.25)}
.rung.next:hover{box-shadow:0 0 22px rgba(232,164,31,.5)}
.rung.locked{opacity:.38}
.rung.done{opacity:.8;cursor:pointer}
.rung.done:hover{border-color:#3fae4a}
.tier{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#0c0c10}
.tier.t1{background:linear-gradient(180deg,#8a8a94,#4a4a52)}
.tier.t2{background:linear-gradient(180deg,#4a66ee,#1c2f8e);color:#dfe6ff}
.tier.t3{background:linear-gradient(180deg,#e04040,#7a1414);color:#ffe0e0}
.rname{font-size:17px;font-weight:700;letter-spacing:2px;color:#e8e8ee}
.rtitle{font-size:12px;letter-spacing:3px;color:var(--gold)}
.rstat{font-size:12px;letter-spacing:3px;text-align:right}
.rung.next .rstat{color:var(--amber)}
.rung.done .rstat{color:#5fce6e}
.rung.locked .rstat{color:#55555e}
.deckwrap{display:flex;gap:22px;align-items:stretch;flex-wrap:wrap}
#collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:56vh;overflow-y:auto;padding:8px;align-content:start}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 5px;background:rgba(20,20,26,.6);border:1px solid #1c1c22;border-radius:8px;cursor:pointer}
.cell:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(58,162,232,.3)}
.cell.maxed{opacity:.45;cursor:default}
.cell.maxed:hover{border-color:#1c1c22;box-shadow:none}
@media (max-width: 600px){
  .cell{max-width:100%}
  .cell canvas{max-width:100%}
  .sslot{max-width:100%}
  .sslot canvas{max-width:100%}
  .kbtn.sm{min-width:100%}
  .deckbtns{flex-direction:column;width:100%}
  .deckbtns .kbtn{width:100%}
}
.cell canvas{width:100%;max-width:64px;height:auto;aspect-ratio:64/76}
.cell .cnt{font-size:11px;letter-spacing:1px;color:#9aa2b4}
.deckside{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:280px;width:100%;max-width:300px}
#deckcount{font-size:20px;font-weight:700;letter-spacing:4px;color:var(--gold)}
#deckcount.full{color:#5fce6e;text-shadow:0 0 10px rgba(95,206,110,.5)}
#sidedeck{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.sslot{width:52px;height:62px;border:1px dashed #3a3a44;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sslot:hover{border-color:var(--red)}
.sslot canvas{width:100%;max-width:46px;height:auto;aspect-ratio:46/56}
.deckbtns{display:flex;gap:10px}
.deckbtns .kbtn{min-width:130px;padding:9px 12px;font-size:13px}
#table{width:min(92vw,calc(86vh*1.3333));max-width:100%;aspect-ratio:1024/768;border-radius:16px;box-shadow:0 10px 44px rgba(0,0,0,.65);touch-action:none}
#modal{position:fixed;inset:0;background:rgba(5,6,10,.74);display:flex;align-items:center;justify-content:center;z-index:50}
#modal.hidden{display:none}
#modalbox{width:min(700px,92vw);max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#4a4a52,#26262c);border:1px solid rgba(200,200,212,.4);border-radius:14px;padding:clamp(20px,5vw,30px) clamp(20px,5vw,36px);box-shadow:0 12px 50px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:16px;align-items:center}
#modalbox h2{font-size:clamp(18px,5vw,22px);letter-spacing:8px;color:#7fd4ff;text-shadow:0 0 12px rgba(58,162,232,.6)}
#modalbox p,#modalbox li{font-size:clamp(13px,4vw,14px);letter-spacing:1px;line-height:1.7;color:#c8d0de}
#modalbox .mrow{flex-wrap:wrap;justify-content:center}
#modalbox ul{padding-left:20px}
#modalbox .mrow{display:flex;gap:14px}
.mcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mcard{display:flex;flex-direction:column;align-items:center;gap:4px}
.mcard canvas{width:68px;height:80px}
.mcard span{font-size:12px;color:var(--gold);letter-spacing:2px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#1a1a20}
::-webkit-scrollbar-thumb{background:#3c3c44;border-radius:5px}
/* Match screen hybrid layout */
#scr-match{padding:0}
.match-wrap{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px;width:100%;height:100%;padding:14px;box-sizing:border-box}
.match-board{display:flex;align-items:center;justify-content:center;min-width:0;flex:1 1 auto}
.match-controls{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:flex-start;width:clamp(220px,24vw,300px);flex:0 0 auto}
.hand{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.handcard{position:relative;width:64px;height:84px;cursor:pointer;border:2px solid transparent;border-radius:9px;background:transparent;padding:0;touch-action:manipulation}
.handcard canvas{width:100%;height:100%;display:block}
.handcard.sel{border-color:#f2e33c;box-shadow:0 0 12px rgba(242,227,60,.5)}
.handcard.used,.handcard.dis{opacity:.4}
.handcard.dis{pointer-events:none}
  .pinfo{font-size:15px;letter-spacing:3px;color:var(--gold);min-height:20px;text-align:center}
.ctrl-btns{display:flex;flex-direction:column;align-items:center;gap:10px}
.ctrl-secondary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ctrl-btns .kbtn{min-width:clamp(96px,40vw,120px)}
.ctrl-btns .kbtn.primary{min-width:clamp(150px,56vw,210px);padding:14px 30px;font-size:clamp(15px,4.2vw,18px);background:linear-gradient(180deg,#f2c64a,#c8861a);border-top-color:rgba(255,255,255,.4);color:#241a05;text-shadow:0 0 8px rgba(255,225,150,.5);box-shadow:0 0 16px rgba(232,164,31,.4)}
.ctrl-btns .kbtn.primary:hover{border-color:#fff3c0;color:#3a2a06;box-shadow:0 0 22px rgba(242,198,74,.6)}
.ctrl-btns .kbtn.ghost{background:transparent;border-color:rgba(200,200,212,.25);color:rgba(210,210,220,.55);text-shadow:none;box-shadow:none}
.ctrl-btns .kbtn.ghost:hover{border-color:rgba(224,85,85,.6);color:#ff9a9a;box-shadow:none}
@media (orientation:portrait){
  .match-wrap{flex-direction:column;justify-content:flex-start;height:100%;padding:8px;gap:8px;overflow:hidden}
  .match-board{flex:1 1 auto;width:100%;min-height:0;align-items:center;justify-content:center}
  .match-controls{width:100%;flex-direction:column;flex:0 0 auto;gap:10px;background:linear-gradient(180deg,rgba(22,22,28,.96),rgba(10,10,14,.98));border-top:1px solid rgba(200,200,212,.28);box-shadow:0 -6px 22px rgba(0,0,0,.45);padding:10px 12px}
  .handcard{width:clamp(52px,16vw,68px);height:auto;aspect-ratio:64/84}
  #table{width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:720/1180}
  #scr-deck{overflow-y:auto;justify-content:flex-start;padding:14px}
  .deckwrap{flex-direction:column;align-items:stretch;width:100%}
  .deckwrap .panel{max-width:none;width:100%}
  .deckside{max-width:none;min-width:0;width:100%}
  #collection{width:100%;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));max-height:none}
  #sidedeck{width:100%;grid-template-columns:repeat(5,1fr);gap:10px}
  .sslot{width:auto;height:auto;aspect-ratio:46/56}
  .cell canvas{max-width:none}
  .deckside .kbtn{width:100%;min-width:0}
  .deckbtns{flex-direction:row;width:100%}
  .deckbtns .kbtn{flex:1;min-width:0}
  .match-controls .kbtn{width:100%;min-width:0}
  .ctrl-secondary{width:100%}
  .ctrl-secondary .kbtn{flex:1;min-width:0;width:auto}
}
body{touch-action:auto}
</style>
</head>
<body>
<main id="app">
  <section id="scr-title" class="screen active">
    <div class="logo">PAZAAK</div>
    <div class="logo-sub">OUTER RIM CIRCUIT</div>
    <div class="panel">
      <button id="bt-continue" class="kbtn">CONTINUE CIRCUIT</button>
      <button id="bt-new" class="kbtn">NEW CIRCUIT</button>
      <button id="bt-how" class="kbtn">HOW TO PLAY</button>
      <button id="bt-options" class="kbtn">OPTIONS</button>
      <button id="bt-reset" class="kbtn danger">RESET PROGRESS</button>
    </div>
    <div class="foot">HOLO-TERMINAL BUILD &middot; ZERO ASSETS &middot; ALL CODE</div>
  </section>
  <section id="scr-circuit" class="screen">
    <div class="scrh">OUTER RIM CIRCUIT</div>
    <div id="rungs"></div>
    <button id="bt-cback" class="kbtn">&#9668; TITLE</button>
  </section>
  <section id="scr-deck" class="screen">
    <div class="scrh">SIDE DECK BUILDER</div>
    <div class="deckwrap">
      <div class="panel"><div style="font-size:13px;letter-spacing:3px;color:var(--cyan)">COLLECTION</div><div id="collection"></div></div>
      <div class="panel deckside">
        <div id="deckcount">0 / 10</div>
        <div id="sidedeck"></div>
        <div class="deckbtns">
          <button id="bt-autofill" class="kbtn">AUTO-FILL</button>
          <button id="bt-cleardeck" class="kbtn">CLEAR</button>
        </div>
        <button id="bt-dback" class="kbtn">&#9668; BACK</button>
        <button id="bt-begin" class="kbtn" disabled>BEGIN MATCH</button>
      </div>
    </div>
  </section>
  <section id="scr-match" class="screen">
    <div class="match-wrap">
      <div class="match-board"><canvas id="table"></canvas></div>
      <div class="match-controls">
        <div class="pinfo" id="pinfo"></div>
        <div class="hand" id="hand"></div>
        <div class="ctrl-btns">
          <button id="bt-end" class="kbtn primary">END TURN</button>
          <div class="ctrl-secondary">
            <button id="bt-stand" class="kbtn sm">STAND</button>
            <button id="bt-flip" class="kbtn sm">FLIP</button>
            <button id="bt-forf" class="kbtn sm ghost">FORFEIT</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="modal" class="hidden"><div id="modalbox"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const choice=a=>a[Math.floor(Math.random()*a.length)];
let SLEEP_SCALE=1;
const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms*SLEEP_SCALE)));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rrPath(w,h,r){const p=new Path2D();p.moveTo(r,0);p.lineTo(w-r,0);p.quadraticCurveTo(w,0,w,r);p.lineTo(w,h-r);p.quadraticCurveTo(w,h,w-r,h);p.lineTo(r,h);p.quadraticCurveTo(0,h,0,h-r);p.lineTo(0,r);p.quadraticCurveTo(0,0,r,0);p.closePath();return p;}
function tText(g,text,x,y,size,color,spacing=2,align='center',bold=true,condense=0.94){
  g.save();g.font=(bold?'700 ':'400 ')+size+'px "Arial Narrow",Arial,sans-serif';g.fillStyle=color;g.textBaseline='middle';g.textAlign='left';
  const chars=String(text).toUpperCase().split('');
  let tw=0;const ws=chars.map(ch=>{const cw=g.measureText(ch).width;tw+=cw+spacing;return cw;});
  tw-=spacing;tw*=condense;
  let sx=align==='center'?x-tw/2:align==='right'?x-tw:x;
  g.scale(condense,1);sx/=condense;
  for(let i=0;i<chars.length;i++){g.fillText(chars[i],sx,y);sx+=ws[i]+spacing;}
  g.restore();
}
const AUDIO={
  ctx:null,master:null,vol:0.6,muted:false,
  ensure(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    if(!this.ctx){this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:this.vol;this.master.connect(this.ctx.destination);}
    if(this.ctx.state==='suspended')this.ctx.resume();return true;},
  setVol(v){this.vol=v;if(this.master)this.master.gain.value=this.muted?0:v;},
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:this.vol;},
  tone(type,f0,f1,dur,gain=0.16,delay=0){if(this.muted||!this.ensure())return;
    const t0=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(gain,t0);g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);},
  play(n){switch(n){
    case 'draw':this.tone('triangle',140,30,0.08,0.12);break;
    case 'place':this.tone('sine',280,60,0.12,0.2);break;
    case 'click':this.tone('square',880,1200,0.03,0.07);break;
    case 'bust':this.tone('sawtooth',130,60,0.3,0.18);break;
    case 'win':[440,554.37,659.25].forEach((f,i)=>this.tone('triangle',f,f,0.14,0.14,i*0.11));break;
    case 'lose':this.tone('sawtooth',220,70,0.5,0.13);this.tone('sawtooth',160,50,0.5,0.11,0.18);break;
  }}
};
const CARD_DEFS={};
for(let v=1;v<=6;v++){CARD_DEFS['+'+v]={id:'+'+v,kind:'mod',sign:1,v};CARD_DEFS['-'+v]={id:'-'+v,kind:'mod',sign:-1,v};}
for(let v=1;v<=6;v++)CARD_DEFS['\u00B1'+v]={id:'\u00B1'+v,kind:'dual',v};
CARD_DEFS['TIE']={id:'TIE',kind:'tie',v:1};
CARD_DEFS['DBL']={id:'DBL',kind:'dbl'};
CARD_DEFS['2&4']={id:'2&4',kind:'flip',vals:[2,4]};
CARD_DEFS['3&6']={id:'3&6',kind:'flip',vals:[3,6]};
function makeCard(id){return Object.assign({},CARD_DEFS[id]);}
function mainCard(v){return {id:'m'+v,kind:'main',v};}
function buildMainDeck(){const d=[];for(let v=1;v<=10;v++)for(let c=0;c<4;c++)d.push(mainCard(v));return shuffle(d);}
function cardColor(card,orient=1){
  switch(card.kind){case 'main':return 'green';case 'mod':return card.sign>0?'blue':'red';
  case 'dual':case 'tie':return orient>0?'blue':'red';default:return 'gold';}
}
function cardLabel(card,orient=1){
  switch(card.kind){case 'main':return String(card.v);case 'mod':return (card.sign>0?'+':'-')+card.v;
  case 'dual':case 'tie':return (orient>0?'+':'-')+card.v;case 'dbl':return '\u00D72';case 'flip':return card.vals.join('&');}
}
function tabLabel(card,orient=1){
  switch(card.kind){case 'main':return '';case 'mod':return card.sign>0?'+':'-';
  case 'dual':return orient>0?'+':'-';case 'tie':return '\u00B1';case 'dbl':return '\u00D72';case 'flip':return card.vals.join('\u00B7');}
}
function boardScore(board){let s=0;for(const sl of board)if(sl)s+=sl.eff;return s;}
function boardCount(board){let n=0;for(const sl of board)if(sl)n++;return n;}
function lastSlot(board){for(let i=8;i>=0;i--)if(board[i])return board[i];return null;}
function placeMain(side,card){const i=side.board.findIndex(s=>!s);if(i<0)return -1;side.board[i]={card,eff:card.v,isMain:true};return i;}
function placeSide(side,card,orient){const i=side.board.findIndex(s=>!s);if(i<0)return -1;
  let eff=0;
  if(card.kind==='mod')eff=card.sign*card.v;
  else if(card.kind==='dual'||card.kind==='tie')eff=orient*card.v;
  side.board[i]={card,eff,isMain:false};return i;}
function applyDouble(board){const ls=lastSlot(board);if(!ls)return -1;ls.eff*=2;return 1;}
function applyFlip(board,vals){let n=0;for(const sl of board){if(sl&&sl.isMain&&vals.includes(sl.card.v)&&sl.eff>0){sl.eff=-sl.eff;n++;}}return n;}
function shouldStand(score,snap){
  if(score===20)return true;
  if(score>20)return false;
  const {oppStood,tier,setsO,bustRisk,oppScore}=snap;
  if(tier===1)return score>=18||(oppStood&&score>oppScore);
  if(tier===2)return score>=17||(oppStood&&score>=oppScore)||(score>=16&&bustRisk<0.3);
  return score>=16||(oppStood&&score>=oppScore)||(setsO>=2&&score>=15);
}
function plusFloor(tier){return tier===1?16:15;}
function aiDecide(snap){
  const {score,hand,board,oppScore,oppStood,tier,bustRisk,setsO}=snap;
  const evalS=s2=>s2===20?100:s2+(s2>=17?3:s2>=15?1:0);
  let best=null;const base=evalS(score);
  const pf=plusFloor(tier);
  hand.forEach((card,idx)=>{
    if(!card)return;
    const tryAdd=(orient,val,tag)=>{const s2=score+val;if(s2>20)return;
      if(val>0&&s2<pf)return;
      const v=evalS(s2);if(!best||v>best.v)best={idx,orient,v,tag};};

function resolveAfterDraw(w){
  const S=sideOf(w);S.score=boardScore(S.board);
  if(boardCount(S.board)===9){endSet(w,'fill');return 'end';}
  if(S.score===20){S.stood=true;toast('TWENTY!');return 'stood';}

function beginTurn(w){
  M.turn=w;
  if(sideOf(w).stood){
    if(sideOf(other(w)).stood){resolveStandoff();return;}
    beginTurn(other(w));
    return;
  }
  drawTo(w);
  const res=resolveAfterDraw(w);
  if(res==='end')return;
  if(res==='stood'){
    if(sideOf(other(w)).stood){resolveStandoff();return;}
    beginTurn(other(w));
    return;
  }
  if(w==='p')M.phase='pAction';else{M.phase='oTurn';aiTurn(M.token);}
}
function passToOpp(){beginTurn('o');}

}
function bustRisk(w){
  const S=sideOf(w),rem=M.deck.length;

async function aiTurn(tk){
  await sleep(650);if(!M||tk!==M.token||M.phase!=='oTurn')return;
  await sleep(520);if(!M||tk!==M.token||M.phase!=='oTurn')return;
  const snap={score:M.o.score,board:M.o.board,hand:M.o.hand,oppScore:M.p.score,oppStood:M.p.stood,tier:M.opp.tier,bustRisk:bustRisk('o'),setsO:M.setsO};
  const d=aiDecide(snap);
  if(d.play){
    const card=M.o.hand[d.play.idx];
    AUDIO.play('place');
    if(d.play.tag==='dbl')applyDouble(M.o.board);
    else if(d.play.tag==='flip')applyFlip(M.o.board,card.vals);
    else{const si=placeSide(M.o,card,d.play.orient);if(si>=0)M.anims.deal={who:'o',slot:si,t0:performance.now()};}
    if(card.kind==='tie')M.o.tiebreak=true;
    M.o.hand[d.play.idx]=null;
    M.o.score=boardScore(M.o.board);
    await sleep(430);if(!M||tk!==M.token||M.phase!=='oTurn')return;
    if(M.o.score>20){M.o.bust=true;M.anims.flash={who:'o',t0:performance.now()};AUDIO.play('bust');endSet('p','bust');return;}
    if(boardCount(M.o.board)===9){endSet('o','fill');return;}
    if(M.o.score===20){M.o.stood=true;toast('TWENTY!');
      if(M.p.stood)resolveStandoff();else beginTurn('p');return;}
    if(M.o.score>snap.score||shouldStand(M.o.score,snap)){
      if(M.o.score>20){M.o.bust=true;M.anims.flash={who:'o',t0:performance.now()};AUDIO.play('bust');endSet('p','bust');return;}
      M.o.stood=true;toast(M.opp.name.toUpperCase()+' STANDS');
      if(M.p.stood)resolveStandoff();else beginTurn('p');return;
    }
  }
  if(d.stand){
    M.o.stood=true;toast(M.opp.name.toUpperCase()+' STANDS');
    if(M.p.stood)resolveStandoff();else beginTurn('p');
    return;
  }
  if(M.o.score>20){M.o.bust=true;M.anims.flash={who:'o',t0:performance.now()};AUDIO.play('bust');endSet('p','bust');return;}
  beginTurn('p');
}
function resolveStandoff(){
  const ps=M.p.score,os=M.o.score;
  let winner=null;
  if(ps>os)winner='p';else if(os>ps)winner='o';
  else if(M.p.tiebreak&&!M.o.tiebreak)winner='p';
  else if(M.o.tiebreak&&!M.p.tiebreak)winner='o';
  if(winner){endSet(winner,'score');return;}
  M.phase='over';
  showDialog('THE SET IS TIED.','NO POINT AWARDED',()=>{M.setStarter=other(M.setStarter);startSet();});
}
function endSet(winner,reason){
  M.phase='over';M.sel=-1;
  if(winner==='p'){M.setsP++;AUDIO.play('win');}
  else{M.setsO++;AUDIO.play(reason==='bust'?'bust':'lose');}
  const lines=setEndText(winner,reason);
  showDialog(lines[0],lines[1],()=>{
    if(M.setsP>=3){matchEnd('p');return;}
    if(M.setsO>=3){matchEnd('o');return;}
    M.setStarter=winner;startSet();
  });
}
function setEndText(winner,reason){
  if(winner==='p'){
    if(reason==='bust')return ['YOU WIN THE SET.','OPPONENT BUSTED'];
    if(reason==='fill')return ['YOU WIN THE SET.','BOARD FILLED - NINE CARDS'];
    return ['YOU WIN THE SET.',M.p.score+' TO '+M.o.score];
  }
  if(reason==='bust')return ['OPPONENT WINS THE SET.','YOU WENT BUST'];
  if(reason==='fill')return ['OPPONENT WINS THE SET.','THEIR BOARD FILLED'];
  return ['OPPONENT WINS THE SET.',M.o.score+' TO '+M.p.score];
}
function matchEnd(winner){
  M.phase='done';

    AUDIO.play('win');

      showDialog('YOU WIN THE REMATCH.','',()=>leaveMatch());

      const rung=SAVE.circuit,unlocks=UNLOCK_TABLE[rung]||{};
      for(const id in unlocks)SAVE.unlocked[id]=(SAVE.unlocked[id]||0)+unlocks[id];
      SAVE.circuit=rung+1;persist();
      showResultModal(unlocks);
    }
  }else{
    AUDIO.play('lose');

}

function render(now){
  if(curScreen!=='match'||!M||!ctx)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(STATIC,0,0,W,H);
  if(M.p.score!==M.lastScores.p){M.flashBadge.p=now;M.lastScores.p=M.p.score;}
  if(M.o.score!==M.lastScores.o){M.flashBadge.o=now;M.lastScores.o=M.o.score;}
  drawChannel(ctx,L.chanP,chanState('p'),now);
  drawChannel(ctx,L.chanO,chanState('o'),now);
  drawOrb(ctx,L.orbP,L.orbP.r,orbState('p'),now);
  drawOrb(ctx,L.orbO,L.orbO.r,orbState('o'),now);
  drawBadge(ctx,L.badges[0],M.p.score,M.flashBadge.p,now);
  drawBadge(ctx,L.badges[1],M.o.score,M.flashBadge.o,now);
  for(const who of ['p','o']){
    const S=sideOf(who),grid=who==='p'?L.gridP:L.gridO;
    for(let i=0;i<9;i++){
      const sl=S.board[i];if(!sl)continue;
      const rc=slotRect(grid,Math.floor(i/3),i%3);
      const dp=dealProgress(who,i,now);
      ctx.save();ctx.globalAlpha=dp;
      ctx.translate(rc.x+rc.w/2,rc.y+rc.h/2-(1-dp)*36);
      const sc=0.85+0.15*dp;ctx.scale(sc,sc);
      drawCard(ctx,-(rc.w-6)/2,-(rc.h-6)/2,rc.w-6,rc.h-6,sl.card,{});
      ctx.restore();
    }
  }
  if(M.anims.flash){
    const p=(now-M.anims.flash.t0)/500;
    if(p<1){
      const grid=M.anims.flash.who==='p'?L.gridP:L.gridO;
      ctx.save();ctx.globalAlpha=(1-p)*0.35;ctx.fillStyle='#d02020';
      rr(ctx,grid.x-10,grid.y-10,3*L.sw+2*L.gap+20,3*L.sh+2*L.gap+20,10);ctx.fill();ctx.restore();
    }else M.anims.flash=null;
  }
  if(M.sel>=0&&M.p.hand[M.sel]){
    const card=M.p.hand[M.sel];
    let proj=M.p.score;
    if(card.kind==='dbl'){const ls=lastSlot(M.p.board);proj=ls?M.p.score+ls.eff:M.p.score;}
    else if(card.kind==='flip')proj=null;
    else proj=M.p.score+M.orient*card.v;
    const txt=card.kind==='flip'?'FLIP SIGN':proj>20?'BUST!':'PROJECTED: '+proj;
    tText(ctx,txt,L.proj.x,L.proj.y,12,proj!==null&&proj>20?'#ff6060':'#7fd4ff',2);
  }
  M.toasts=M.toasts.filter(t=>now-t.t0<1300);
  M.toasts.forEach((t,i)=>{
    const p=(now-t.t0)/1300;
    ctx.save();ctx.globalAlpha=p<0.15?p/0.15:1-Math.max(0,(p-0.6))/0.4;
    tText(ctx,t.t,W/2,318-i*22,15,'#bfe8ff',3);
    ctx.restore();
  });
  updateHandDOM();
}

function buildDeckUI(){

function validateDeck(deck){
  const out=[],counts={};
  for(const id of deck||[]){
    counts[id]=(counts[id]||0)+1;
    if(counts[id]<=(SAVE.unlocked[id]||0)&&out.length<10)out.push(id);
  }
  return out;
}
function openDeckBuilder(rung){
  deckRung=rung;

function autoFill(){
  deckSel=[];
  const priority=['\u00B16','\u00B15','\u00B14','\u00B13','\u00B12','\u00B11','TIE','+5','-5','+4','-4','+3','-3','+2','-2','+1','-1','DBL','2&4','3&6'];
  for(const id of priority){
    let avail=SAVE.unlocked[id]||0;
    while(deckSel.length<10&&avail>0){deckSel.push(id);avail--;}
    if(deckSel.length>=10)break;
  }
  AUDIO.play('click');buildDeckUI();
}

  openModal(`<h2>MATCH WON</h2><p>UNLOCKED:</p><div class="mcards">${ids.length?cells:'<p>NO NEW CARDS</p>'}</div><button id="mok" class="kbtn">CONTINUE</button>`);
  document.querySelectorAll('.mcard canvas').forEach((cvs,i)=>drawMini(cvs,ids[i],68,80));
  $('#mok').onclick=()=>{AUDIO.play('click');closeModal();leaveMatch();};
}
function openModal(html){$('#modalbox').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
function openOptions(){
  openModal(
    '<h2>OPTIONS</h2>'+
    '<div class="volrow"><span>VOLUME</span><input id="vol" type="range" min="0" max="100" value="'+Math.round(AUDIO.vol*100)+'"><button id="bt-mute" class="kbtn sm">MUTE</button></div>'+
    '<div class="mrow"><button id="oclose" class="kbtn">CLOSE</button></div>');
  $('#vol').oninput=e=>{AUDIO.setVol(e.target.value/100);SAVE.vol=AUDIO.vol;persist();};
  $('#bt-mute').textContent=AUDIO.muted?'UNMUTE':'MUTE';
  $('#bt-mute').onclick=()=>{AUDIO.setMuted(!AUDIO.muted);SAVE.muted=AUDIO.muted;persist();$('#bt-mute').textContent=AUDIO.muted?'UNMUTE':'MUTE';};
  $('#oclose').onclick=()=>{AUDIO.play('click');closeModal();};
}
function refreshTitle(){
  const done=SAVE.circuit>=SAVE.roster.length;
  const bt=$('#bt-continue');
  if(SAVE.circuit>0){
    bt.style.display='';
    bt.textContent=done?'CIRCUIT COMPLETE - REPLAY':'CONTINUE CIRCUIT';
  }else bt.style.display='none';
}
function metalURL(w,h,base){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  brushed(c.getContext('2d'),0,0,w,h,base,true);
  return c.toDataURL();
}
function loop(t){render(t);requestAnimationFrame(loop);}
function init(){
  initTextures();
  document.documentElement.style.setProperty('--metal',`url(${metalURL(256,256,'#3a3a40')})`);
  AUDIO.vol=SAVE.vol;AUDIO.muted=SAVE.muted;
  if(!SAVE.roster||!SAVE.roster.length){SAVE.roster=buildRoster();persist();}
  const table=$('#table');
  cv=table;ctx=table.getContext('2d');
  fit();
  $('#bt-new').onclick=()=>{AUDIO.play('click');const vol=AUDIO.vol,muted=AUDIO.muted;SAVE=defaultSave();SAVE.vol=vol;SAVE.muted=muted;SAVE.roster=buildRoster();persist();buildCircuit();showScreen('circuit');};
  $('#bt-continue').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-cback').onclick=()=>{AUDIO.play('click');refreshTitle();showScreen('title');};
  $('#bt-how').onclick=()=>{AUDIO.play('click');openModal(
    '<h2>HOW TO PLAY</h2><ul>'+
    '<li>Get closer to 20 than your opponent without going over. First to win 3 sets takes the match.</li>'+
    '<li>Each turn you automatically draw a main deck card (values 1-10) onto your 3x3 board.</li>'+
    '<li>You may then play at most one side-deck card from your 4-card hand, then END TURN or STAND.</li>'+
    '<li>Over 20 is a BUST and loses the set. Exactly 20 auto-stands. Fill all 9 slots without busting for an instant win.</li>'+
    '<li>Tied sets award no point and replay. Your 4 hand cards last the entire match - spend them wisely.</li>'+
    '<li>Click a hand card to arm it, click again to play. FLIP CARD toggles +/- on dual cards.</li>'+
    '<li>Keys: E end turn, S stand, F flip, Enter play/confirm, Esc cancel.</li>'+
    '</ul><button id="mclose" class="kbtn">CLOSE</button>');
    $('#mclose').onclick=()=>{AUDIO.play('click');closeModal();};
  };
  $('#bt-reset').onclick=()=>{AUDIO.play('click');openModal(
    '<h2>RESET PROGRESS</h2><p>THIS WIPES YOUR CIRCUIT PROGRESS AND CARD COLLECTION.</p>'+
    '<div class="mrow"><button id="myes" class="kbtn danger">WIPE IT</button><button id="mno" class="kbtn">KEEP IT</button></div>');
    $('#myes').onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();};
    $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
  };
  $('#bt-options').onclick=()=>{AUDIO.play('click');openOptions();};
  $('#bt-autofill').onclick=autoFill;
  $('#bt-cleardeck').onclick=()=>{AUDIO.play('click');deckSel=[];buildDeckUI();};
  $('#bt-dback').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-begin').onclick=()=>{
    if(deckSel.length!==10)return;
    AUDIO.play('click');
    SAVE.lastDeck=deckSel.slice();persist();
    startMatch(deckRung);
  };
  buildHandDOM();
  $('#bt-end').onclick=()=>endPlayerTurn();
  $('#bt-stand').onclick=()=>playerStand();
  $('#bt-flip').onclick=()=>flipArmed();
  $('#bt-forf').onclick=()=>{AUDIO.play('click');showDialog('FORFEIT THE MATCH?','PROGRESS WILL NOT BE SAVED',()=>{AUDIO.play('lose');leaveMatch();},{cancelText:'NO',onCancel(){}});};
  window.addEventListener('keydown',e=>{
    if(curScreen!=='match'||!M)return;
    const k=e.key.toLowerCase();
    if(matchDlg){
      if(k==='enter'||k===' ')dialogOK();
      else if(k==='escape'&&matchDlg.onCancel)dialogCancel();
      return;
    }
    if(M.phase!=='pAction')return;
    if(k==='e'||k===' ')endPlayerTurn();
    else if(k==='s')playerStand();
    else if(k==='f')flipArmed();
    else if(k==='enter'&&M.sel>=0)confirmPlay(M.sel);
    else if(k==='escape')M.sel=-1;
  });
  window.addEventListener('resize',fit);
  renderStatic();
  refreshTitle();
  requestAnimationFrame(loop);
}
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  computeLayout();
  if(cv){cv.width=W*DPR;cv.height=H*DPR;}
  if(M&&ctx)renderStatic();
}
const HD=120,HH=158;
function buildHandDOM(){
  const h=$('#hand');h.innerHTML='';handEls=[];
  for(let i=0;i<4;i++){
    const el=document.createElement('div');el.className='handcard';
    const cvs=document.createElement('canvas');el.appendChild(cvs);
    el.onclick=()=>{
      if(!M||M.phase!=='pAction'||!M.p.hand[i]||M.p.used[i])return;
      if(M.sel===i)confirmPlay(i);
      else{AUDIO.play('click');M.sel=i;M.orient=1;}
      updateHandDOM();
    };
    h.appendChild(el);handEls.push(el);
  }
}
function updateHandDOM(){
  if(!M||!handEls.length)return;
  const p=M.p;
  for(let i=0;i<4;i++){
    const el=handEls[i],cvs=el.firstChild,g=cvs.getContext('2d');
    const d=Math.min(2,window.devicePixelRatio||1);
    if(cvs.width!==HD*d){cvs.width=HD*d;cvs.height=HH*d;}
    g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,HD,HH);
    const card=p.hand[i];
    el.classList.toggle('sel',M.sel===i);
    el.classList.toggle('used',!!p.used[i]||!card);
    el.classList.toggle('dis',M.phase!=='pAction'||!!p.used[i]||!card);
    if(card)drawCard(g,2,2,HD-4,HH-4,card,{orient:(M.sel===i?M.orient:1)});
    else{rr(g,2,2,HD-4,HH-4,8);g.fillStyle='rgba(0,0,0,0.28)';g.fill();g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=1;g.stroke();}
  }
  const info=$('#pinfo');
  if(M.phase==='pAction'&&M.sel>=0&&p.hand[M.sel]){
    const card=p.hand[M.sel];let proj;
    if(card.kind==='dbl'){const ls=lastSlot(p.board);proj=ls?p.score+ls.eff:p.score;}
    else if(card.kind==='flip')proj=null;
    else proj=p.score+M.orient*card.v;
    info.textContent=card.kind==='flip'?'FLIP SIGN':proj>20?'BUST!':'PROJECTED: '+proj;
    info.style.color=proj!==null&&proj>20?'#ff6060':'#7fd4ff';
  }else if(M.phase==='pAction'){info.textContent='YOUR TURN';info.style.color='#7fd4ff';}
  else if(M.phase==='turn'){info.textContent='…';info.style.color='#9aa2b4';}
  else if(M.phase==='oTurn'){info.textContent='OPPONENT TURN';info.style.color='#e0a0a0';}
  else info.textContent='';
  updateControls();
}
function updateControls(){
  if(!M)return;
  const act=M.phase==='pAction';
  const armed=M.sel>=0?M.p.hand[M.sel]:null;
  const flipOk=act&&armed&&(armed.kind==='dual'||armed.kind==='tie');
  $('#bt-end').disabled=!act;
  $('#bt-stand').disabled=!act;
  $('#bt-flip').disabled=!flipOk;
}
globalThis.PZ={shuffle,buildMainDeck,boardScore,placeMain,placeSide,applyDouble,applyFlip,aiDecide,genSideDeck,generateOpponent,cardLabel,CARD_DEFS,buildRoster,makeCard,
  startSet,beginTurn,endPlayerTurn,playerStand,confirmPlay,endSet,
  newMatchForTest:(deckIds,opp)=>{SAVE.lastDeck=deckIds;newMatch(opp,null);},
  getM:()=>M,setSleepScale:v=>{SLEEP_SCALE=v;}};
if(typeof document!=='undefined'){
  document.addEventListener('DOMContentLoaded',init);
}
</script>
