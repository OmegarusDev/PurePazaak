<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazaak: Outer Rim Circuit</title>
<style>
:root{
  /* KOTOR 1 engine GUI — KotOR.js / PyKotor defaults:
     text/rails RGB(0, 0.658824, 0.980392), highlight RGB(1,1,0).
     In-game panels: teal-cyan 9-slice border, charcoal fill, rounded corners. */
  --abyss:#04050b;
  --navy:#0a0f1c;
  --navy-2:#060a14;
  --well:#020409;
  --bar:#0b1322;
  --line:#2a6a62;
  --line-hi:#3cb8a8;
  --rail:#00a8fa;
  --ink:#c9d4e4;
  --dim:#8b96ab;
  --faint:#5a6376;
  --cyan:#00a8fa;
  --ice:#00a8fa;
  --pale:#7ad4ff;
  --gold:#e8c34a;
  --gold-hi:#ffe14d;
  --select:#ffff4a;
  --green:#46e06a;
  --orange:#e87020;
  --k1:#00a8fa;
  --k1-hi:#ffff4a;
  --tan:#d4c89a;
  --gui-fill:#222224;
  --gui-fill-2:#2a2a2e;
  --gui-edge:#3cb8a8;
  --gui-edge-dim:#1a5c54;
  --gui-edge-hi:#7ae0d4;
  --gui-r:14px;
  /* legacy names (kept for compat) */
  --amber:#e8c34a;
  --red:#e05555;
  /* type — system stacks only, zero-asset.
     Gold lockup: Trajan. Title-menu items ≈ Bank Gothic; Mac stand-in is
     DIN Alternate (square gothic). HUD uses the same stack. */
  --serif:"Trajan Pro",Trajan,Cinzel,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"DIN Alternate","Bank Gothic","Eurostile","Microgramma","Avenir Next Condensed","Century Gothic","Futura","Trebuchet MS",sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* deep-space backdrop: vignette + sparse starfield, pure CSS, zero assets */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1px 1px at 68% 8%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 34%,rgba(190,220,255,.8),transparent 60%),
    radial-gradient(1px 1px at 32% 68%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 55% 82%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 84%,rgba(190,220,255,.6),transparent 60%),
    radial-gradient(1px 1px at 44% 12%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 92% 72%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 24% 44%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 76% 56%,rgba(190,220,255,.5),transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 10%,rgba(20,40,80,.35),transparent 60%),
    radial-gradient(ellipse 140% 120% at 50% 115%,rgba(0,0,0,.85),transparent 55%),
    linear-gradient(180deg,#070b16 0%,#04050b 55%,#020308 100%);
}
#app{position:relative;width:100vw;height:100vh;height:100dvh;z-index:1}
/* Shell: every screen is a centred column that can scroll internally.
   justify-content stays centered for tall viewports; min-height:0 + overflow
   keep short/landscape viewports reachable instead of clipped. */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);overflow-y:auto;min-height:0;padding:clamp(10px,2.5vh,24px) env(safe-area-inset-right) clamp(10px,2.5vh,24px) env(safe-area-inset-left);padding-top:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-top));padding-bottom:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-bottom))}
.screen.active{display:flex}
/* Children never squash (that causes overlap, not scroll); designated wells
   (.deckwrap, #rungs) re-enable shrink + internal scroll. */
.screen > *{flex-shrink:0;min-width:0}
.screen > .deckwrap,
.screen > #rungs,
.screen > #stock{flex:1 1 auto;min-height:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#141416}
::-webkit-scrollbar-thumb{background:var(--gui-edge-dim);border-radius:5px;border:2px solid #141416}
/* KOTOR 1 main-menu bars: charcoal plate, cyan side rails, 2px black gaps.
   Idle text/rails = engine cyan #00A8FA. Hover/select = yellow. */
.kbtn{display:block;position:relative;width:min(420px,92vw);padding:clamp(10px,1.8vmin,15px) clamp(18px,2.4vmin,26px);background:linear-gradient(180deg,#14161a,#0c0e10 50%,#08090a 100%);border:1px solid #000;border-radius:0;color:var(--k1);font-family:var(--sans);font-size:clamp(13px,2.1vmin,16px);font-weight:700;letter-spacing:.14em;text-indent:.04em;text-transform:uppercase;text-align:left;cursor:pointer;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 4px 0 0 var(--k1),inset -4px 0 0 var(--k1)}
.kbtn:hover,.kbtn:focus-visible,.kbtn.sel{color:var(--select);text-shadow:0 0 8px rgba(255,255,74,.4);outline:none;background:linear-gradient(180deg,#181a1e,#101214 50%,#0a0c0e 100%);box-shadow:inset 4px 0 0 var(--select),inset -4px 0 0 var(--select)}
.kbtn:active:not(:disabled){transform:translateY(1px)}
.kbtn:disabled{opacity:.32;cursor:default;color:var(--k1);text-shadow:none;box-shadow:inset 4px 0 0 var(--k1),inset -4px 0 0 var(--k1)}
.kbtn.danger{color:#c07070;box-shadow:inset 4px 0 0 #8a3030,inset -4px 0 0 #8a3030}
.kbtn.danger:hover,.kbtn.danger.sel{color:#ff9a9a;text-shadow:0 0 8px rgba(224,85,85,.35);box-shadow:inset 4px 0 0 #ff8080,inset -4px 0 0 #ff8080}
.kbtn.sm{width:auto;min-width:72px;padding:6px 14px;font-size:11px;letter-spacing:.1em;text-indent:.06em}
/* KOTOR 1 title lockup. Oracle: Screenshot_2026-09-07 758x736.
   STAR WARS wordmark is Helvetica Black (Suzy Rice); Mac stand-in is
   Helvetica Neue Condensed Black. Tracking/width only — no fake flares. */
.kotor-lockup{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:max-content;max-width:96vw;text-align:center;position:relative}
.kotor-lockup::before{content:"";position:absolute;inset:-18% -8%;background:radial-gradient(ellipse at 50% 42%,rgba(48,90,160,.32),transparent 68%);pointer-events:none;z-index:-1}
.sw-mark{display:flex;justify-content:center;align-items:flex-end;font-family:"Helvetica Neue Condensed Black","Helvetica Neue","Arial Black","Futura Condensed ExtraBold",Impact,sans-serif;font-weight:900;font-stretch:condensed;font-kerning:none;font-size:clamp(34px,8.2vh,70px);line-height:.9;letter-spacing:-.05em;color:#e8e4dc;-webkit-text-stroke:.04em #121214;paint-order:stroke fill;transform:scaleY(1.05);transform-origin:center bottom;margin:0 0 .06em;user-select:none}
.sw-mark span{display:inline-block;font-style:normal;transform-origin:center bottom}
.sw-gap{width:.62em;flex:0 0 .62em;letter-spacing:0}
.sw-c{transform:scaleX(1.02)}
.sw-a{transform:scaleX(.94);margin:0 -.01em}
.sw-r{transform:scaleX(1.04)}
.sw-d{transform:scaleX(.98)}
.sw-w{transform:scaleX(1.18);margin:0 -.02em}
.sw-s{transform:scaleX(1.04)}
.kotor-gold{display:flex;flex-direction:column;align-items:center;width:max-content;max-width:96vw}
.logo-main,.logo-or{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:.92;background:linear-gradient(180deg,#fff8d0 0%,#f2d468 28%,#c9a030 64%,#7a5a14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #2a1c08) drop-shadow(0 0 16px rgba(232,195,74,.28));white-space:nowrap}
.logo-main{font-size:clamp(46px,12.5vh,118px);letter-spacing:.1em;padding-left:.1em}
.logo-or{font-size:clamp(20px,5.2vh,46px);letter-spacing:.2em;padding-left:.2em;margin-top:.08em}
/* OF THE bar: dark metal + dual cyan rails, tapering arms (K1 lockup, not gold bars) */
.logo-mid{display:flex;align-items:center;gap:clamp(6px,1.2vw,12px);width:100%;margin:.18em auto .06em}
.logo-ofthe{flex:0 0 auto;font-family:var(--serif);font-size:clamp(10px,1.9vh,15px);letter-spacing:.32em;padding:.16em .72em .12em;color:#e8c34a;border:1.5px solid #5aa8c8;background:linear-gradient(180deg,#1a2430,#0c1018);box-shadow:0 0 8px rgba(0,168,250,.28),inset 0 1px 0 rgba(90,180,210,.2);text-shadow:0 1px 0 #000;white-space:nowrap}
.logo-bar{flex:1 1 auto;height:clamp(7px,1.15vh,11px);background:linear-gradient(180deg,#1c2834,#0a1016);border-top:1.5px solid #5aa8c8;border-bottom:1.5px solid #5aa8c8;box-shadow:0 0 6px rgba(0,168,250,.3)}
.logo-bar:first-child{clip-path:polygon(0 42%,10% 0,100% 0,100% 100%,10% 100%,0 58%)}
.logo-bar:last-child{clip-path:polygon(0 0,90% 0,100% 42%,100% 58%,90% 100%,0 100%)}
/* Barrel oracle: cyan rail bbox ~198x265 on 758x736 (aspect 198/265).
   Superellipse nx=12 ny=3.5: flat top/bottom, mid/top width ≈ 1.10, double rails. */
.kotor-menu-shell{position:relative;width:min(236px,30vw);aspect-ratio:200/268;flex:0 0 auto;isolation:isolate}
.kotor-menu-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.km-fill{fill:#0c1620;fill-opacity:.88}
.km-rail{fill:none;stroke:#6ec4e8;stroke-width:2.35;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(80,180,220,.65))}
.km-rail-in{fill:none;stroke:#3a88a8;stroke-width:1.15;stroke-linejoin:round;opacity:.9}
.km-div{fill:none;stroke:#000;stroke-width:1.05;opacity:.78}
.kotor-menu{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:8.5% 17% 8.5%}
.kotor-menu button{appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;flex:1 1 0;width:100%;margin:0;padding:0 2px;background:transparent;border:0;color:#6ec4e8;font-family:"DIN Alternate",var(--sans);font-size:clamp(11px,1.9vh,15px);font-weight:700;letter-spacing:.16em;word-spacing:.32em;text-indent:.08em;text-transform:uppercase;text-align:center;cursor:pointer;text-shadow:0 0 6px rgba(80,180,255,.25)}
.kotor-menu button:hover,.kotor-menu button:focus-visible,.kotor-menu button.sel{color:#c8c430;text-shadow:0 0 8px rgba(200,196,48,.45);outline:none}
.kotor-menu:hover button.sel:not(:hover){color:#6ec4e8;text-shadow:0 0 6px rgba(80,180,255,.25)}
.kotor-menu button:disabled{opacity:.34;cursor:default;color:#6ec4e8;text-shadow:none}
#scr-title{flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4.2vh,44px);padding:calc(clamp(16px,4vh,48px) + env(safe-area-inset-top)) clamp(16px,5vw,64px) calc(clamp(16px,4vh,36px) + env(safe-area-inset-bottom))}
#scr-title.active{display:flex}
/* In-game GUI panel: rounded teal-cyan rim, plain charcoal fill */
.gui,#modalbox,.panel,#rungs,#stock{
  background:var(--gui-fill);
  border:4px solid var(--gui-edge);
  border-radius:var(--gui-r);
  box-shadow:inset 0 0 0 1px #0c2422,0 0 0 1px #081414,0 14px 36px rgba(0,0,0,.55);
}
.panel{display:flex;flex-direction:column;gap:clamp(8px,2vw,12px);align-items:center;width:min(560px,94vw);padding:clamp(14px,3.5vw,24px) clamp(16px,4vw,28px)}
.scrh{font-family:var(--serif);font-weight:400;font-size:clamp(18px,4.2vw,26px);letter-spacing:.32em;text-indent:.32em;color:var(--gold);text-shadow:0 0 14px rgba(232,195,74,.3),0 2px 0 #000;text-align:center}
.foot{font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--faint);text-align:center}
.volrow{display:flex;align-items:center;gap:12px;color:var(--k1);font-size:12px;letter-spacing:.12em;text-indent:0;padding:12px 20px 0;font-family:var(--sans)}
.volrow input[type=range]{width:min(150px,38vw);accent-color:var(--k1)}
/* KOTOR message box: same GUI frame, no header strip, tan body, small OK */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#modal.hidden{display:none}
#modalbox{width:min(460px,92vw);max-height:86dvh;overflow-y:auto;padding:4px 0 0;display:flex;flex-direction:column;gap:0;align-items:stretch;text-align:left}
#modalbox h2{font-family:var(--sans);font-weight:600;font-size:clamp(13px,3.2vw,16px);letter-spacing:.08em;text-indent:0;color:var(--k1);text-shadow:0 0 8px rgba(0,168,250,.45);background:none;border:0;padding:16px 18px 6px;text-align:left;text-transform:uppercase}
#modalbox p,#modalbox li{font-family:var(--sans);font-size:clamp(12px,3.2vw,14px);letter-spacing:.02em;line-height:1.55;color:var(--tan)}
#modalbox p,#modalbox ul{padding:8px 18px 0}
#modalbox ul{padding-left:36px;text-align:left}
#modalbox .mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:14px 14px 14px}
#modalbox .volrow{padding:10px 18px 0}
/* Dialogue buttons: small rounded teal plates, not menu bars */
#modalbox .kbtn{width:auto;min-width:76px;margin:0;padding:6px 16px;border:2px solid var(--gui-edge);border-radius:8px;background:#2a2a2c;color:var(--k1);letter-spacing:.08em;text-indent:0;text-align:center;box-shadow:none;text-shadow:none;white-space:nowrap;overflow:visible}
#modalbox > .kbtn{margin:8px 14px 14px auto}
#modalbox .kbtn:hover,#modalbox .kbtn:focus-visible{border-color:var(--select);color:var(--select);box-shadow:inset 0 0 0 1px rgba(255,255,74,.35);background:#303034;text-shadow:0 0 8px rgba(255,255,74,.35)}
#modalbox .kbtn.danger{border-color:#a05050;color:#e09090;box-shadow:none}
#modalbox .kbtn.danger:hover{border-color:#ff9a9a;color:#ffc8c8}
.mcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-start;padding:12px 18px 0}
.mcard{display:flex;flex-direction:column;align-items:center;gap:4px}
button.mcard{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;padding:6px 8px;font:inherit;color:inherit}
button.mcard:hover,button.mcard:focus-visible{border-color:var(--select);box-shadow:0 0 12px rgba(255,255,74,.28);outline:none}
.mcard canvas{width:68px;height:auto;aspect-ratio:572/772}
.mcard span{font-size:11px;color:var(--k1);letter-spacing:.12em}
.deckbtns .kbtn{text-align:center}
/* Bottom action rail: back on the left, primary on the right — same place
   from title → circuit → deck so the pointer barely moves. */
.scene-actions{display:flex;gap:8px;width:min(760px,92vw);flex:0 0 auto}
.scene-actions .kbtn{flex:1;min-width:0;width:auto;text-align:center}
.credits{font-size:clamp(10px,1.7vmin,13px);letter-spacing:.28em;color:var(--gold);text-align:center;text-indent:.28em}
.store-note{font-size:clamp(10px,1.5vmin,12px);letter-spacing:.08em;color:var(--tan);text-align:center;width:min(760px,92vw)}
#stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(88px,100%),1fr));gap:10px;width:min(760px,92vw);flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px;align-content:start}
#scr-store{justify-content:flex-start;align-items:center}
#scr-store > .scene-actions{width:min(480px,92vw)}
#rungs{display:flex;flex-direction:column;gap:6px;width:min(760px,92vw);overflow-y:auto;min-height:0;padding:10px}
#scr-circuit{justify-content:flex-start;align-items:center}
#scr-circuit > .scene-actions{width:min(760px,94vw)}
/* Listbox protoitem: charcoal row, teal rim, cyan type, yellow when picked */
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 14px;background:linear-gradient(180deg,#26262a,#1a1a1e);border:1px solid var(--gui-edge-dim);border-radius:8px;min-width:0}
.rung.next,.rung.done{cursor:pointer}
.rung.next{border-color:var(--gui-edge)}
.rung.next:hover,.rung.done:hover{border-color:var(--select);box-shadow:0 0 12px rgba(255,255,74,.22)}
.rung.pick{border-color:var(--select);box-shadow:0 0 14px rgba(255,255,74,.28),inset 0 0 12px rgba(255,255,74,.06)}
.rung.locked{opacity:.38;cursor:default}
.tier{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.05em;color:#0c0c10;border:1px solid #000}
.tier.t1{background:linear-gradient(180deg,#9a9aa4,#54545e)}
.tier.t2{background:linear-gradient(180deg,#5a70f0,#22348e);color:#dfe6ff}
.tier.t3{background:linear-gradient(180deg,#e05050,#7a1414);color:#ffe0e0}
.rtext{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.rname{font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--k1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rung.pick .rname{color:var(--select)}
.rtitle{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.rstat{font-size:10px;letter-spacing:.16em;text-align:right;white-space:nowrap;color:var(--k1)}
.rung.next .rstat{color:var(--select)}
.rung.done{opacity:.9}
.rung.done .rstat{color:var(--green)}
.rung.done:not(.pick):hover{border-color:var(--green)}
.rung.locked .rstat{color:var(--faint)}
@media (max-height:520px){
  .rung{padding:6px 12px;gap:8px}
  .tier{width:26px;height:26px;font-size:11px}
  .rname{font-size:13px}
}
/* Deck builder: viewport-filling layout, no dead void, headers never clip.
   Landscape: side-by-side stretched panels, collection grid takes spare height.
   Portrait: stacked; collection panel flexes, its grid scrolls internally. */
#scr-deck{container-type:size;container-name:deck;justify-content:flex-start}
.deckwrap{display:flex;gap:16px;align-items:stretch;justify-content:center;width:min(980px,96vw);flex:1 1 auto;min-height:0;min-width:0;flex-wrap:nowrap}
/* Collection panel is a flex column: fixed header + growing scroll well */
.deckwrap .panel{flex:1 1 320px;min-width:min(320px,100%);min-height:0;max-width:560px;width:auto;display:flex;flex-direction:column}
.deckhead{flex:0 0 auto;font-size:clamp(10px,1.6cqh,12px);letter-spacing:.18em;text-indent:.18em;color:var(--k1)}
#collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(88px,100%),1fr));gap:clamp(6px,1.2cqh,10px);width:100%;flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px;align-content:start;align-items:start}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:linear-gradient(180deg,#2a2a2e,#1a1a1e);border:1px solid var(--gui-edge-dim);border-radius:8px;cursor:pointer;min-width:0;min-height:0;box-shadow:inset 0 0 0 1px rgba(138,244,240,.12)}
.cell:hover{border-color:var(--select);box-shadow:0 0 10px rgba(255,255,74,.25),inset 0 0 0 1px rgba(255,255,74,.2)}
.cell.maxed{opacity:.45;cursor:default}
.cell.maxed:hover{border-color:var(--gui-edge-dim);box-shadow:inset 0 0 0 1px rgba(138,244,240,.12)}
/* Cards scale with viewport height but never exceed column width */
.cell canvas{width:min(100%,14cqh);max-width:76px;height:auto;aspect-ratio:572/772;min-height:0}
.cell .cnt{font-size:clamp(8px,1.4cqh,10px);letter-spacing:.08em;color:var(--dim);white-space:nowrap}
/* Side deck column: fixed content, vertically centred in stretched panel */
.deckside{display:flex;flex-direction:column;gap:clamp(8px,1.6cqh,12px);align-items:center;justify-content:center;flex:0 1 320px;min-width:min(300px,100%);min-height:0;width:100%;max-width:340px}
#deckcount{font-size:clamp(15px,2.6cqh,19px);font-weight:600;letter-spacing:.3em;text-indent:.3em;color:var(--gold)}
#deckcount.full{color:var(--green);text-shadow:0 0 10px rgba(70,224,106,.5)}
#sidedeck{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.sslot{width:100%;aspect-ratio:572/772;max-height:17cqh;border:1px dashed var(--gui-edge-dim);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(180deg,#1a1a1e,#101014);min-width:0;min-height:0;margin:auto;box-shadow:inset 0 0 10px rgba(0,0,0,.55)}
.sslot:hover{border-color:var(--gui-edge);border-style:solid}
.sslot canvas{width:100%;height:100%;object-fit:contain;min-height:0}
.deckbtns{display:flex;gap:8px;width:100%}
.deckbtns .kbtn{flex:1;min-width:0;width:auto;font-size:11px}
.deckside > .scene-actions{width:100%}
@media (max-width:600px){
  .deckbtns .kbtn{font-size:10px;letter-spacing:.14em;text-indent:.14em}
}
/* Match: the metal table is the whole HUD. */
#scr-match{padding:0;justify-content:stretch;align-items:stretch}
.match-wrap{display:flex;flex-direction:row;align-items:stretch;justify-content:center;width:100%;height:100%;min-height:0;padding:0;gap:0}
.match-board{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;flex:1 1 auto;width:100%;height:100%}
#table{width:100%;height:100%;object-fit:fill;touch-action:none;min-width:0;min-height:0;cursor:default}
/* Portrait match is a stacked table; deck still pins headers. */
@media (orientation:portrait){
  #scr-title{padding:calc(clamp(20px,5vh,40px) + env(safe-area-inset-top)) clamp(12px,5vw,32px) calc(clamp(16px,3.5vh,28px) + env(safe-area-inset-bottom));gap:clamp(14px,3vh,28px)}
  .kotor-menu-shell{width:min(280px,72vw)}
  .match-wrap{flex-direction:column;justify-content:center;align-items:stretch;padding:0;gap:0}
  .match-board{flex:1 1 auto;width:100%;min-height:0}
  #scr-deck{gap:8px;justify-content:flex-start}
  /* Stacked: collection panel flexes and its grid scrolls internally so the
     COLLECTION header and the whole side-deck column stay pinned. */
  .deckwrap{flex-wrap:nowrap;flex-direction:column;align-items:stretch;overflow:visible}
  .deckwrap .panel{flex:1 1 auto;min-height:0;max-width:none}
  #collection{grid-template-columns:repeat(5,1fr);max-height:none}
  .deckside{flex:0 0 auto;max-width:none;width:100%}
}
@media (orientation:landscape){
  .logo-main{font-size:clamp(44px,11vh,104px)}
  .logo-or{font-size:clamp(18px,4.4vh,40px)}
  .sw-mark{font-size:clamp(30px,7.4vh,62px)}
  #scr-title.active{align-items:center;justify-content:center;gap:clamp(12px,3.2vh,36px)}
  .kotor-menu-shell{width:min(228px,28vw)}
}
@media (orientation:landscape) and (max-width:700px){
  #scr-deck{justify-content:flex-start}
  .deckwrap{flex-wrap:wrap;flex:0 0 auto;align-items:center}
  .deckwrap .panel,.deckside{flex:1 1 100%;max-width:520px}
  #collection{max-height:52dvh}
}
/* Short landscape (phones tilted, small windows): top-anchor so tall
   content stays reachable by scroll instead of clipping above the fold. */
@media (orientation:landscape) and (max-height:520px){
  .screen{justify-content:flex-start;gap:8px}
  #scr-title.active{padding:8px 3vw 10px;gap:10px;justify-content:center}
  .logo-main{font-size:clamp(32px,8vh,64px)}
  .kotor-menu-shell{width:min(210px,28vw)}
  .kotor-menu button{font-size:11px;letter-spacing:.16em}
  .kbtn{padding:8px 14px;font-size:12px}
  .deckside{justify-content:flex-start;overflow-y:auto}
  .sslot{max-height:12cqh}
}

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const choice=a=>a[Math.floor(Math.random()*a.length)];
// RefPlus 572x772. Every drawn card letterboxes into this aspect so wells,
// badge, and plate stay in the measured places at catalog/hand/table sizes.
const CARD_ASPECT=572/772;
function fitCard(w,h){
  let cw=w,ch=w/CARD_ASPECT;
  if(ch>h){ch=h;cw=h*CARD_ASPECT;}
  return {ox:(w-cw)/2,oy:(h-ch)/2,w:cw,h:ch};
}
function cardChamfer(w,frac){return Math.max(0.55,frac*w);}
function mulberry(seed){
  let s=seed>>>0;
  return function(){s+=0x6D2B79F5;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
}
let SLEEP_SCALE=1;
const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms*SLEEP_SCALE)));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rrPath(w,h,r){const p=new Path2D();p.moveTo(r,0);p.lineTo(w-r,0);p.quadraticCurveTo(w,0,w,r);p.lineTo(w,h-r);p.quadraticCurveTo(w,h,w-r,h);p.lineTo(r,h);p.quadraticCurveTo(0,h,0,h-r);p.lineTo(0,r);p.quadraticCurveTo(0,0,r,0);p.closePath();return p;}
const HUD_FONT='"DIN Alternate","Bank Gothic","Eurostile","Avenir Next Condensed","Century Gothic","Futura","Trebuchet MS",sans-serif';
function drawKeyHint(g,x,y,kind,col,btnH){
  g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.3;
  if(kind==='return'){
    const fs=Math.max(10,Math.round(btnH*0.38));
    g.textAlign='center';g.textBaseline='middle';
    g.font=`600 ${fs}px ${HUD_FONT}`;
    g.fillText('\u23CE',x,y+0.5);
  }else{
    const w=Math.max(20,btnH*0.78), h=Math.max(9,btnH*0.34);
    rr(g,x-w/2,y-h/2,w,h,h/2);g.fill();
    g.fillStyle='#141418';
    g.textAlign='center';g.textBaseline='middle';
    g.font=`700 ${Math.max(8,Math.round(h*0.72))}px ${HUD_FONT}`;
    g.fillText('\u2423',x,y+0.5);
  }
  g.restore();
}
function tText(g,text,x,y,size,color,spacing=1.4,align='center',bold=true,condense=1){
  g.save();g.font=(bold?'700 ':'400 ')+size+'px '+HUD_FONT;g.fillStyle=color;g.textBaseline='middle';g.textAlign='left';
  const chars=String(text).toUpperCase().split('');
  let tw=0;const ws=chars.map(ch=>{const cw=g.measureText(ch).width;tw+=cw+spacing;return cw;});
  tw-=spacing;tw*=condense;
  let sx=align==='center'?x-tw/2:align==='right'?x-tw:x;
  g.scale(condense,1);sx/=condense;
  for(let i=0;i<chars.length;i++){g.fillText(chars[i],sx,y);sx+=ws[i]+spacing;}
  g.restore();
}
const AUDIO={
  ctx:null,master:null,vol:0.6,muted:false,
  ensure(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    if(!this.ctx){this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:this.vol;this.master.connect(this.ctx.destination);}
    if(this.ctx.state==='suspended')this.ctx.resume();return true;},
  setVol(v){this.vol=v;if(this.master)this.master.gain.value=this.muted?0:v;},
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:this.vol;},
  tone(type,f0,f1,dur,gain=0.16,delay=0){if(this.muted||!this.ensure())return;
    const t0=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(gain,t0);g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+0.02);},
  play(n){switch(n){
    case 'draw':this.tone('triangle',140,30,0.08,0.12);break;
    case 'place':this.tone('sine',280,60,0.12,0.2);break;
    case 'click':this.tone('square',880,1200,0.03,0.07);break;
    case 'bust':this.tone('sawtooth',130,60,0.3,0.18);break;
    case 'win':[440,554.37,659.25].forEach((f,i)=>this.tone('triangle',f,f,0.14,0.14,i*0.11));break;
    case 'lose':this.tone('sawtooth',220,70,0.5,0.13);this.tone('sawtooth',160,50,0.5,0.11,0.18);break;
  }}
};
const CARD_DEFS={};
for(let v=1;v<=6;v++){CARD_DEFS['+'+v]={id:'+'+v,kind:'mod',sign:1,v};CARD_DEFS['-'+v]={id:'-'+v,kind:'mod',sign:-1,v};}
for(let v=1;v<=6;v++)CARD_DEFS['\u00B1'+v]={id:'\u00B1'+v,kind:'dual',v};
CARD_DEFS['TIE']={id:'TIE',kind:'tie',v:1};
CARD_DEFS['DBL']={id:'DBL',kind:'dbl'};
CARD_DEFS['2&4']={id:'2&4',kind:'flip',vals:[2,4]};
CARD_DEFS['3&6']={id:'3&6',kind:'flip',vals:[3,6]};
CARD_DEFS['1\u00B12']={id:'1\u00B12',kind:'flex',vals:[1,2]};
function makeCard(id){return Object.assign({},CARD_DEFS[id]);}
function mainCard(v){return {id:'m'+v,kind:'main',v};}
function buildMainDeck(){const d=[];for(let v=1;v<=10;v++)for(let c=0;c<4;c++)d.push(mainCard(v));return shuffle(d);}
function isSpecialKind(kind){return kind==='tie'||kind==='dbl'||kind==='flip'||kind==='flex';}
function canFlip(card){return !!(card&&(card.kind==='dual'||card.kind==='tie'||card.kind==='flex'));}
function cardColor(card,orient=1){
  switch(card.kind){case 'main':return 'green';case 'mod':return card.sign>0?'blue':'red';
  case 'dual':return orient>0?'blue':'red';default:return 'gold';}
}
function cardLabel(card,orient=1,varV=1,catalog=false){
  switch(card.kind){
    case 'main':return String(card.v);
    case 'mod':return (card.sign>0?'+':'-')+card.v;
    case 'dual':return (orient>0?'+':'-')+card.v;
    case 'tie':return (orient>0?'+':'-')+'1T';
    case 'dbl':return 'D';
    case 'flip':return card.vals.join('&');
    case 'flex':return catalog?'1\u00B12':(orient>0?'+':'-')+varV;
    default:return '';
  }
}
function playValue(card,orient=1,varV=1){
  if(card.kind==='mod')return card.sign*card.v;
  if(card.kind==='dual'||card.kind==='tie')return orient*card.v;
  if(card.kind==='flex')return orient*(varV||1);
  return 0;
}
function faceVal(sl){
  if(!sl||!sl.card)return null;
  const k=sl.card.kind;
  if(k==='main'||k==='mod'||k==='dual'||k==='tie')return sl.card.v;
  if(k==='flex')return Math.abs(sl.eff);
  return null;
}
function boardScore(board){let s=0;for(const sl of board)if(sl)s+=sl.eff;return s;}
function boardCount(board){let n=0;for(const sl of board)if(sl)n++;return n;}
function lastSlot(board){for(let i=8;i>=0;i--)if(board[i])return board[i];return null;}
function placeMain(side,card){const i=side.board.findIndex(s=>!s);if(i<0)return -1;side.board[i]={card,eff:card.v,isMain:true};return i;}
function placeSide(side,card,orient,varV){const i=side.board.findIndex(s=>!s);if(i<0)return -1;
  const eff=playValue(card,orient,varV);
  side.board[i]={card,eff,isMain:false};return i;}
function applyDouble(board){const ls=lastSlot(board);if(!ls)return -1;ls.eff*=2;return 1;}
function applyFlip(board,vals){let n=0;for(const sl of board){const v=faceVal(sl);if(v!=null&&vals.includes(v)&&sl.eff>0){sl.eff=-sl.eff;n++;}}return n;}
function slotOrient(sl){return sl&&sl.eff<0?-1:1;}
function slotVarV(sl){return sl&&sl.card&&sl.card.kind==='flex'?Math.abs(sl.eff):1;}
function shouldStand(score,snap){
  if(score===20)return true;
  if(score>20)return false;
  const {oppStood,tier,setsO,bustRisk,oppScore}=snap;
  if(tier===1)return score>=18||(oppStood&&score>oppScore);
  if(tier===2)return score>=17||(oppStood&&score>=oppScore)||(score>=16&&bustRisk<0.3);
  return score>=16||(oppStood&&score>=oppScore)||(setsO>=2&&score>=15);
}
function plusFloor(tier){return tier===1?16:15;}
function aiDecide(snap){
  const {score,hand,board,oppScore,oppStood,tier,bustRisk,setsO}=snap;
  const evalS=s2=>s2===20?100:s2+(s2>=17?3:s2>=15?1:0);
  let best=null;const base=evalS(score);
  const pf=plusFloor(tier);
  hand.forEach((card,idx)=>{
    if(!card)return;
    const tryAdd=(orient,val,tag)=>{const s2=score+val;if(s2>20)return;
      if(val>0&&s2<pf)return;
      const v=evalS(s2);if(!best||v>best.v)best={idx,orient,v,tag};};
    if(card.kind==='mod')tryAdd(card.sign,card.sign*card.v,'mod');
    else if(card.kind==='dual'||card.kind==='tie'){tryAdd(1,card.v,'mod');tryAdd(-1,-card.v,'mod');}
    else if(card.kind==='flex'){for(const o of [1,-1])for(const vv of [1,2]){const s2=score+o*vv;if(s2>20)continue;if(o>0&&s2<pf)continue;const v=evalS(s2);if(!best||v>best.v)best={idx,orient:o,varV:vv,v,tag:'flex'};}}
    else if(card.kind==='dbl'){const ls=lastSlot(board);if(ls){const s2=score+ls.eff;if(s2<=20&&!(ls.eff>0&&s2<pf)){const v=evalS(s2)+(s2===20?5:0);if(!best||v>best.v)best={idx,orient:1,v,tag:'dbl'};}}}
    else if(card.kind==='flip'){let s2=score;for(const sl of board){const fv=faceVal(sl);if(fv!=null&&card.vals.includes(fv)&&sl.eff>0)s2-=2*sl.eff;}
      if(s2!==score&&s2<=20){const v=evalS(s2)+(s2>=14&&s2<=17?2:0);if(!best||v>best.v)best={idx,orient:1,v,tag:'flip'};}}
  });
  const thr=tier===1?3:tier===2?3:2;
  const play=best&&best.v>base+thr?best:null;
  const stand=shouldStand(score,snap);
  return {play,stand};
}
const STARTER_COLLECTION={'+1':2,'+2':2,'+3':2,'-1':2,'-2':2,'-3':2};
const START_CREDITS=400;
const STORE_CAP=4;
const OPP_POOLS={
  1:['+1','+1','+2','+2','+3','+3','-1','-1','-2','-2','-3','-3','+4','+4','+4','-4','-4','-4','+5','-5','+6','-6'],
  2:['+3','-3','+4','+4','-4','-4','+5','-5','+6','-6','\u00B11','\u00B12','\u00B13','\u00B11','\u00B12'],
  3:['\u00B13','\u00B14','\u00B15','+5','-5','+6','-6','TIE','DBL','2&4','3&6','1\u00B12']
};
function genSideDeck(tier){
  const d=[];
  if(tier===3){const sp=['TIE','DBL','2&4','3&6','1\u00B12'];d.push(choice(sp),choice(sp));}
  const pool=OPP_POOLS[tier];
  while(d.length<10)d.push(choice(pool));
  if(tier===1&&d.every(id=>isClutterId(id)))d[0]=choice(['+4','-4','+5','-5','+6','-6']);

  tText(g,'PLAYER HAND',L.labP.x+L.labP.w/2,L.labP.y+L.labP.h/2+1,L.fsLab||13,sk.lab,1.2);
  tText(g,'OPPONENT HAND',L.labO.x+L.labO.w/2,L.labO.y+L.labO.h/2+1,L.fsLab||13,sk.lab,1.2);
  for(const h of [L.handP,L.handO]){
    if(!h)continue;
    for(let i=0;i<4;i++)drawSlot(g,handSlot(h,i));
  }
}
function projectedScore(card){
  if(!M||!card)return null;
  if(card.kind==='dbl'){const ls=lastSlot(M.p.board);return ls?M.p.score+ls.eff:M.p.score;}
  if(card.kind==='flip')return null;
  return M.p.score+playValue(card,M.orient,M.varV);
}
function tableUI(){
  const act=!!(M&&M.phase==='pAction');
  const armed=act&&M.sel>=0?M.p.hand[M.sel]:null;
  return {act,armed,flipOk:!!(armed&&canFlip(armed))};
}
function render(now){
  if(curScreen!=='match'||!M||!ctx)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(STATIC,0,0,W,H);
  if(M.p.score!==M.lastScores.p){M.flashBadge.p=now;M.lastScores.p=M.p.score;}
  if(M.o.score!==M.lastScores.o){M.flashBadge.o=now;M.lastScores.o=M.o.score;}
  drawChannel(ctx,L.chanP,chanState('p'),now);
  drawChannel(ctx,L.chanO,chanState('o'),now);
  drawOrb(ctx,L.orbP,L.orbP.r,orbState('p'),now);
  drawOrb(ctx,L.orbO,L.orbO.r,orbState('o'),now);
  drawBadge(ctx,L.badges[0],M.p.score,M.flashBadge.p,now);
  drawBadge(ctx,L.badges[1],M.o.score,M.flashBadge.o,now);
  if(L.handO){
    for(let i=0;i<4;i++){
      const rct=handSlot(L.handO,i);
      if(M.o.hand[i])drawCard(ctx,rct.x,rct.y,rct.w,rct.h,null,{back:true});
    }
  }
  if(L.handP){
    for(let i=0;i<4;i++){
      const rct=handSlot(L.handP,i),card=M.p.hand[i];
      if(!card)continue;
      const armed=M.sel===i;
      drawCard(ctx,rct.x,rct.y,rct.w,rct.h,card,{
        orient:armed?M.orient:1, varV:armed?M.varV:1, selected:armed
      });
    }
  }
  for(const who of ['p','o']){
    const S=sideOf(who),grid=who==='p'?L.gridP:L.gridO;
    for(let i=0;i<9;i++){
      const sl=S.board[i];if(!sl)continue;
      const rc=slotRect(grid,Math.floor(i/3),i%3);
      const dp=dealProgress(who,i,now);
      ctx.save();ctx.globalAlpha=dp;
      ctx.translate(rc.x+rc.w/2,rc.y+rc.h/2-(1-dp)*36);
      const sc=0.85+0.15*dp;ctx.scale(sc,sc);
      drawCard(ctx,-(rc.w-6)/2,-(rc.h-6)/2,rc.w-6,rc.h-6,sl.card,{
        orient:slotOrient(sl), varV:slotVarV(sl)
      });
      ctx.restore();
    }
  }
  const ui=tableUI();
  drawTableButton(ctx,L.btnFlip,'FLIP',{dim:!ui.flipOk,lit:ui.flipOk});
  drawTableButton(ctx,L.btnEnd,'END TURN',{dim:!ui.act,lit:ui.act,hint:'space'});
  drawTableButton(ctx,L.btnStand,'STAND',{dim:!ui.act,hint:'return'});
  drawTableButton(ctx,L.btnForf,'FORFEIT',{ghost:true});
  if(M.anims.flash){
    const p=(now-M.anims.flash.t0)/500;
    if(p<1){
      const grid=M.anims.flash.who==='p'?L.gridP:L.gridO;
      ctx.save();ctx.globalAlpha=(1-p)*0.35;ctx.fillStyle='#d02020';
      const gx=L.gapX!=null?L.gapX:L.gap, gy=L.gapY!=null?L.gapY:L.gap;
      rr(ctx,grid.x-10,grid.y-10,3*L.sw+2*gx+20,3*L.sh+2*gy+20,10);ctx.fill();ctx.restore();
    }else M.anims.flash=null;
  }
  if(ui.armed){
    const proj=projectedScore(ui.armed);
    const txt=ui.armed.kind==='flip'?'FLIP SIGN':proj>20?'BUST!':'PROJECTED: '+proj;
    tText(ctx,txt,L.proj.x,L.proj.y,L.fsProj||12,proj!==null&&proj>20?'#ff6060':'#7fd4ff',2);
  }
  M.toasts=M.toasts.filter(t=>now-t.t0<1300);
  M.toasts.forEach((t,i)=>{
    const p=(now-t.t0)/1300;
    ctx.save();ctx.globalAlpha=p<0.15?p/0.15:1-Math.max(0,(p-0.6))/0.4;
    tText(ctx,t.t,W/2,(L.toastY||H*0.414)-i*Math.round(22*H/768),15,'#bfe8ff',3);
    ctx.restore();
  });
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='scr-'+id));
  curScreen=id;
  refreshCredits();
}
let circuitSel=0;
function circuitDefaultSel(){return Math.min(SAVE.circuit,Math.max(0,SAVE.roster.length-1));}
function clampCircuitSel(){
  if(circuitSel==null||circuitSel<0||circuitSel>=SAVE.roster.length||circuitSel>SAVE.circuit)
    circuitSel=circuitDefaultSel();
}
function buildCircuit(){
  clampCircuitSel();
  const wrap=$('#rungs');wrap.innerHTML='';
  SAVE.roster.forEach((opp,i)=>{
    const st=i<SAVE.circuit?'done':i===SAVE.circuit?'next':'locked';
    const div=document.createElement('div');
    div.className='rung '+st+(i===circuitSel?' pick':'');
    div.innerHTML=`<span class="tier t${opp.tier}">${['I','II','III'][opp.tier-1]}</span>`+
      `<span class="rtext"><span class="rname">${opp.name}</span>`+
      `<span class="rtitle">${opp.title.toUpperCase()}</span></span>`+
      `<span class="rstat">${st==='done'?'WON':st==='next'?'NEXT':'LOCKED'}</span>`;
    if(st!=='locked')div.onclick=()=>{AUDIO.play('click');circuitSel=i;buildCircuit();};
    wrap.appendChild(div);
  });
  const st=circuitSel<SAVE.circuit?'done':circuitSel===SAVE.circuit?'next':'locked';
  const bt=$('#bt-challenge');
  const opp=SAVE.roster[circuitSel];
  const w=opp?matchWager(opp.tier):50;
  bt.disabled=st==='locked';
  bt.textContent=st==='done'?'REPLAY  \u00B7  '+w+' CR':st==='next'?'CHALLENGE  \u00B7  '+w+' CR':'LOCKED';
  bt.classList.toggle('sel',st!=='locked');
  refreshCredits();
}
const DECK_ORDER=['+1','+2','+3','+4','+5','+6','-1','-2','-3','-4','-5','-6','\u00B11','\u00B12','\u00B13','\u00B14','\u00B15','\u00B16','TIE','DBL','2&4','3&6','1\u00B12'];
function ownedIds(){return DECK_ORDER.filter(id=>(SAVE.unlocked[id]||0)>0);}
function inDeckCount(id){return deckSel.filter(x=>x===id).length;}
function drawMini(cvs,id,w=64,h){
  if(h==null)h=Math.round(w/CARD_ASPECT);
  const d=Math.min(2,window.devicePixelRatio||1);
  cvs.width=w*d;cvs.height=h*d;
  const g=cvs.getContext('2d');g.setTransform(d,0,0,d,0,0);
  drawCard(g,2,2,w-4,h-4,makeCard(id),{glow:false,catalog:true});
}
function buildDeckUI(){
  const col=$('#collection');col.innerHTML='';
  ownedIds().forEach(id=>{
    const owned=SAVE.unlocked[id],used=inDeckCount(id);
    const cell=document.createElement('div');
    cell.className='cell'+(used>=owned?' maxed':'');
    const cvs=document.createElement('canvas');
    cell.appendChild(cvs);
    const cnt=document.createElement('span');
    cnt.className='cnt';cnt.textContent='\u00D7'+owned+(used?' \u00B7 IN DECK '+used:'');
    cell.appendChild(cnt);
    drawMini(cvs,id);
    cell.onclick=()=>{
      if(deckSel.length>=10||inDeckCount(id)>=owned)return;
      AUDIO.play('click');deckSel.push(id);buildDeckUI();
    };
    col.appendChild(cell);
  });
  const sd=$('#sidedeck');sd.innerHTML='';
  for(let i=0;i<10;i++){
    const slot=document.createElement('div');
    slot.className='sslot';
    if(deckSel[i]){
      const cvs=document.createElement('canvas');
      slot.appendChild(cvs);drawMini(cvs,deckSel[i]);
      slot.onclick=()=>{AUDIO.play('click');deckSel.splice(i,1);buildDeckUI();};
    }
    sd.appendChild(slot);
  }
  const dc=$('#deckcount');
  dc.textContent=deckSel.length+' / 10';
  dc.classList.toggle('full',deckSel.length===10);
  const begin=$('#bt-begin');
  const opp=SAVE.roster[deckRung], wager=opp?matchWager(opp.tier):50;
  const ready=deckSel.length===10, broke=SAVE.credits<wager;
  begin.disabled=!ready||broke;
  begin.textContent=!ready?'BEGIN MATCH':broke?'NEED '+wager+' CR':'BEGIN  \u00B7  '+wager+' CR';
  begin.classList.toggle('sel',ready&&!broke);
}
function validateDeck(deck){
  const out=[],counts={};
  for(const id of deck||[]){
    counts[id]=(counts[id]||0)+1;
    if(counts[id]<=(SAVE.unlocked[id]||0)&&out.length<10)out.push(id);
  }
  return out;
}
function openDeckBuilder(rung){
  deckRung=rung;
  deckSel=validateDeck(SAVE.lastDeck);
  buildDeckUI();
  showScreen('deck');
}
function autoFill(){
  deckSel=[];
  const priority=['1\u00B12','\u00B16','\u00B15','\u00B14','\u00B13','\u00B12','\u00B11','TIE','+5','-5','+4','-4','+3','-3','+2','-2','+1','-1','DBL','2&4','3&6'];
  for(const id of priority){
    let avail=SAVE.unlocked[id]||0;
    while(deckSel.length<10&&avail>0){deckSel.push(id);avail--;}
    if(deckSel.length>=10)break;
  }
  AUDIO.play('click');buildDeckUI();
}
function spoilList(){
  const counts={};
  if(M&&M.o&&M.o.side)for(const c of M.o.side)counts[c.id]=(counts[c.id]||0)+1;
  return DECK_ORDER.filter(id=>counts[id]).map(id=>({id,n:counts[id]}));
}
function showSpoilsModal(wager,rematch){
  const list=spoilList();
  const clutter=list.length>0&&list.every(x=>isClutterId(x.id));
  const cells=list.map((x,i)=>'<button type="button" class="mcard spoil" data-i="'+i+'"><canvas></canvas><span>'+(x.n>1?'\u00D7'+x.n:'TAKE')+'</span></button>').join('');
  openModal(
    '<h2>'+(rematch?'REMATCH WON':'MATCH WON')+'</h2>'+
    '<p>+'+wager+' CR. '+(clutter?'THEIR DECK IS MOSTLY CLUTTER \u2014 TAKE ONE, OR SKIP.':'TAKE ONE CARD FROM THEIR SIDE DECK.')+'</p>'+
    '<div class="mcards">'+(cells||'<p>NO CARDS TO TAKE</p>')+'</div>'+
    '<div class="mrow"><button id="mskip" class="kbtn">SKIP</button></div>');
  document.querySelectorAll('.mcard.spoil canvas').forEach((cvs,i)=>drawMini(cvs,list[i].id,68));
  document.querySelectorAll('.mcard.spoil').forEach((btn,i)=>{
    btn.onclick=()=>{
      AUDIO.play('click');
      addToCollection(list[i].id);persist();
      closeModal();leaveMatch();
    };
  });
  $('#mskip').onclick=()=>{AUDIO.play('click');closeModal();leaveMatch();};
}
function buildStoreUI(){
  const wrap=$('#stock');if(!wrap)return;
  wrap.innerHTML='';
  storeStock().forEach(id=>{
    const price=CARD_PRICE[id], owned=SAVE.unlocked[id]||0, maxed=owned>=STORE_CAP, broke=SAVE.credits<price;
    const cell=document.createElement('div');
    cell.className='cell'+(maxed||broke?' maxed':'');
    const cvs=document.createElement('canvas');
    cell.appendChild(cvs);
    const cnt=document.createElement('span');
    cnt.className='cnt';
    cnt.textContent=maxed?'OWN '+owned:price+' CR'+(owned?' \u00B7 OWN '+owned:'');
    cell.appendChild(cnt);
    drawMini(cvs,id);
    if(!maxed&&!broke)cell.onclick=()=>{
      AUDIO.play('click');
      SAVE.credits-=price;addToCollection(id);persist();buildStoreUI();
    };
    wrap.appendChild(cell);
  });
  const note=$('#store-note');
  if(note)note.textContent=SAVE.circuit>=6?'FULL CANTINA STOCK.':'STOCK IMPROVES AS YOU CLIMB THE CIRCUIT.';
}
function openStore(){
  buildStoreUI();
  showScreen('store');
}
function openModal(html){$('#modalbox').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
function hasSave(){return !!(SAVE.begun||SAVE.circuit>0||(SAVE.lastDeck&&SAVE.lastDeck.length));}
function wipeKeepAudio(){
  const vol=AUDIO.vol,muted=AUDIO.muted;
  SAVE=defaultSave();SAVE.vol=vol;SAVE.muted=muted;SAVE.roster=buildRoster();persist();
}
function enterCircuit(){
  SAVE.begun=true;persist();
  circuitSel=circuitDefaultSel();
  buildCircuit();
  showScreen('circuit');
}
function startNewGame(){
  AUDIO.play('click');
  if(!hasSave()){wipeKeepAudio();enterCircuit();return;}
  openModal(
    '<h2>NEW GAME</h2><p>THIS WIPES YOUR CIRCUIT, CARD COLLECTION, AND CREDITS.</p>'+
    '<div class="mrow"><button id="myes" class="kbtn">START</button><button id="mno" class="kbtn">CANCEL</button></div>');
  $('#myes').onclick=()=>{AUDIO.play('click');closeModal();wipeKeepAudio();enterCircuit();};
  $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
}
function confirmReset(){
  AUDIO.play('click');
  openModal(
    '<h2>RESET PROGRESS</h2><p>THIS WIPES YOUR CIRCUIT, CARD COLLECTION, AND CREDITS.</p>'+
    '<div class="mrow"><button id="myes" class="kbtn danger">WIPE IT</button><button id="mno" class="kbtn">KEEP IT</button></div>');
  $('#myes').onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();};
  $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
}
function openOptions(){
  openModal(
    '<h2>OPTIONS</h2>'+
    '<div class="volrow"><span>VOLUME</span><input id="vol" type="range" min="0" max="100" value="'+Math.round(AUDIO.vol*100)+'"><button id="bt-mute" class="kbtn sm">MUTE</button></div>'+
    '<div class="mrow"><button id="bt-reset" class="kbtn danger">RESET PROGRESS</button><button id="oclose" class="kbtn">CLOSE</button></div>');
  $('#vol').oninput=e=>{AUDIO.setVol(e.target.value/100);SAVE.vol=AUDIO.vol;persist();};
  $('#bt-mute').textContent=AUDIO.muted?'UNMUTE':'MUTE';
  $('#bt-mute').onclick=()=>{AUDIO.setMuted(!AUDIO.muted);SAVE.muted=AUDIO.muted;persist();$('#bt-mute').textContent=AUDIO.muted?'UNMUTE':'MUTE';};
  $('#bt-reset').onclick=confirmReset;
  $('#oclose').onclick=()=>{AUDIO.play('click');closeModal();};
}
function askQuit(){
  AUDIO.play('click');
  openModal(
    '<h2>QUIT</h2><p>LEAVE THE TABLE?</p>'+
    '<div class="mrow"><button id="myes" class="kbtn">YES</button><button id="mno" class="kbtn">NO</button></div>');
  $('#myes').onclick=()=>{
    AUDIO.play('click');
    try{window.close();}catch(e){}
    closeModal();
  };
  $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
}
function refreshTitle(){
  const load=$('#bt-continue');
  load.disabled=!hasSave();
  document.querySelectorAll('.kotor-menu button').forEach(b=>b.classList.remove('sel'));
  (hasSave()?load:$('#bt-new')).classList.add('sel');
  refreshCredits();
}
function loop(t){render(t);requestAnimationFrame(loop);}
function init(){
  initTextures();
  AUDIO.vol=SAVE.vol;AUDIO.muted=SAVE.muted;
  if(!SAVE.roster||!SAVE.roster.length){SAVE.roster=buildRoster();persist();}
  const table=$('#table');
  cv=table;ctx=table.getContext('2d');
  fit();
  $('#bt-new').onclick=startNewGame;
  $('#bt-continue').onclick=()=>{if(!hasSave())return;AUDIO.play('click');enterCircuit();};
  $('#bt-challenge').onclick=()=>{
    if(circuitSel>SAVE.circuit)return;
    AUDIO.play('click');openDeckBuilder(circuitSel);
  };
  $('#bt-cback').onclick=()=>{AUDIO.play('click');refreshTitle();showScreen('title');};
  $('#bt-how').onclick=()=>{AUDIO.play('click');openModal(
    '<h2>HOW TO PLAY</h2><ul>'+
    '<li>Get closer to 20 than your opponent without going over. First to win 3 sets takes the match.</li>'+
    '<li>Each turn you automatically draw a main deck card (values 1-10) onto your 3x3 board.</li>'+
    '<li>You may then play at most one side-deck card from your 4-card hand, then END TURN or STAND.</li>'+
    '<li>Over 20 is a BUST and loses the set. Exactly 20 auto-stands. Fill all 9 slots without busting for an instant win.</li>'+
    '<li>Tied sets award no point and replay. Your 4 hand cards last the entire match - spend them wisely.</li>'+
    '<li>Click a hand card to arm it, click again to play. FLIP, F, or right-click cycles +/- on duals, tiebreakers, and the 1\u00B12 card.</li>'+
    '<li>Keys: Space end turn, Enter stand, F or right-click flip, Esc cancel. Click a hand card twice to play it.</li>'+
    '<li>Matches are played for a credits wager. Win and you may take one card from their side deck, or skip if it is clutter.</li>'+
    '<li>The cantina store sells side-deck cards. Better stock unlocks as you climb the circuit.</li>'+
    '</ul><div class="mrow"><button id="mclose" class="kbtn">CLOSE</button></div>');
    $('#mclose').onclick=()=>{AUDIO.play('click');closeModal();};
  };
  $('#bt-store').onclick=()=>{AUDIO.play('click');openStore();};
  $('#bt-sback').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-options').onclick=()=>{AUDIO.play('click');openOptions();};
  $('#bt-quit').onclick=askQuit;
  $('#bt-autofill').onclick=autoFill;
  $('#bt-cleardeck').onclick=()=>{AUDIO.play('click');deckSel=[];buildDeckUI();};
  $('#bt-dback').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-begin').onclick=()=>{
    if(deckSel.length!==10)return;
    AUDIO.play('click');
    SAVE.lastDeck=deckSel.slice();persist();
    startMatch(deckRung);
  };
  table.addEventListener('pointerdown',onTablePointer);
  table.addEventListener('pointermove',onTableHover);
  table.addEventListener('contextmenu',onTableContext);
  window.addEventListener('keydown',e=>{
    if(curScreen!=='match'||!M)return;
    const k=e.key.toLowerCase();
    if(matchDlg){
      if(k==='enter'||k===' '){e.preventDefault();dialogOK();}
      else if(k==='escape'&&matchDlg.onCancel){e.preventDefault();dialogCancel();}
      return;
    }
    if(M.phase!=='pAction')return;
    if(k==='e'||k===' '){e.preventDefault();endPlayerTurn();}
    else if(k==='enter'||k==='s'){e.preventDefault();playerStand();}
    else if(k==='f'){e.preventDefault();flipArmed();}
    else if(k==='escape'){e.preventDefault();M.sel=-1;}
  });
  window.addEventListener('resize',fit);
  renderStatic();
  refreshTitle();
  requestAnimationFrame(loop);
}
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  computeLayout();
  if(cv){cv.width=W*DPR;cv.height=H*DPR;}
  if(M&&ctx){renderStatic();render(performance.now());}
}
function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/Math.max(1,r.width)*W, y:(e.clientY-r.top)/Math.max(1,r.height)*H};
}
function askForfeit(){
  AUDIO.play('click');
  showDialog('FORFEIT THE MATCH?','THE WAGER WILL BE LOST',()=>{AUDIO.play('lose');leaveMatch();},{cancelText:'NO',onCancel(){}});
}
function hitTable(p){
  if(!M||matchDlg)return null;
  if(L.handP){
    for(let i=0;i<4;i++){
      if(inRect(p,handSlot(L.handP,i))&&M.p.hand[i])return {kind:'hand',i};
    }
  }
  const ui=tableUI();
  if(inRect(p,L.btnEnd)&&ui.act)return {kind:'end'};
  if(inRect(p,L.btnStand)&&ui.act)return {kind:'stand'};
  if(inRect(p,L.btnFlip)&&ui.flipOk)return {kind:'flip'};
  if(inRect(p,L.btnForf)&&M.phase!=='done')return {kind:'forfeit'};
  return null;
}
function onTableHover(e){
  if(curScreen!=='match'||!cv)return;
  cv.style.cursor=hitTable(canvasPoint(e))?'pointer':'default';
}
function onTablePointer(e){
  if(curScreen!=='match'||!M||matchDlg)return;
  if(e.button!=null&&e.button!==0)return;
  const hit=hitTable(canvasPoint(e));
  if(!hit)return;
  e.preventDefault();
  if(hit.kind==='hand'){
    if(M.phase!=='pAction')return;
    if(M.sel===hit.i)confirmPlay(hit.i);
    else{AUDIO.play('click');M.sel=hit.i;M.orient=1;M.varV=1;}
  }else if(hit.kind==='end')endPlayerTurn();
  else if(hit.kind==='stand')playerStand();
  else if(hit.kind==='flip')flipArmed();
  else if(hit.kind==='forfeit')askForfeit();
}
function onTableContext(e){
  if(curScreen!=='match')return;
  e.preventDefault();
  if(!M||matchDlg||M.phase!=='pAction')return;
  const hit=hitTable(canvasPoint(e));
  if(!hit||hit.kind!=='hand')return;
  const card=M.p.hand[hit.i];
  if(!canFlip(card))return;
  if(M.sel!==hit.i){M.sel=hit.i;M.orient=1;M.varV=1;}
  flipArmed();
}
globalThis.PZ={shuffle,buildMainDeck,boardScore,placeMain,placeSide,applyDouble,applyFlip,aiDecide,genSideDeck,generateOpponent,cardLabel,CARD_DEFS,buildRoster,makeCard,faceVal,canFlip,playValue,
  startSet,beginTurn,endPlayerTurn,playerStand,confirmPlay,endSet,
  newMatchForTest:(deckIds,opp)=>{SAVE.lastDeck=deckIds;newMatch(opp,null);},
  getM:()=>M,setSleepScale:v=>{SLEEP_SCALE=v;},chanState,fitCard,CARD_ASPECT,
  matchWager,storeStock,storeMinCircuit,addToCollection,isClutterId,CARD_PRICE,getSave:()=>SAVE};
if(typeof document!=='undefined'){
  document.addEventListener('DOMContentLoaded',init);
}
