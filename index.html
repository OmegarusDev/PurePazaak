<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazaak: Outer Rim Circuit</title>
<style>
:root{
  /* KOTOR palette — sampled from refs:
     menu bars/menu-blue (user crop), charsheet navy/cyan/green/yellow (moddb),
     table silver/orange/cyan (RefBoard), win overlay (RefBoard2) */
  --abyss:#04050b;
  --navy:#0a0f1c;
  --navy-2:#060a14;
  --well:#020409;
  --bar:#0b1322;
  --line:#274a70;
  --line-hi:#6ea3d8;
  --rail:#2a5a8a;
  --ink:#c9d4e4;
  --dim:#8b96ab;
  --faint:#5a6376;
  --cyan:#3fb6ff;
  --ice:#9fd4ff;
  --pale:#cfe6ff;
  --gold:#e8c34a;
  --gold-hi:#ffe14d;
  --select:#d7e05c;
  --green:#46e06a;
  --orange:#e87020;
  /* legacy names (kept for compat) */
  --amber:#e8c34a;
  --red:#e05555;
  /* type — system stacks only, zero-asset */
  --serif:"Trajan Pro",Trajan,Cinzel,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Futura","Futura Medium","Century Gothic","Avenir Next","Trebuchet MS","Arial Narrow",Arial,sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* deep-space backdrop: vignette + sparse starfield, pure CSS, zero assets */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1px 1px at 68% 8%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 34%,rgba(190,220,255,.8),transparent 60%),
    radial-gradient(1px 1px at 32% 68%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 55% 82%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 84%,rgba(190,220,255,.6),transparent 60%),
    radial-gradient(1px 1px at 44% 12%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 92% 72%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 24% 44%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 76% 56%,rgba(190,220,255,.5),transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 10%,rgba(20,40,80,.35),transparent 60%),
    radial-gradient(ellipse 140% 120% at 50% 115%,rgba(0,0,0,.85),transparent 55%),
    linear-gradient(180deg,#070b16 0%,#04050b 55%,#020308 100%);
}
#app{position:relative;width:100vw;height:100vh;height:100dvh;z-index:1}
/* Shell: every screen is a centred column that can scroll internally.
   justify-content stays centered for tall viewports; min-height:0 + overflow
   keep short/landscape viewports reachable instead of clipped. */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);overflow-y:auto;min-height:0;padding:clamp(10px,2.5vh,24px) env(safe-area-inset-right) clamp(10px,2.5vh,24px) env(safe-area-inset-left);padding-top:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-top));padding-bottom:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-bottom))}
.screen.active{display:flex}
/* Children never squash (that causes overlap, not scroll); designated wells
   (.deckwrap, #rungs, .match-controls) re-enable shrink + internal scroll. */
.screen > *{flex-shrink:0;min-width:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#070b14}
::-webkit-scrollbar-thumb{background:#274a70;border-radius:5px;border:2px solid #070b14}
/* KOTOR1 menu-bar button: full-width navy bar, ice-blue caps, hairline gaps.
   Hover/armed = yellow-green select (matches "NEW GAME" selected row). */
.kbtn{display:block;width:min(340px,84vw);padding:11px 18px;background:linear-gradient(180deg,#0d1626,#080e1a);border:1px solid #000;border-left:3px solid var(--rail);border-right:3px solid var(--rail);border-radius:2px;color:var(--ice);font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.28em;text-indent:.28em;text-transform:uppercase;text-align:center;cursor:pointer;touch-action:manipulation}
.kbtn:hover,.kbtn:focus-visible{color:var(--select);border-left-color:var(--select);border-right-color:var(--select);text-shadow:0 0 10px rgba(215,224,92,.55);outline:none}
.kbtn:active:not(:disabled){transform:translateY(1px)}
.kbtn:disabled{opacity:.32;cursor:default;color:var(--ice);text-shadow:none}
.kbtn.danger{color:#b06a6a;border-left-color:#5a2a2a;border-right-color:#5a2a2a}
.kbtn.danger:hover{color:#ff9a9a;border-left-color:#a04040;border-right-color:#a04040;text-shadow:0 0 10px rgba(224,85,85,.4)}
.kbtn.sm{width:auto;min-width:96px;padding:8px 12px;font-size:11px;letter-spacing:.22em;text-indent:.22em}
/* Title masthead: gold Trajan serif over ice-blue, like the KOTOR1 marquee */
.logo{font-family:var(--serif);font-size:clamp(40px,10vw,76px);font-weight:400;letter-spacing:clamp(10px,2.6vw,22px);margin-left:clamp(8px,2vw,22px);color:var(--gold);text-shadow:0 0 22px rgba(232,195,74,.35),0 2px 0 #000;text-align:center;line-height:1.05}
.logo-sub{font-family:var(--sans);font-size:clamp(11px,3vw,15px);font-weight:500;letter-spacing:clamp(6px,1.8vw,12px);margin-left:clamp(5px,1vw,12px);color:var(--ice);text-shadow:0 0 12px rgba(63,182,255,.5);text-align:center}
/* KOTOR1 menu stack: bars separated by black gaps, steel side rails */
.kmenu{display:flex;flex-direction:column;gap:3px;width:min(360px,86vw);padding:10px;border:1px solid #101826;border-radius:8px;background:rgba(3,5,10,.72);box-shadow:0 10px 34px rgba(0,0,0,.6)}
.kmenu .kbtn{width:100%}
.kmenu .kbtn:first-child{border-top:1px solid #000}
/* Generic navy panel with hairline steel border (charsheet language) */
.panel{background:linear-gradient(180deg,rgba(12,19,34,.96),rgba(6,10,20,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(140,190,255,.12),inset 0 0 22px rgba(20,50,100,.18),0 8px 26px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:clamp(8px,2vw,12px);align-items:center;width:min(560px,94vw);padding:clamp(14px,3.5vw,24px) clamp(16px,4vw,28px)}
.scrh{font-family:var(--serif);font-weight:400;font-size:clamp(19px,5vw,27px);letter-spacing:.32em;text-indent:.32em;color:var(--gold);text-shadow:0 0 14px rgba(232,195,74,.3),0 2px 0 #000;text-align:center}
.foot{font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--faint);text-align:center}
.volrow{display:flex;align-items:center;gap:12px;color:var(--ice);font-size:11px;letter-spacing:.25em;text-indent:0}
.volrow input[type=range]{width:min(150px,38vw);accent-color:var(--cyan)}
/* Dialogue box: near-black blue-outlined modal (dialogue/box refs + win overlay).
   Thin steel-blue outer line, dark inner keyline, faint blue inner glow. */
#modal{position:fixed;inset:0;background:rgba(2,3,8,.74);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.hidden{display:none}
#modalbox{width:min(560px,94vw);max-height:86vh;max-height:86dvh;overflow-y:auto;background:linear-gradient(180deg,rgba(8,12,22,.97),rgba(4,6,13,.97));border:1px solid #4a7ab5;border-radius:6px;box-shadow:0 0 0 1px #010204,0 0 26px rgba(70,130,200,.28),inset 0 0 30px rgba(40,90,160,.14);padding:clamp(18px,4.5vw,28px) clamp(18px,5vw,32px);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#modalbox h2{font-family:var(--sans);font-weight:500;font-size:clamp(14px,4vw,17px);letter-spacing:.3em;text-indent:.3em;color:var(--pale);text-shadow:0 0 12px rgba(159,212,255,.55)}
#modalbox p,#modalbox li{font-size:clamp(12px,3.6vw,14px);letter-spacing:.06em;line-height:1.7;color:var(--ink)}
#modalbox ul{padding-left:20px;text-align:left}
#modalbox .mrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* Win-overlay OK pill: transparent, thin pale outline (RefBoard2) */
#modalbox .mrow .kbtn,#modalbox > .kbtn{width:auto;min-width:130px;border:1px solid rgba(220,235,255,.7);border-radius:6px;background:rgba(10,16,28,.6);color:var(--pale);letter-spacing:.24em;text-indent:.24em}
#modalbox .mrow .kbtn:hover,#modalbox > .kbtn:hover{border-color:#fff;color:#fff;box-shadow:0 0 14px rgba(160,200,255,.35)}
#modalbox .mrow .kbtn.danger{border-color:rgba(224,120,120,.6);color:#ffb0b0}
.mcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mcard{display:flex;flex-direction:column;align-items:center;gap:4px}
.mcard canvas{width:68px;height:80px}
.mcard span{font-size:11px;color:var(--gold);letter-spacing:.2em}
#rungs{display:flex;flex-direction:column;gap:8px;width:min(620px,94vw);overflow-y:auto;min-height:0}
/* Charsheet row: dark navy bar, hairline steel border, tier disc + stacked text + status */
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 14px;background:linear-gradient(180deg,#0c1322,#070c16);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.rung.next{border-color:#7a8a3a;box-shadow:0 0 12px rgba(215,224,92,.18),inset 0 0 16px rgba(215,224,92,.06);cursor:pointer}
.rung.next:hover{border-color:var(--select);box-shadow:0 0 20px rgba(215,224,92,.4)}
.rung.locked{opacity:.38}
.rung.done{opacity:.85;cursor:pointer}
.rung.done:hover{border-color:var(--green)}
.tier{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.05em;color:#0c0c10;border:1px solid #000}
.tier.t1{background:linear-gradient(180deg,#9a9aa4,#54545e)}
.tier.t2{background:linear-gradient(180deg,#5a70f0,#22348e);color:#dfe6ff}
.tier.t3{background:linear-gradient(180deg,#e05050,#7a1414);color:#ffe0e0}
.rtext{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.rname{font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle{font-size:10px;letter-spacing:.28em;color:var(--cyan)}
.rstat{font-size:10px;letter-spacing:.24em;text-align:right;white-space:nowrap}
.rung.next .rstat{color:var(--select)}
.rung.done .rstat{color:var(--green)}
.rung.locked .rstat{color:var(--faint)}
/* Deck builder: viewport-filling layout, no dead void, headers never clip.
   Landscape: side-by-side stretched panels, collection grid takes spare height.
   Portrait: stacked; collection panel flexes, its grid scrolls internally. */
#scr-deck{container-type:size;container-name:deck}
.deckwrap{display:flex;gap:16px;align-items:stretch;justify-content:center;width:min(980px,96vw);flex:1 1 auto;min-height:0;min-width:0;flex-wrap:nowrap}
/* Collection panel is a flex column: fixed header + growing scroll well */
.deckwrap .panel{flex:1 1 320px;min-width:min(320px,100%);min-height:0;max-width:560px;width:auto;display:flex;flex-direction:column}
.deckhead{flex:0 0 auto;font-size:clamp(10px,1.6cqh,12px);letter-spacing:.3em;text-indent:.3em;color:var(--cyan)}
#collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(88px,100%),1fr));gap:clamp(6px,1.2cqh,10px);width:100%;flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px;align-content:start;align-items:start}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:rgba(2,4,9,.7);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;min-width:0;min-height:0}
.cell:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(63,182,255,.35)}
.cell.maxed{opacity:.45;cursor:default}
.cell.maxed:hover{border-color:var(--line);box-shadow:none}
/* Cards scale with viewport height but never exceed column width */
.cell canvas{width:min(100%,14cqh);max-width:76px;height:auto;aspect-ratio:64/80;min-height:0}
.cell .cnt{font-size:clamp(8px,1.4cqh,10px);letter-spacing:.08em;color:var(--dim);white-space:nowrap}
/* Side deck column: fixed content, vertically centred in stretched panel */
.deckside{display:flex;flex-direction:column;gap:clamp(8px,1.6cqh,12px);align-items:center;justify-content:center;flex:0 1 320px;min-width:min(300px,100%);min-height:0;width:100%;max-width:340px}
#deckcount{font-size:clamp(15px,2.6cqh,19px);font-weight:600;letter-spacing:.3em;text-indent:.3em;color:var(--gold)}
#deckcount.full{color:var(--green);text-shadow:0 0 10px rgba(70,224,106,.5)}
#sidedeck{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.sslot{width:100%;aspect-ratio:64/80;max-height:17cqh;border:1px dashed #2c425f;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(2,4,9,.5);min-width:0;min-height:0;margin:auto}
.sslot:hover{border-color:var(--red)}
.sslot canvas{width:100%;height:100%;object-fit:contain;min-height:0}
.deckbtns{display:flex;gap:8px;width:100%}
.deckbtns .kbtn{flex:1;min-width:0;width:auto;font-size:11px}
@media (max-width:600px){
  .deckbtns .kbtn{font-size:10px;letter-spacing:.14em;text-indent:.14em}
}
/* Match: canvas letterboxes via object-fit; controls scroll if short. */
#scr-match{padding:0;justify-content:center}
.match-wrap{display:flex;flex-direction:row;align-items:stretch;justify-content:center;gap:14px;width:100%;height:100%;min-height:0;padding:12px}
.match-board{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;flex:1 1 auto}
#table{width:100%;height:100%;object-fit:contain;border-radius:8px;touch-action:none;min-width:0;min-height:0}
.match-controls{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;width:clamp(200px,24vw,280px);flex:0 0 auto;min-height:0;overflow-y:auto;padding:4px}
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.handcard{position:relative;width:62px;height:84px;cursor:pointer;border:1px solid transparent;border-radius:7px;background:rgba(2,4,9,.5);padding:0;touch-action:manipulation}
.handcard canvas{width:100%;height:100%;display:block;object-fit:contain}
.handcard:hover{border-color:var(--line-hi)}
.handcard.sel{border-color:var(--select);box-shadow:0 0 12px rgba(215,224,92,.5)}
.handcard.used,.handcard.dis{opacity:.4}
.handcard.dis{pointer-events:none}
.pinfo{font-size:12px;letter-spacing:.26em;text-indent:.26em;color:var(--gold);min-height:18px;text-align:center}
.ctrl-btns{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%}
.ctrl-btns .kbtn{width:100%}
.ctrl-btns .kbtn.primary{border-left-color:var(--gold);border-right-color:var(--gold);color:var(--gold-hi);text-shadow:0 0 10px rgba(232,195,74,.5)}
.ctrl-btns .kbtn.primary:hover{color:#fff3c0;box-shadow:0 0 18px rgba(232,195,74,.35)}
.ctrl-btns .kbtn.primary:disabled{border-left-color:var(--rail);border-right-color:var(--rail);color:var(--ice)}
.ctrl-secondary{display:flex;gap:8px;width:100%}
.ctrl-secondary .kbtn{flex:1;min-width:0;width:auto}
.ctrl-btns .kbtn.ghost{background:transparent;border-color:#232c3d;color:var(--faint)}
.ctrl-btns .kbtn.ghost:hover{border-color:rgba(224,85,85,.6);color:#ff9a9a;text-shadow:none}
/* Portrait: board on top, controls docked bottom, both bounded so neither
   crushes the other to zero. dvh units keep mobile browser chrome honest. */
@media (orientation:portrait){
  .match-wrap{flex-direction:column;justify-content:flex-start;align-items:stretch;padding:8px;gap:8px}
  .match-board{flex:1 1 auto;width:100%;min-height:0}
  .match-controls{width:100%;flex:0 1 auto;min-height:0;max-height:44dvh;overflow-y:auto;gap:8px;background:linear-gradient(180deg,rgba(10,15,26,.96),rgba(4,6,12,.98));border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .handcard{width:clamp(50px,15.5vw,66px);height:auto;aspect-ratio:64/86}
  .ctrl-btns{flex-direction:row;flex-wrap:wrap}
  .ctrl-btns .kbtn.primary{flex:1 1 100%}
  .ctrl-secondary{flex:1 1 100%}
  #scr-deck{gap:8px;justify-content:flex-start}
  /* Stacked: collection panel flexes and its grid scrolls internally so the
     COLLECTION header and the whole side-deck column stay pinned. */
  .deckwrap{flex-wrap:nowrap;flex-direction:column;align-items:stretch;overflow:visible}
  .deckwrap .panel{flex:1 1 auto;min-height:0;max-width:none}
  #collection{grid-template-columns:repeat(5,1fr);max-height:none}
  .deckside{flex:0 0 auto;max-width:none;width:100%}
}
/* Narrow landscape: wrap to a top-anchored column instead of clipping. */
@media (orientation:landscape) and (max-width:700px){
  #scr-deck{justify-content:flex-start}
  .deckwrap{flex-wrap:wrap;flex:0 0 auto;align-items:center}
  .deckwrap .panel,.deckside{flex:1 1 100%;max-width:520px}
  #collection{max-height:52dvh}
}
/* Short landscape (phones tilted, small windows): top-anchor so tall
   content stays reachable by scroll instead of clipping above the fold. */
@media (orientation:landscape) and (max-height:520px){
  .screen{justify-content:flex-start}
  .screen{gap:8px}
  .logo{font-size:clamp(30px,7vh,44px)}
  .match-controls{gap:8px}
  .handcard{width:48px;height:65px}
}
</style>
</head>
<body>
<main id="app">
  <section id="scr-title" class="screen active">
    <div class="logo">PAZAAK</div>
    <div class="logo-sub">OUTER RIM CIRCUIT</div>
    <nav class="kmenu" aria-label="Main menu">
      <button id="bt-continue" class="kbtn">CONTINUE CIRCUIT</button>
      <button id="bt-new" class="kbtn">NEW CIRCUIT</button>
      <button id="bt-how" class="kbtn">HOW TO PLAY</button>
      <button id="bt-options" class="kbtn">OPTIONS</button>
      <button id="bt-reset" class="kbtn danger">RESET PROGRESS</button>
    </nav>
    <div class="foot">HOLO-TERMINAL BUILD &middot; ZERO ASSETS &middot; ALL CODE</div>
  </section>
  <section id="scr-circuit" class="screen">
    <div class="scrh">OUTER RIM CIRCUIT</div>
    <div id="rungs"></div>
    <button id="bt-cback" class="kbtn">&#9668; TITLE</button>
  </section>
  <section id="scr-deck" class="screen">
    <div class="scrh">SIDE DECK BUILDER</div>
    <div class="deckwrap">
      <div class="panel"><div class="deckhead">COLLECTION</div><div id="collection"></div></div>
      <div class="panel deckside">
        <div id="deckcount">0 / 10</div>
        <div id="sidedeck"></div>
        <div class="deckbtns">
          <button id="bt-autofill" class="kbtn">AUTO-FILL</button>
          <button id="bt-cleardeck" class="kbtn">CLEAR</button>
        </div>
        <button id="bt-dback" class="kbtn">&#9668; BACK</button>
        <button id="bt-begin" class="kbtn" disabled>BEGIN MATCH</button>
      </div>
    </div>
  </section>
  <section id="scr-match" class="screen">
    <div class="match-wrap">
      <div class="match-board"><canvas id="table"></canvas></div>
      <div class="match-controls">
        <div class="pinfo" id="pinfo"></div>
        <div class="hand" id="hand"></div>
        <div class="ctrl-btns">
          <button id="bt-end" class="kbtn primary">END TURN</button>
          <div class="ctrl-secondary">
            <button id="bt-stand" class="kbtn sm">STAND</button>
            <button id="bt-flip" class="kbtn sm">FLIP</button>
            <button id="bt-forf" class="kbtn sm ghost">FORFEIT</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="modal" class="hidden"><div id="modalbox"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const choice=a=>a[Math.floor(Math.random()*a.length)];
let SLEEP_SCALE=1;
const sleep=ms=>new Promise(r=>setTimeout(r,Math.max(0,ms*SLEEP_SCALE)));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

    S.hand=S.handIdx.map(i=>makeCard(S.side[i].id));
  }
}
function startSet(){
  M.setNum++;M.deck=buildMainDeck();
  for(const w of ['p','o']){const S=sideOf(w);S.board=Array(9).fill(null);S.score=0;S.stood=false;S.bust=false;S.tiebreak=false;}
  M.sel=-1;M.phase='turn';M.anims.deal=null;
  toast('SET '+M.setNum);
  beginTurn(M.setStarter);
}
function drawTo(w){
  const c=M.deck.pop(),i=placeMain(sideOf(w),c);
  AUDIO.play('draw');
  M.anims.deal={who:w,slot:i,t0:performance.now()};
}
function resolveAfterDraw(w){
  const S=sideOf(w);S.score=boardScore(S.board);
  if(boardCount(S.board)===9){endSet(w,'fill');return 'end';}
  if(S.score===20){S.stood=true;toast('TWENTY!');return 'stood';}
  return 'ok';
}
function beginTurn(w){
  M.turn=w;
  if(sideOf(w).stood){
    if(sideOf(other(w)).stood){resolveStandoff();return;}
    beginTurn(other(w));
    return;
  }
  drawTo(w);
  const res=resolveAfterDraw(w);
  if(res==='end')return;
  if(res==='stood'){
    if(sideOf(other(w)).stood){resolveStandoff();return;}
    beginTurn(other(w));
    return;
  }
  if(w==='p')M.phase='pAction';else{M.phase='oTurn';aiTurn(M.token);}
}
function passToOpp(){beginTurn('o');}
function endPlayerTurn(){if(M.phase!=='pAction')return;AUDIO.play('click');M.sel=-1;if(M.p.score>20){M.p.bust=true;M.anims.flash={who:'p',t0:performance.now()};AUDIO.play('bust');endSet('o','bust');return;}passToOpp();}
function playerStand(){
  if(M.phase!=='pAction')return;AUDIO.play('click');
  if(M.p.score>20){M.p.bust=true;M.anims.flash={who:'p',t0:performance.now()};AUDIO.play('bust');endSet('o','bust');return;}
  M.p.stood=true;M.sel=-1;toast('YOU STAND');
  if(M.o.stood)resolveStandoff();else passToOpp();
}
function flipArmed(){
  if(M.phase!=='pAction'||M.sel<0)return;
  const card=M.p.hand[M.sel];
  if(!card||(card.kind!=='dual'&&card.kind!=='tie'))return;
  AUDIO.play('click');M.orient*=-1;
}
function confirmPlay(i){
  if(M.phase!=='pAction')return;
  const card=M.p.hand[i];if(!card)return;
  if(card.kind==='dbl'&&!lastSlot(M.p.board)){toast('NOTHING TO DOUBLE');return;}
  AUDIO.play('place');
  if(card.kind==='dbl')applyDouble(M.p.board);
  else if(card.kind==='flip'){const n=applyFlip(M.p.board,card.vals);toast('FLIPPED '+n+' CARD'+(n===1?'':'S'));}
  else{const si=placeSide(M.p,card,M.orient);if(si>=0)M.anims.deal={who:'p',slot:si,t0:performance.now()};}
  if(card.kind==='tie')M.p.tiebreak=true;
  M.p.used[i]=true;M.p.hand[i]=null;M.sel=-1;
  M.p.score=boardScore(M.p.board);
  if(boardCount(M.p.board)===9){endSet('p','fill');return;}
  if(M.p.score===20){M.p.stood=true;toast('TWENTY!');
    if(M.o.stood)resolveStandoff();else passToOpp();return;}
}
function bustRisk(w){
  const S=sideOf(w),rem=M.deck.length;
  if(!rem)return 1;
  let bad=0;for(const c of M.deck)if(S.score+c.v>20)bad++;
  return bad/rem;
}
async function aiTurn(tk){
  await sleep(650);if(!M||tk!==M.token||M.phase!=='oTurn')return;
  await sleep(520);if(!M||tk!==M.token||M.phase!=='oTurn')return;
  const snap={score:M.o.score,board:M.o.board,hand:M.o.hand,oppScore:M.p.score,oppStood:M.p.stood,tier:M.opp.tier,bustRisk:bustRisk('o'),setsO:M.setsO};
  const d=aiDecide(snap);
  if(d.play){
    const card=M.o.hand[d.play.idx];
    AUDIO.play('place');
    if(d.play.tag==='dbl')applyDouble(M.o.board);
    else if(d.play.tag==='flip')applyFlip(M.o.board,card.vals);
    else{const si=placeSide(M.o,card,d.play.orient);if(si>=0)M.anims.deal={who:'o',slot:si,t0:performance.now()};}
    if(card.kind==='tie')M.o.tiebreak=true;
    M.o.hand[d.play.idx]=null;
    M.o.score=boardScore(M.o.board);
    await sleep(430);if(!M||tk!==M.token||M.phase!=='oTurn')return;
    if(M.o.score>20){M.o.bust=true;M.anims.flash={who:'o',t0:performance.now()};AUDIO.play('bust');endSet('p','bust');return;}
    if(boardCount(M.o.board)===9){endSet('o','fill');return;}
    if(M.o.score===20){M.o.stood=true;toast('TWENTY!');
      if(M.p.stood)resolveStandoff();else beginTurn('p');return;}
    if(M.o.score>snap.score||shouldStand(M.o.score,snap)){
      if(M.o.score>20){M.o.bust=true;M.anims.flash={who:'o',t0:performance.now()};AUDIO.play('bust');endSet('p','bust');return;}
      M.o.stood=true;toast(M.opp.name.toUpperCase()+' STANDS');
      if(M.p.stood)resolveStandoff();else beginTurn('p');return;
    }
  }
  if(d.stand){
    M.o.stood=true;toast(M.opp.name.toUpperCase()+' STANDS');
    if(M.p.stood)resolveStandoff();else beginTurn('p');
    return;
  }
  if(M.o.score>20){M.o.bust=true;M.anims.flash={who:'o',t0:performance.now()};AUDIO.play('bust');endSet('p','bust');return;}
  beginTurn('p');
}
function resolveStandoff(){
  const ps=M.p.score,os=M.o.score;
  let winner=null;
  if(ps>os)winner='p';else if(os>ps)winner='o';
  else if(M.p.tiebreak&&!M.o.tiebreak)winner='p';
  else if(M.o.tiebreak&&!M.p.tiebreak)winner='o';
  if(winner){endSet(winner,'score');return;}
  M.phase='over';
  showDialog('THE SET IS TIED.','NO POINT AWARDED',()=>{M.setStarter=other(M.setStarter);startSet();});
}
function endSet(winner,reason){
  M.phase='over';M.sel=-1;
  if(winner==='p'){M.setsP++;AUDIO.play('win');}
  else{M.setsO++;AUDIO.play(reason==='bust'?'bust':'lose');}
  const lines=setEndText(winner,reason);
  showDialog(lines[0],lines[1],()=>{
    if(M.setsP>=3){matchEnd('p');return;}
    if(M.setsO>=3){matchEnd('o');return;}
    M.setStarter=winner;startSet();
  });
}
function setEndText(winner,reason){
  if(winner==='p'){
    if(reason==='bust')return ['YOU WIN THE SET.','OPPONENT BUSTED'];
    if(reason==='fill')return ['YOU WIN THE SET.','BOARD FILLED - NINE CARDS'];
    return ['YOU WIN THE SET.',M.p.score+' TO '+M.o.score];
  }
  if(reason==='bust')return ['OPPONENT WINS THE SET.','YOU WENT BUST'];
  if(reason==='fill')return ['OPPONENT WINS THE SET.','THEIR BOARD FILLED'];
  return ['OPPONENT WINS THE SET.',M.o.score+' TO '+M.p.score];
}
function matchEnd(winner){
  M.phase='done';
  if(winner==='p'){
    AUDIO.play('win');
    if(M.replayRung!=null){
      showDialog('YOU WIN THE REMATCH.','',()=>leaveMatch());
    }else{
      const rung=SAVE.circuit,unlocks=UNLOCK_TABLE[rung]||{};
      for(const id in unlocks)SAVE.unlocked[id]=(SAVE.unlocked[id]||0)+unlocks[id];
      SAVE.circuit=rung+1;persist();
      showResultModal(unlocks);
    }
  }else{
    AUDIO.play('lose');
    showDialog('DEFEAT.','THE CIRCUIT MOVES ON WITHOUT YOU',()=>leaveMatch());
  }
}
function leaveMatch(){if(M)M.token++;M=null;buildCircuit();showScreen('circuit');}
function startMatch(rung){
  const opp=SAVE.roster[rung];
  newMatch(opp,rung<SAVE.circuit?rung:null);
  showScreen('match');
  fit(); // measure the now-visible board box so the canvas aspect matches it

    if(!SAVE.seenRules){
      SAVE.seenRules=true;persist();

  });
}
function dealProgress(who,slot,now){
  const a=M&&M.anims.deal;

function orbState(w){

function render(now){
  if(curScreen!=='match'||!M||!ctx)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(STATIC,0,0,W,H);
  if(M.p.score!==M.lastScores.p){M.flashBadge.p=now;M.lastScores.p=M.p.score;}
  if(M.o.score!==M.lastScores.o){M.flashBadge.o=now;M.lastScores.o=M.o.score;}
  drawChannel(ctx,L.chanP,chanState('p'),now);
  drawChannel(ctx,L.chanO,chanState('o'),now);
  drawOrb(ctx,L.orbP,L.orbP.r,orbState('p'),now);
  drawOrb(ctx,L.orbO,L.orbO.r,orbState('o'),now);
  drawBadge(ctx,L.badges[0],M.p.score,M.flashBadge.p,now);
  drawBadge(ctx,L.badges[1],M.o.score,M.flashBadge.o,now);
  // Opponent hand: card rears for unplayed cards so their remaining count reads
  if(L.handO){
    const h=L.handO;
    for(let i=0;i<4;i++){
      const rct={x:h.x+i*(h.sw+h.hgap),y:h.y,w:h.sw,h:h.sh};
      if(M.o.hand[i])drawCard(ctx,rct.x,rct.y,rct.w,rct.h,null,{back:true});
    }
  }
  for(const who of ['p','o']){
    const S=sideOf(who),grid=who==='p'?L.gridP:L.gridO;
    for(let i=0;i<9;i++){
      const sl=S.board[i];if(!sl)continue;
      const rc=slotRect(grid,Math.floor(i/3),i%3);
      const dp=dealProgress(who,i,now);
      ctx.save();ctx.globalAlpha=dp;
      ctx.translate(rc.x+rc.w/2,rc.y+rc.h/2-(1-dp)*36);
      const sc=0.85+0.15*dp;ctx.scale(sc,sc);
      drawCard(ctx,-(rc.w-6)/2,-(rc.h-6)/2,rc.w-6,rc.h-6,sl.card,{});
      ctx.restore();
    }
  }
  if(M.anims.flash){
    const p=(now-M.anims.flash.t0)/500;
    if(p<1){
      const grid=M.anims.flash.who==='p'?L.gridP:L.gridO;
      ctx.save();ctx.globalAlpha=(1-p)*0.35;ctx.fillStyle='#d02020';
      rr(ctx,grid.x-10,grid.y-10,3*L.sw+2*L.gap+20,3*L.sh+2*L.gap+20,10);ctx.fill();ctx.restore();
    }else M.anims.flash=null;
  }
  if(M.sel>=0&&M.p.hand[M.sel]){
    const card=M.p.hand[M.sel];
    let proj=M.p.score;
    if(card.kind==='dbl'){const ls=lastSlot(M.p.board);proj=ls?M.p.score+ls.eff:M.p.score;}
    else if(card.kind==='flip')proj=null;
    else proj=M.p.score+M.orient*card.v;
    const txt=card.kind==='flip'?'FLIP SIGN':proj>20?'BUST!':'PROJECTED: '+proj;
    tText(ctx,txt,L.proj.x,L.proj.y,12,proj!==null&&proj>20?'#ff6060':'#7fd4ff',2);
  }
  M.toasts=M.toasts.filter(t=>now-t.t0<1300);
  M.toasts.forEach((t,i)=>{
    const p=(now-t.t0)/1300;
    ctx.save();ctx.globalAlpha=p<0.15?p/0.15:1-Math.max(0,(p-0.6))/0.4;
    tText(ctx,t.t,W/2,(L.toastY||H*0.414)-i*Math.round(22*H/768),15,'#bfe8ff',3);
    ctx.restore();
  });

}

  $('#bt-how').onclick=()=>{AUDIO.play('click');openModal(
    '<h2>HOW TO PLAY</h2><ul>'+
    '<li>Get closer to 20 than your opponent without going over. First to win 3 sets takes the match.</li>'+
    '<li>Each turn you automatically draw a main deck card (values 1-10) onto your 3x3 board.</li>'+
    '<li>You may then play at most one side-deck card from your 4-card hand, then END TURN or STAND.</li>'+
    '<li>Over 20 is a BUST and loses the set. Exactly 20 auto-stands. Fill all 9 slots without busting for an instant win.</li>'+
    '<li>Tied sets award no point and replay. Your 4 hand cards last the entire match - spend them wisely.</li>'+
    '<li>Click a hand card to arm it, click again to play. FLIP CARD toggles +/- on dual cards.</li>'+
    '<li>Keys: E end turn, S stand, F flip, Enter play/confirm, Esc cancel.</li>'+
    '</ul><button id="mclose" class="kbtn">CLOSE</button>');
    $('#mclose').onclick=()=>{AUDIO.play('click');closeModal();};
  };
  $('#bt-reset').onclick=()=>{AUDIO.play('click');openModal(
    '<h2>RESET PROGRESS</h2><p>THIS WIPES YOUR CIRCUIT PROGRESS AND CARD COLLECTION.</p>'+
    '<div class="mrow"><button id="myes" class="kbtn danger">WIPE IT</button><button id="mno" class="kbtn">KEEP IT</button></div>');
    $('#myes').onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();};
    $('#mno').onclick=()=>{AUDIO.play('click');closeModal();};
  };
  $('#bt-options').onclick=()=>{AUDIO.play('click');openOptions();};
  $('#bt-autofill').onclick=autoFill;
  $('#bt-cleardeck').onclick=()=>{AUDIO.play('click');deckSel=[];buildDeckUI();};
  $('#bt-dback').onclick=()=>{AUDIO.play('click');buildCircuit();showScreen('circuit');};
  $('#bt-begin').onclick=()=>{
    if(deckSel.length!==10)return;
    AUDIO.play('click');
    SAVE.lastDeck=deckSel.slice();persist();
    startMatch(deckRung);
  };
  buildHandDOM();
  $('#bt-end').onclick=()=>endPlayerTurn();
  $('#bt-stand').onclick=()=>playerStand();
  $('#bt-flip').onclick=()=>flipArmed();
  $('#bt-forf').onclick=()=>{AUDIO.play('click');showDialog('FORFEIT THE MATCH?','PROGRESS WILL NOT BE SAVED',()=>{AUDIO.play('lose');leaveMatch();},{cancelText:'NO',onCancel(){}});};
  window.addEventListener('keydown',e=>{
    if(curScreen!=='match'||!M)return;
    const k=e.key.toLowerCase();
    if(matchDlg){
      if(k==='enter'||k===' ')dialogOK();
      else if(k==='escape'&&matchDlg.onCancel)dialogCancel();
      return;
    }
    if(M.phase!=='pAction')return;
    if(k==='e'||k===' ')endPlayerTurn();
    else if(k==='s')playerStand();
    else if(k==='f')flipArmed();
    else if(k==='enter'&&M.sel>=0)confirmPlay(M.sel);
    else if(k==='escape')M.sel=-1;
  });
  window.addEventListener('resize',fit);
  renderStatic();
  refreshTitle();
  requestAnimationFrame(loop);
}
function fit(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  computeLayout();
  if(cv){cv.width=W*DPR;cv.height=H*DPR;}
  if(M&&ctx)renderStatic();
}
const HD=120,HH=158;
function buildHandDOM(){
  const h=$('#hand');h.innerHTML='';handEls=[];
  for(let i=0;i<4;i++){
    const el=document.createElement('div');el.className='handcard';
    const cvs=document.createElement('canvas');el.appendChild(cvs);
    el.onclick=()=>{
      if(!M||M.phase!=='pAction'||!M.p.hand[i]||M.p.used[i])return;
      if(M.sel===i)confirmPlay(i);
      else{AUDIO.play('click');M.sel=i;M.orient=1;}
      updateHandDOM();
    };
    h.appendChild(el);handEls.push(el);
  }
}
function updateHandDOM(){
  if(!M||!handEls.length)return;
  const p=M.p;
  for(let i=0;i<4;i++){
    const el=handEls[i],cvs=el.firstChild,g=cvs.getContext('2d');
    const d=Math.min(2,window.devicePixelRatio||1);
    if(cvs.width!==HD*d){cvs.width=HD*d;cvs.height=HH*d;}
    g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,HD,HH);
    const card=p.hand[i];
    el.classList.toggle('sel',M.sel===i);
    el.classList.toggle('used',!!p.used[i]||!card);
    el.classList.toggle('dis',M.phase!=='pAction'||!!p.used[i]||!card);
    if(card)drawCard(g,2,2,HD-4,HH-4,card,{orient:(M.sel===i?M.orient:1)});
    else{rr(g,2,2,HD-4,HH-4,8);g.fillStyle='rgba(0,0,0,0.28)';g.fill();g.strokeStyle='rgba(255,255,255,0.07)';g.lineWidth=1;g.stroke();}
  }
  const info=$('#pinfo');
  if(M.phase==='pAction'&&M.sel>=0&&p.hand[M.sel]){
    const card=p.hand[M.sel];let proj;
    if(card.kind==='dbl'){const ls=lastSlot(p.board);proj=ls?p.score+ls.eff:p.score;}
    else if(card.kind==='flip')proj=null;
    else proj=p.score+M.orient*card.v;
    info.textContent=card.kind==='flip'?'FLIP SIGN':proj>20?'BUST!':'PROJECTED: '+proj;
    info.style.color=proj!==null&&proj>20?'#ff6060':'#7fd4ff';
  }else if(M.phase==='pAction'){info.textContent='YOUR TURN';info.style.color='#7fd4ff';}
  else if(M.phase==='turn'){info.textContent='…';info.style.color='#9aa2b4';}
  else if(M.phase==='oTurn'){info.textContent='OPPONENT TURN';info.style.color='#e0a0a0';}
  else info.textContent='';
  updateControls();
}
function updateControls(){
  if(!M)return;
  const act=M.phase==='pAction';
  const armed=M.sel>=0?M.p.hand[M.sel]:null;
  const flipOk=act&&armed&&(armed.kind==='dual'||armed.kind==='tie');
  $('#bt-end').disabled=!act;
  $('#bt-stand').disabled=!act;
  $('#bt-flip').disabled=!flipOk;
}
globalThis.PZ={shuffle,buildMainDeck,boardScore,placeMain,placeSide,applyDouble,applyFlip,aiDecide,genSideDeck,generateOpponent,cardLabel,CARD_DEFS,buildRoster,makeCard,
  startSet,beginTurn,endPlayerTurn,playerStand,confirmPlay,endSet,
  newMatchForTest:(deckIds,opp)=>{SAVE.lastDeck=deckIds;newMatch(opp,null);},
  getM:()=>M,setSleepScale:v=>{SLEEP_SCALE=v;}};
if(typeof document!=='undefined'){
  document.addEventListener('DOMContentLoaded',init);
}
</script>
