<style>

@font-face{
  font-family:"Orbitron";
  font-style:normal;
  font-weight:400 900;
  font-display:swap;
  src:url("fonts/Orbitron-latin.woff2") format("woff2");
}
:root{
  /* KOTOR 1 engine GUI — KotOR.js / PyKotor defaults:
     text/rails RGB(0, 0.658824, 0.980392), highlight RGB(1,1,0).
     In-game panels: teal-cyan 9-slice border, charcoal fill, rounded corners. */
  --abyss:#04050b;
  --navy:#0a0f1c;
  --navy-2:#060a14;
  --well:#020409;
  --bar:#0b1322;
  --line:#2a6a62;
  --line-hi:#3cb8a8;
  --rail:#00a8fa;
  --ink:#c9d4e4;
  --dim:#8b96ab;
  --faint:#5a6376;
  --cyan:#00a8fa;
  --ice:#00a8fa;
  --pale:#7ad4ff;
  --gold:#e8c34a;
  --gold-hi:#ffe14d;
  --select:#ffff4a;
  --green:#46e06a;
  --orange:#e87020;
  --k1:#00a8fa;
  --k1-hi:#ffff4a;
  --tan:#d4c89a;
  --gui-fill:#222224;
  --gui-fill-2:#2a2a2e;
  --gui-edge:#3cb8a8;
  --gui-edge-dim:#1a5c54;
  --gui-edge-hi:#7ae0d4;
  --gui-r:14px;
  /* legacy names (kept for compat) */
  --amber:#e8c34a;
  --red:#e05555;
  /* Odyssey GUI ≈ Bank Gothic. ITC Blair (BlairMdITC TT) is a close wide grotesque
     but is not registered for apps on this Mac — DIN Alternate remains the public stand-in.
     Dialogue / roster names ≈ Arial with extra tracking. Cards keep bundled Orbitron. */
  --serif:"Trajan Pro",Trajan,Cinzel,"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --gui:"Bank Gothic","BankGothic Md BT","Bank Gothic Medium","BlairMdITC TT","ITC Blair","Blair Medium","DIN Alternate","Eurostile","Microgramma","Century Gothic",sans-serif;
  --dialog:Arial,Helvetica,"Helvetica Neue",sans-serif;
  --card:"Orbitron","DIN Alternate","Bank Gothic","Eurostile",sans-serif;
  --sans:var(--gui);
  --orbitron:var(--card);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--gui);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* deep-space backdrop: vignette + sparse starfield, pure CSS, zero assets */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1px 1px at 68% 8%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 34%,rgba(190,220,255,.8),transparent 60%),
    radial-gradient(1px 1px at 32% 68%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 55% 82%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 84%,rgba(190,220,255,.6),transparent 60%),
    radial-gradient(1px 1px at 44% 12%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 92% 72%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 24% 44%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 76% 56%,rgba(190,220,255,.5),transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 10%,rgba(20,40,80,.35),transparent 60%),
    radial-gradient(ellipse 140% 120% at 50% 115%,rgba(0,0,0,.85),transparent 55%),
    linear-gradient(180deg,#070b16 0%,#04050b 55%,#020308 100%);
}
#app{position:relative;width:100vw;height:100vh;height:100dvh;z-index:1}
/* Shell: every screen is a centred column that can scroll internally.
   justify-content stays centered for tall viewports; min-height:0 + overflow
   keep short/landscape viewports reachable instead of clipped. */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);overflow-y:auto;min-height:0;padding:clamp(10px,2.5vh,24px) env(safe-area-inset-right) clamp(10px,2.5vh,24px) env(safe-area-inset-left);padding-top:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-top));padding-bottom:calc(clamp(10px,2.5vh,24px) + env(safe-area-inset-bottom))}
.screen.active{display:flex}
/* Children never squash (that causes overlap, not scroll); designated wells
   (.steel-console) re-enable shrink + internal scroll. */
.screen > *{flex-shrink:0;min-width:0}
.screen > .steel-console{flex:1 1 auto;min-height:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#141416}
::-webkit-scrollbar-thumb{background:var(--gui-edge-dim);border-radius:5px;border:2px solid #141416}
/* KOTOR 1 main-menu bars: charcoal plate, cyan side rails, 2px black gaps.
   Idle text/rails = engine cyan #00A8FA. Hover/select = yellow. */
.kbtn{display:block;position:relative;width:min(420px,92vw);padding:clamp(10px,1.8vmin,15px) clamp(18px,2.4vmin,26px);background:linear-gradient(180deg,#14161a,#0c0e10 50%,#08090a 100%);border:1px solid #000;border-radius:0;color:var(--k1);font-family:var(--gui);font-size:clamp(13px,2.1vmin,16px);font-weight:700;letter-spacing:.14em;text-indent:.04em;text-transform:uppercase;text-align:left;cursor:pointer;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 4px 0 0 var(--k1),inset -4px 0 0 var(--k1)}
.kbtn:hover,.kbtn:focus-visible,.kbtn.sel{color:var(--select);text-shadow:0 0 8px rgba(255,255,74,.4);outline:none;background:linear-gradient(180deg,#181a1e,#101214 50%,#0a0c0e 100%);box-shadow:inset 4px 0 0 var(--select),inset -4px 0 0 var(--select)}
.kbtn:active:not(:disabled){transform:translateY(1px)}
.kbtn:disabled{opacity:.32;cursor:default;color:var(--k1);text-shadow:none;box-shadow:inset 4px 0 0 var(--k1),inset -4px 0 0 var(--k1)}
.kbtn.danger{color:#c07070;box-shadow:inset 4px 0 0 #8a3030,inset -4px 0 0 #8a3030}
.kbtn.danger:hover,.kbtn.danger.sel{color:#ff9a9a;text-shadow:0 0 8px rgba(224,85,85,.35);box-shadow:inset 4px 0 0 #ff8080,inset -4px 0 0 #ff8080}
.kbtn.sm{width:auto;min-width:72px;padding:6px 14px;font-size:11px;letter-spacing:.1em;text-indent:.06em}
/* Title lockup. CARD WARS is a single text node — per-letter transforms
   break background-clip on WebKit (letters vanish). */
h1.kotor-lockup,.kotor-lockup{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:min(100%,92vw);max-width:92vw;text-align:center;position:relative;box-sizing:border-box;padding:0 2vw;font-size:inherit;font-weight:inherit;margin:0}
.sw-mark{display:block;width:max-content;max-width:100%;box-sizing:border-box;font-family:"Arial Black","Helvetica Neue",sans-serif;font-weight:900;font-size:clamp(26px,9.5vw,68px);line-height:1;letter-spacing:.06em;text-indent:.06em;text-align:center;white-space:nowrap;margin:0 0 .12em;user-select:none;
  background:linear-gradient(180deg,#ffffff 0%,#f8f6f1 40%,#efe9da 75%,#e6dfcc 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 .5px rgba(20,18,14,.95)) drop-shadow(0 1px 0 rgba(0,0,0,.4)) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
/* Gold stack shrink-wraps to PAZAAK / OLD REPUBLIC so the OF THE bars match that width. */
.kotor-gold{display:flex;flex-direction:column;align-items:center;width:max-content;max-width:100%;box-sizing:border-box}
.logo-main,.logo-or{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:.92;background:linear-gradient(180deg,#fff8d0 0%,#f2d468 28%,#c9a030 64%,#7a5a14 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 0 #2a1c08) drop-shadow(0 0 16px rgba(232,195,74,.28));white-space:nowrap;max-width:100%}
.logo-main{font-size:clamp(40px,16.5vw,120px);letter-spacing:.08em;padding-left:.08em}
.logo-or{font-size:clamp(16px,5.6vw,46px);letter-spacing:.16em;padding-left:.16em;margin-top:.08em}
/* OF THE: gold plaque + gold taper bars — width follows .kotor-gold. */
.logo-mid{display:flex;align-items:center;gap:clamp(6px,1.2vw,12px);width:100%;margin:.18em auto .06em;box-sizing:border-box}
.logo-ofthe{flex:0 0 auto;font-family:var(--serif);font-size:clamp(9px,2.4vw,15px);letter-spacing:.24em;text-indent:.24em;padding:.16em .65em .14em;color:#e8c34a;border:1px solid #c4a048;background:linear-gradient(180deg,#3a3014,#161008);text-shadow:0 1px 0 #000;white-space:nowrap;text-align:center;box-sizing:border-box}
.logo-bar{flex:1 1 auto;min-width:0;height:clamp(6px,1.1vh,11px);background:linear-gradient(180deg,#ead080,#a07828 48%,#5a4010);box-shadow:0 1px 0 #1a1204,inset 0 1px 0 rgba(255,240,180,.35)}
.logo-bar:first-child{clip-path:polygon(6% 0,100% 0,92% 100%,0 100%)}
.logo-bar:last-child{clip-path:polygon(0 0,94% 0,100% 100%,8% 100%)}
/* Menu barrel — leave as-is for now (passable). */
.kotor-menu-shell{position:relative;width:min(340px,42vw);flex:0 0 auto;isolation:isolate}
.kotor-menu-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.km-fill{fill:#071018;fill-opacity:.92}
.km-sec{fill:#123a58;fill-opacity:.55;stroke:none}
.km-rail{fill:none;stroke:#7ec8e8;stroke-width:2.15;stroke-linecap:round;filter:drop-shadow(0 0 2.5px rgba(90,190,230,.55))}
.km-rail-in{fill:none;stroke:#2a6a88;stroke-width:1.05;stroke-linecap:round;opacity:.75}
.km-div{fill:none;stroke:#000;stroke-width:1.1;opacity:.82}
.kotor-menu{position:relative;z-index:1;display:flex;flex-direction:column;padding:4% 12% 4%}
.kotor-menu button{appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;width:100%;margin:0;padding:clamp(10px,2vh,16px) 4px;background:transparent;border:0;border-bottom:0;color:#5eb4dc;font-family:var(--gui);font-size:clamp(12px,2.05vh,16px);font-weight:700;letter-spacing:.18em;word-spacing:.28em;text-indent:.09em;text-transform:uppercase;text-align:center;cursor:pointer;text-shadow:0 0 7px rgba(60,170,230,.3)}
.kotor-menu button:last-child{border-bottom:0}
.kotor-menu button:hover,.kotor-menu button:focus-visible,.kotor-menu button.sel{color:#cce666;text-shadow:0 0 8px rgba(200,220,70,.5);outline:none}
.kotor-menu:hover button.sel:not(:hover){color:#5eb4dc;text-shadow:0 0 7px rgba(60,170,230,.3)}
.kotor-menu button:disabled{opacity:.34;cursor:default;color:#5eb4dc;text-shadow:none}
/* Soft title haze on the full screen so it never hard-crops above the lockup. */
#scr-title{flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4.2vh,44px);padding:calc(clamp(16px,4vh,48px) + env(safe-area-inset-top)) clamp(12px,4vw,64px) calc(clamp(16px,4vh,36px) + env(safe-area-inset-bottom));overflow-x:hidden}
#scr-title.active{display:flex}
#scr-title::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 26%,rgba(48,90,160,.3),rgba(20,40,80,.1) 42%,transparent 72%);pointer-events:none;z-index:0}
#scr-title > *{position:relative;z-index:1}
/* In-game GUI panel: rounded teal-cyan rim, plain charcoal fill (modals use wager style) */
.gui,.panel{
  background:var(--gui-fill);
  border:4px solid var(--gui-edge);
  border-radius:var(--gui-r);
  box-shadow:inset 0 0 0 1px #0c2422,0 0 0 1px #081414,0 14px 36px rgba(0,0,0,.55);
}
.panel{display:flex;flex-direction:column;gap:clamp(8px,2vw,12px);align-items:center;width:min(560px,94vw);padding:clamp(14px,3.5vw,24px) clamp(16px,4vw,28px)}
.scrh{font-family:var(--serif);font-weight:400;font-size:clamp(18px,4.2vw,26px);letter-spacing:.32em;text-indent:.32em;color:var(--gold);text-shadow:0 0 14px rgba(232,195,74,.3),0 2px 0 #000;text-align:center}
.foot{font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--faint);text-align:center}
.volrow{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--k1);font-size:12px;letter-spacing:.12em;text-indent:0;padding:12px 20px 0;font-family:var(--gui)}
.volrow input[type=range]{width:min(150px,38vw);accent-color:var(--k1)}
/* K2 wager-style dialogue — cyan computer overlay (ALL modals) */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#modal.hidden{display:none}
#modalbox{
  user-select:text;-webkit-user-select:text;
  --dlg:#5eb4dc;
  --dlg-hi:#7ec8e8;
  --dlg-gold:#ffe14d;
  width:min(420px,92vw);
  max-height:86dvh;
  overflow-y:auto;
  padding:18px 20px 16px;
  display:flex;
  flex-direction:column;
  gap:0;
  align-items:stretch;
  text-align:center;
  background:rgba(2,8,18,.94);
  border:2px solid #3a78d0;
  border-radius:14px;
  box-shadow:inset 0 0 0 1px rgba(60,120,200,.35),0 18px 48px rgba(0,0,0,.55);
}
#modalbox h2{
  position:relative;
  font-family:var(--gui);
  font-weight:700;
  font-size:clamp(13px,3.2vw,16px);
  letter-spacing:.1em;
  text-indent:0;
  color:var(--dlg);
  text-shadow:0 0 10px rgba(60,160,230,.45);
  background:none;
  border:0;
  padding:4px 12px 10px;
  text-align:center;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;

}
/* Hollow square bullet — wager dialog marker */
#modalbox h2::before{
  content:"";
  flex:0 0 auto;

  border:2px solid var(--dlg);

#modalbox p,#modalbox li{

#modalbox p,#modalbox ul{padding:6px 10px 0}
#modalbox ul{padding-left:28px;text-align:left}
#modalbox .mrow{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  padding:16px 8px 6px;
}
#modalbox .volrow{padding:10px 8px 0;color:var(--dlg)}
/* Wager-style pill buttons: cyan idle, gold selected/hover */
#modalbox .kbtn{
  width:auto;
  min-width:96px;
  margin:0;
  padding:8px 22px;

  color:var(--dlg);

  text-indent:0;
  text-align:center;

#modalbox .kbtn.danger{border-color:#e07070;color:#e09090;box-shadow:0 0 8px rgba(220,80,80,.2)}
#modalbox .kbtn.danger:hover,#modalbox .kbtn.danger.sel{border-color:#ffb0b0;color:#ffc8c8;box-shadow:0 0 12px rgba(255,140,140,.3);background:rgba(40,10,10,.35)}
.mcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:12px 10px 0}
.mcard{display:flex;flex-direction:column;align-items:center;gap:4px}
button.mcard{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;padding:6px 8px;font:inherit;color:inherit}
button.mcard:hover,button.mcard:focus-visible{border-color:var(--select);box-shadow:0 0 12px rgba(255,255,74,.28);outline:none}

/* Shared K1 blue-steel console + cyan menu plates.
   Title barrel stays separate. Match table metal stays canvas. */
:root{
  --steel-hi:#c4ccd6;
  --steel-mid:#8a96a4;
  --steel-lo:#5a6572;
  --steel-deep:#3a4450;
  --eq-cyan:#4580c4;
  --eq-cyan-hi:#5eb0dc;
  --eq-cyan-text:#7ec8e8;
  --eq-gold:#ced049;
  --eq-gold-hi:#ffe14d;
  --eq-fill:#0c101c;
}

.steel-console{
  display:flex;
  flex-direction:column;
  gap:clamp(8px,1.4vh,12px);
  width:min(980px,96vw);
  min-height:0;
  padding:clamp(10px,1.8vh,16px);
  border-radius:18px;
  box-sizing:border-box;
  position:relative;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.01) 1px,
      rgba(0,0,0,.04) 2px,
      transparent 3px
    ),
    linear-gradient(145deg,rgba(160,200,255,.1),transparent 42%),
    linear-gradient(180deg,#a8b4c2 0%,#7a8796 28%,#5c6876 62%,#3e4854 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.48),
    inset 0 -3px 0 rgba(0,0,0,.4),
    inset 2px 0 0 rgba(255,255,255,.22),
    inset -3px 0 0 rgba(0,0,0,.28),
    0 0 0 1px #1a222c,
    0 16px 40px rgba(0,0,0,.55);
}
.steel-console::after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  pointer-events:none;
  z-index:0;
}
.steel-console > *{position:relative;z-index:1}

.steel-headers{
  display:grid;
  grid-template-columns:minmax(96px,0.9fr) minmax(0,2.2fr) minmax(110px,1fr);
  gap:clamp(6px,1vw,10px);
  flex:0 0 auto;
}
.steel-headers.steel-headers-2{
  grid-template-columns:minmax(110px,1fr) minmax(0,2.4fr);
}
.steel-hbadge{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:clamp(28px,4.2vh,36px);
  padding:4px 10px;
  background:linear-gradient(180deg,#12151a,#06070a);
  border:1px solid var(--steel-hi);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.18);
  color:#e8eef6;
  font-family:var(--gui);
  font-size:clamp(10px,1.7vh,13px);
  font-weight:700;
  letter-spacing:.16em;
  text-indent:.08em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.steel-well{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#0c1016,#06080c);
  border-radius:10px;
  box-shadow:
    inset 0 3px 10px rgba(0,0,0,.75),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 0 0 1px rgba(0,0,0,.5);
  overflow:hidden;
}

.steel-foot{
  display:flex;
  align-items:stretch;
  justify-content:stretch;
  gap:10px;
  flex:0 0 auto;
  padding:2px 0 0;
}
.steel-foot > .kplate{flex:1;min-width:0}

/* Cyan Use Item / Close plates — shared menu language */
.kplate{
  appearance:none;
  -webkit-appearance:none;
  display:block;
  position:relative;
  min-width:0;
  min-height:44px;
  padding:clamp(11px,1.8vh,15px) 12px;
  background:#1b1e25;
  border:1px solid var(--eq-cyan);
  border-radius:4px;
  color:var(--eq-cyan-hi);
  font-family:var(--gui);
  font-size:clamp(12px,2vh,14px);
  font-weight:700;
  letter-spacing:.12em;
  text-indent:.06em;
  text-transform:uppercase;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:none;
  box-shadow:
    inset 1px 1px 0 rgba(120,180,230,.28),
    inset -1px -1px 0 rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(20,28,40,.6);
}
.kplate:hover,
.kplate:focus-visible{
  outline:none;
  color:#9ad4f0;
  border-color:#6aa0d0;
  background:#22262f;
}
.kplate.sel,
.kplate:hover.sel{
  color:var(--eq-gold-hi);
  border-color:#a09840;
  background:#222018;
  box-shadow:
    inset 1px 1px 0 rgba(255,220,100,.28),
    inset -1px -1px 0 rgba(0,0,0,.55),
    0 0 10px rgba(255,225,77,.18);
  text-shadow:0 0 8px rgba(255,225,77,.35);
}
.kplate:disabled{
  opacity:.34;
  cursor:default;
  color:var(--eq-cyan-hi);
  border-color:var(--eq-cyan);
  text-shadow:none;
  box-shadow:
    inset 1px 1px 0 rgba(120,180,230,.18),
    inset -1px -1px 0 rgba(0,0,0,.55);
}
.kplate:active:not(:disabled){transform:translateY(1px)}
/* Outer Rim Circuit — equip-list roster inside shared steel console */
#scr-circuit{
  justify-content:center;
  align-items:center;
  background:#05060c;
  gap:0;
  padding:clamp(8px,1.6vh,16px) clamp(8px,2vw,18px);
}
.circuit-console{
  width:min(560px,96vw);
  height:min(100%,920px);
  max-height:100%;
}
.circuit-well{
  padding:8px;
}
#rungs{
  display:flex;
  flex-direction:column;
  gap:5px;
  width:100%;
  overflow-y:auto;
  min-height:0;
  flex:1 1 auto;
  padding:6px 5px;
  background:transparent;
  border:1px solid var(--eq-cyan);
  border-radius:20px;
  box-shadow:inset 0 0 0 1px rgba(69,128,196,.35),0 0 0 1px rgba(8,16,32,.9);
}

.rung{
  --row:var(--eq-cyan);
  appearance:none;-webkit-appearance:none;
  display:grid;
  grid-template-columns:clamp(48px,12vw,58px) 1fr;
  gap:5px;
  align-items:stretch;
  width:100%;
  padding:0;
  background:transparent;
  border:0;
  min-width:0;
  box-shadow:none;
  font:inherit;color:inherit;text-align:left;
}
.rung.next,.rung.done{cursor:pointer}
.rung.locked{opacity:.55;cursor:default}
.rung.pick{--row:var(--eq-gold)}
.rung.next:hover:not(.pick),
.rung.done:hover:not(.pick){--row:#6aa0d8}
.rung:focus-visible{outline:2px solid var(--eq-gold-hi);outline-offset:2px}

.ricon,.rbody{
  background:var(--eq-fill);
  border:2px solid var(--row);
  box-shadow:inset 0 0 0 1px #060814,inset 0 0 0 2.5px var(--row);
  color:var(--row);
  min-width:0;
}
.ricon{
  display:flex;
  align-items:center;
  justify-content:center;
  aspect-ratio:1;
  border-radius:22px 5px 5px 22px;
}
.rbody{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  padding:6px 16px;
  text-align:center;
  border-radius:5px 22px 22px 5px;
}

.tier{
  width:auto;height:auto;
  border:0;border-radius:0;
  background:none !important;
  color:inherit;
  font-weight:700;
  font-size:clamp(13px,2.4vw,16px);
  letter-spacing:.06em;
  text-shadow:none;
  display:flex;align-items:center;justify-content:center;
}
.rname{
  font-family:var(--dialog);
  font-size:clamp(13px,2.5vw,16px);
  font-weight:600;
  letter-spacing:.12em;
  text-indent:.06em;
  font-kerning:normal;
  color:inherit;
  text-transform:none;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  line-height:1.2;
}
.rstat{
  font-family:var(--gui);
  font-size:clamp(9px,1.8vw,11px);
  font-weight:600;
  letter-spacing:.16em;
  text-indent:.1em;
  color:inherit;
  text-transform:uppercase;
  white-space:nowrap;
  line-height:1.15;
  opacity:.92;
}
.tier{font-family:var(--gui)}

#scr-circuit .circuit-actions #bt-challenge{flex:1.35}

@media (max-height:520px){
  #rungs{gap:4px;padding:4px}
  .rbody{padding:4px 10px}
  .rname{font-size:12px}
  .rstat{font-size:9px}
}
/* Side-deck builder — K2 layout inside shared .steel-console */
#scr-deck{
  container-type:size;
  container-name:deck;
  justify-content:center;
  align-items:center;
  gap:0;
  padding:clamp(8px,1.6vh,16px) clamp(8px,2vw,18px);
  background:#04060c;
}
.deck-console{
  width:min(980px,96vw);
  height:min(100%,920px);
  max-height:100%;
}
.deck-headers{/* uses .steel-headers from steel.css */}
.deck-hbadge-wide{justify-content:center}
#deckcount{letter-spacing:.12em;color:#c8d4e0}
#deckcount.full{color:#9dffb0;text-shadow:0 0 8px rgba(70,224,106,.45)}

.deck-body{
  display:grid;
  grid-template-columns:minmax(0,1fr) 10px minmax(140px,0.34fr);
  gap:0;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}
.deck-rail{
  width:10px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.14) 45%,rgba(0,0,0,.5)),
    linear-gradient(180deg,var(--steel-mid),var(--steel-lo));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
}
.deck-collection,
.deck-side{
  min-width:0;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.deck-collection{padding:clamp(8px,1.4cqh,12px)}
.deck-side{padding:clamp(8px,1.4cqh,12px) clamp(8px,1.2cqw,12px)}

#collection{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:clamp(4px,0.9cqh,8px);
  width:100%;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  align-content:start;
  padding:2px;
}
.cell{
  appearance:none;-webkit-appearance:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:4px 3px;
  background:linear-gradient(180deg,#14181e,#080a0e);
  border:1px solid #1a1e24;
  border-radius:4px;
  cursor:pointer;
  min-width:0;
  min-height:0;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
  font:inherit;color:inherit;text-align:center;
}
.cell:hover,.cell:focus-visible{
  border-color:#7ec8e8;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 10px rgba(80,170,230,.28);
  outline:none;
}
.cell:focus-visible{outline:2px solid var(--eq-gold-hi);outline-offset:2px}
.cell.maxed,.cell:disabled{opacity:.4;cursor:default}
.cell.maxed:hover,.cell:disabled:hover{border-color:#1a1e24;box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
.cell canvas{
  width:min(100%,15cqh);
  max-width:72px;
  height:auto;
  aspect-ratio:572/772;
  min-height:0;
}
.cell .cnt{
  font-family:var(--gui);
  font-size:clamp(7px,1.2cqh,9px);
  letter-spacing:.06em;
  color:#8a96a8;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

#sidedeck{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:minmax(0,1fr);
  gap:clamp(4px,1cqh,8px);
  width:100%;
  height:100%;
  min-height:0;
  flex:1 1 auto;
  align-content:stretch;
}
.sslot{
  appearance:none;-webkit-appearance:none;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  aspect-ratio:572/772;
  max-height:none;
  border:1px solid #10141a;
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background:linear-gradient(180deg,#101418,#06080c);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.04);
  margin:0;
  padding:0;
  overflow:hidden;
  font:inherit;color:inherit;
}
.sslot:hover,.sslot:focus-visible{border-color:#6aa0c8;box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 0 8px rgba(70,150,210,.25);outline:none}
.sslot:focus-visible{outline:2px solid var(--eq-gold-hi);outline-offset:2px}
.sslot:disabled{cursor:default;opacity:.55}
.sslot canvas{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  min-height:0;
}

.deck-foot{
  display:flex;
  align-items:stretch;
  justify-content:space-between;
  gap:10px;
  flex:0 0 auto;
  padding:2px 0 0;
}
.deck-foot-left,
.deck-foot-right{
  display:flex;
  gap:10px;
  align-items:stretch;
}
.deck-foot-right{margin-left:auto}
.deck-foot .kplate{flex:1}
#bt-begin{min-width:clamp(120px,22cqw,180px)}

/* Store — same steel language */
#scr-store{
  justify-content:center;
  align-items:center;
  background:#05060c;
  gap:0;
  padding:clamp(8px,1.6vh,16px) clamp(8px,2vw,18px);
}
.store-console{
  width:min(760px,96vw);
  height:min(100%,920px);
  max-height:100%;
}
.store-note{
  flex:0 0 auto;
  font-family:var(--dialog);
  font-size:clamp(11px,1.6vmin,13px);
  letter-spacing:.04em;
  color:#9ad4f0;
  text-align:center;
  width:100%;
  margin:0;
  padding:0 4px;
  text-transform:none;
}
.store-well{padding:8px}
#stock{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(88px,100%),1fr));
  gap:10px;
  width:100%;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:6px;
  align-content:start;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
}
/* Match: the metal table is the whole HUD. */
#scr-match{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);justify-content:stretch;align-items:stretch;overflow:hidden}
.match-wrap{display:flex;flex-direction:row;align-items:stretch;justify-content:center;width:100%;height:100%;min-height:0;padding:0;gap:0}
.match-board{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;flex:1 1 auto;width:100%;height:100%;position:relative}
#table{display:block;width:100%;height:100%;touch-action:none;min-width:0;min-height:0;cursor:default}
.match-a11y{position:absolute;inset:0;z-index:2;pointer-events:none}
.a11y-hit{
  position:absolute;margin:0;padding:0;border:2px solid transparent;background:transparent;
  appearance:none;-webkit-appearance:none;cursor:pointer;border-radius:6px;pointer-events:auto;
  font:inherit;color:transparent;
}
.a11y-hit:focus-visible{
  outline:none;border-color:var(--select);
  box-shadow:0 0 0 2px rgba(255,255,74,.45),0 0 12px rgba(255,255,74,.28);
}
.a11y-hit:disabled{cursor:default;pointer-events:none}
/* Portrait: steel consoles fill width; deck body stacks. Title barrel untouched. */
@media (orientation:portrait){
  #scr-title{padding:calc(clamp(20px,5vh,40px) + env(safe-area-inset-top)) clamp(10px,4vw,28px) calc(clamp(16px,3.5vh,28px) + env(safe-area-inset-bottom));gap:clamp(14px,3vh,28px)}
  .kotor-lockup{width:min(100%,94vw);max-width:94vw;padding:0}
  .sw-mark{font-size:clamp(24px,9vw,46px);letter-spacing:.05em;text-indent:.05em}
  .logo-main{font-size:clamp(36px,15vw,78px);letter-spacing:.06em;padding-left:.06em}
  .logo-or{font-size:clamp(14px,5.2vw,30px);letter-spacing:.14em;padding-left:.14em}
  .kotor-menu-shell{width:min(360px,88vw)}
  .match-wrap{flex-direction:column;justify-content:center;align-items:stretch;padding:0;gap:0}
  .match-board{flex:1 1 auto;width:100%;min-height:0}

  #scr-circuit,#scr-store,#scr-deck{
    padding:calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom));
  }
  .steel-console{
    width:min(100%,96vw);
    height:100%;
    max-height:none;
    border-radius:14px;
    padding:8px;
    gap:8px;
  }
  .steel-headers{
    grid-template-columns:1fr 1fr;
  }
  .steel-headers-2{grid-template-columns:1fr 1fr}
  .deck-headers{
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto;
  }
  .deck-hbadge-wide{grid-column:1 / -1;order:-1}
  .kplate{min-height:52px;padding:14px 8px;font-size:13px;border-radius:6px}

  .deck-body{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1fr) 8px auto;
  }
  .deck-rail{
    width:auto;
    height:8px;
    background:
      linear-gradient(180deg,rgba(0,0,0,.55),rgba(255,255,255,.14) 45%,rgba(0,0,0,.5)),
      linear-gradient(90deg,var(--steel-mid),var(--steel-lo));
  }
  .deck-collection{min-height:0;flex:1 1 auto}
  #collection{grid-template-columns:repeat(4,minmax(0,1fr))}
  .deck-side{flex:0 0 auto;max-height:none;padding:8px 6px 4px}
  #sidedeck{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    grid-template-rows:none;
    grid-auto-rows:auto;
    height:auto;
    max-height:none;
    aspect-ratio:unset;
    gap:6px;
  }
  .sslot{width:100%;height:auto;aspect-ratio:572/772}
  .sslot canvas{width:100%;height:auto;aspect-ratio:572/772}
  .deck-foot{
    display:grid;
    grid-template-columns:1fr 1fr 1.15fr;
    gap:10px;
    padding:6px 2px 4px;
  }
  .deck-foot-left,
  .deck-foot-right{display:contents}
  .deck-foot-right{margin-left:0}
  #bt-dback{order:1}
  #bt-autofill{order:2}
  #bt-begin{order:3;min-width:0}
}
@media (orientation:landscape){
  .logo-main{font-size:clamp(48px,12.5vh,120px)}
  .logo-or{font-size:clamp(18px,4.6vh,46px)}
  .sw-mark{font-size:clamp(28px,7vh,64px)}
  #scr-title.active{align-items:center;justify-content:center;gap:clamp(12px,3.2vh,36px)}
  .kotor-menu-shell{width:min(480px,52vw)}
}
@media (orientation:landscape) and (max-width:700px){
  #scr-deck,#scr-circuit,#scr-store{padding:6px}
  .steel-console{width:100%;padding:8px;gap:6px}
  .deck-headers{grid-template-columns:minmax(80px,.8fr) minmax(0,2fr) minmax(90px,.9fr)}
  .steel-hbadge{font-size:10px;letter-spacing:.1em;min-height:26px;padding:3px 6px}
  .deck-body{grid-template-columns:minmax(0,1fr) 8px minmax(120px,.38fr)}
  #collection{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kplate{font-size:11px;padding:10px 8px;letter-spacing:.1em}
}
@media (orientation:landscape) and (max-height:520px){
  .screen{justify-content:flex-start;gap:8px}
  #scr-title.active{padding:8px 3vw 10px;gap:10px;justify-content:center}
  .logo-main{font-size:clamp(36px,9vh,72px)}
  .kotor-menu-shell{width:min(300px,40vw)}
  .kotor-menu button{font-size:11px;letter-spacing:.16em}
  .kbtn{padding:8px 14px;font-size:12px}
  #scr-deck,#scr-circuit,#scr-store{justify-content:stretch;padding:4px}
  .steel-console{height:100%;padding:6px;gap:5px;border-radius:12px}
  .steel-hbadge{min-height:22px;font-size:9px}
  .kplate{padding:8px 10px;font-size:11px;min-height:36px}
  .cell canvas{max-width:48px}
}
</style>

          <span class="logo-bar"></span>
          <span class="logo-ofthe">OF THE</span>

  <section id="scr-circuit" class="screen">
    <div class="steel-console circuit-console">

        <div class="steel-hbadge">CANTINA COUNTER</div>

        <div id="stock"></div>

      </div>

  </section>
  <section id="scr-deck" class="screen">
    <div class="steel-console deck-console">

        <div class="steel-hbadge" data-credits data-credits-after>0 CREDITS</div>
        <div class="steel-hbadge steel-hbadge-wide deck-hbadge-wide">CHOOSE CARDS</div>

  '+1':0,'-1':0,'+2':0,'-2':0,'+3':0,'-3':0,
  '+4':0,'-4':0,
  '+5':1,'-5':1,
  '\u00B11':2,'\u00B12':2,
  '+6':3,'-6':3,
  '\u00B13':4,
  '\u00B14':5,'TIE':5,
  '\u00B15':6,'DBL':6,
  '2&4':7,
  '\u00B16':8,'3&6':8,
  '1\u00B12':9
};
function storeMinCircuit(id){return STORE_FROM[id]==null?99:STORE_FROM[id];}
function storeStock(){
  return Object.keys(CARD_PRICE).filter(id=>storeMinCircuit(id)<=SAVE.circuit)
    .sort((a,b)=>storeMinCircuit(a)-storeMinCircuit(b)||(CARD_PRICE[a]-CARD_PRICE[b]));
}
function isClutterId(id){return Object.prototype.hasOwnProperty.call(STARTER_COLLECTION,id);}
function hasCardId(id){return typeof id==='string'&&Object.prototype.hasOwnProperty.call(CARD_DEFS,id);}
function cleanName(value){
  const s=String(value==null?'':value).replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
  return s||'Unknown';
}
function addToCollection(id){
  if(!hasCardId(id))return false;
  SAVE.unlocked[id]=(SAVE.unlocked[id]||0)+1;
  return true;
}
const SAVE_KEY='pazaak-outer-rim-save-v1';
function defaultSave(){return {schema:SAVE_SCHEMA,revision:0,writer:'',updatedAt:0,circuit:0,roster:null,unlocked:Object.assign({},STARTER_COLLECTION),lastDeck:[],credits:START_CREDITS,vol:0.6,muted:false,begun:false,activeMatch:null,recoveredMatch:false};}
function normalizeRoster(save){
  if(!Array.isArray(save.roster)||save.roster.length!==CIRCUIT_LEN||
     !save.roster.every(o=>o&&typeof o.name==='string'&&cleanName(o.name)!=='Unknown'&&Number.isInteger(o.tier)&&o.tier>=1&&o.tier<=3)){
    save.roster=buildRoster();
  }else{
    save.roster=save.roster.map(o=>({name:cleanName(o.name),tier:o.tier,title:TIER_LABELS[o.tier]}));
  }
  return save;
}
function normalizeSave(raw,recover=true){
  const out=defaultSave();
  if(!raw||typeof raw!=='object')return normalizeRoster(out);
  out.revision=Number.isSafeInteger(raw.revision)&&raw.revision>=0?raw.revision:0;
  out.writer=typeof raw.writer==='string'?raw.writer:'';
  out.updatedAt=Number.isFinite(raw.updatedAt)&&raw.updatedAt>=0?raw.updatedAt:0;
  out.circuit=Number.isFinite(Number(raw.circuit))?Math.max(0,Math.min(CIRCUIT_LEN,Math.floor(Number(raw.circuit)))):0;
  out.credits=Number.isFinite(Number(raw.credits))?Math.max(0,Math.min(999999999,Math.floor(Number(raw.credits)))):START_CREDITS;
  out.vol=Number.isFinite(Number(raw.vol))?Math.max(0,Math.min(1,Number(raw.vol))):0.6;
  out.muted=raw.muted===true;out.begun=raw.begun===true;
  out.activeMatch=raw.activeMatch&&Number.isFinite(Number(raw.activeMatch.wager))&&Number(raw.activeMatch.wager)>0?{
    wager:Math.floor(Number(raw.activeMatch.wager)),rung:Number.isInteger(raw.activeMatch.rung)?raw.activeMatch.rung:null,startedAt:Number(raw.activeMatch.startedAt)||0
  }:null;
  out.recoveredMatch=false;
  if(recover&&out.activeMatch)out.recoveredMatch=true;
  if(raw.unlocked&&typeof raw.unlocked==='object')for(const id of Object.keys(raw.unlocked)){
    if(!hasCardId(id))continue;
    const n=Number(raw.unlocked[id]);
    if(Number.isFinite(n)&&n>0)out.unlocked[id]=Math.min(99,Math.floor(n));
  }
  const used={};
  if(Array.isArray(raw.lastDeck))for(const id of raw.lastDeck){
    if(out.lastDeck.length>=10||!hasCardId(id))continue;
    used[id]=(used[id]||0)+1;
    if(used[id]<=(out.unlocked[id]||0))out.lastDeck.push(id);
  }
  out.roster=raw.roster;
  return normalizeRoster(out);
}
function loadSave(){
  try{
    return normalizeSave(JSON.parse(localStorage.getItem(SAVE_KEY)));
  }catch(e){}
  return defaultSave();
}
function persist(){
  if(PERSIST_BLOCK)return false;
  try{
    const old=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(old&&Number.isSafeInteger(old.revision)&&(
      old.revision>(SAVE.revision||0)||(old.revision===(SAVE.revision||0)&&old.updatedAt>(SAVE.updatedAt||0)))){
      SAVE.revision=old.revision;
      SAVE.updatedAt=old.updatedAt;
    }
    SAVE.schema=SAVE_SCHEMA;SAVE.revision=(SAVE.revision||0)+1;SAVE.writer=SAVE_WRITER;SAVE.updatedAt=Date.now();
    localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));
    if(SAVE_CHANNEL)SAVE_CHANNEL.postMessage({type:'save',payload:SAVE});
    SAVE_CONFLICT=false;
  }catch(e){return false;}
  refreshCredits();return true;
}
function adoptExternalSave(raw){
  const incoming=normalizeSave(raw,false);
  if((incoming.revision||0)<=(SAVE.revision||0))return;
  if(typeof M!=='undefined'&&M){SAVE_CONFLICT=true;console.warn('Save changed in another tab during a match.');return;}
  SAVE=incoming;refreshCredits();
  if(typeof refreshTitle==='function')refreshTitle();
  if(typeof curScreen!=='undefined'&&curScreen==='circuit'&&typeof buildCircuit==='function')buildCircuit();
  if(typeof curScreen!=='undefined'&&curScreen==='deck'&&typeof buildDeckUI==='function')buildDeckUI();
  if(typeof curScreen!=='undefined'&&curScreen==='store'&&typeof buildStoreUI==='function')buildStoreUI();
}
function initSaveSync(){
  if(typeof window==='undefined'||!window.addEventListener)return;
  window.addEventListener('storage',e=>{if(e.key===SAVE_KEY&&e.newValue)try{adoptExternalSave(JSON.parse(e.newValue));}catch(_){} });
  if(typeof BroadcastChannel==='function'){
    SAVE_CHANNEL=new BroadcastChannel(SAVE_KEY);
    SAVE_CHANNEL.onmessage=e=>{if(e.data&&e.data.type==='save')adoptExternalSave(e.data.payload);};
  }
}
function applyRecoveredWager(){
  if(!SAVE.recoveredMatch||!SAVE.activeMatch){SAVE.recoveredMatch=false;return true;}
  const rec=SAVE.activeMatch;
  const prevCredits=SAVE.credits;
  SAVE.credits=Math.min(999999999,SAVE.credits+rec.wager);
  SAVE.activeMatch=null;
  SAVE.recoveredMatch=false;
  if(persist())return true;
  SAVE.credits=prevCredits;
  SAVE.activeMatch=rec;
  SAVE.recoveredMatch=true;
  return false;
}
function resetSave(){SAVE=defaultSave();return persist();}
function refreshCredits(){
  try{
    document.querySelectorAll('[data-credits]').forEach(el=>{
      el.textContent=el.hasAttribute('data-credits-after')?(SAVE.credits+' CREDITS'):('CREDITS  '+SAVE.credits);
    });
  }catch(e){}
}
let SAVE=loadSave();
let W=1024,H=768,L={},PORTRAIT=false;
// KOTOR 2 table: two mirrored halves.
// Player is left-handed (turn orb + set well on the left, board total on the inner end).
// Opponent is right-handed. Landscape sits the halves side by side on one name rail.
// Portrait stacks the same shapes: opponent on top, player underneath.
function computeLayout(){
  const mq=window.matchMedia&&window.matchMedia('(orientation: portrait)');
  PORTRAIT=mq?mq.matches:window.innerHeight>window.innerWidth;
  let aw=+window.innerWidth||0, ah=+window.innerHeight||0;
  try{
    const b=document.querySelector('.match-board'),r=b&&b.getBoundingClientRect();
    if(r&&r.width>1&&r.height>1){aw=r.width;ah=r.height;}
  }catch(e){}
  if(!(aw>1&&ah>1)){W=1;H=1;L={fallback:true,reason:'NO VIEWPORT'};return;}
  W=Math.max(1,Math.round(aw));H=Math.max(1,Math.round(ah));
  layoutTable();
}
function layoutPortrait(){
  const bezel=Math.max(8,Math.min(12,Math.round(H*0.012)));
  const fx=bezel,fy=bezel,fw=W-2*bezel,fh=H-2*bezel;
  const frame={x:fx,y:fy,w:fw,h:fh,r:Math.max(12,Math.round(Math.min(fw,fh)*0.02))};
  const pad=6,split=6,gutter=6,barPad=3,orbGap=3,botPad=4;
  const gapX=4,gapY=4,slotGap=4;
  const barH=Math.max(22,Math.min(26,Math.round(H*0.03)));
  const orbR=Math.max(H<500?12:16,Math.round(barH*0.88));
  const scoreR=Math.max(10,Math.round(barH*0.42));
  const chanW=Math.max(22,Math.round(orbR*1.04));
  const btnH=H<420?32:Math.max(36,Math.min(44,Math.round(H*0.046)));
  const gridTopOff=barPad+barH/2+orbR+orbGap;
  const btnGapY=8;
  const innerX0=fx+pad,innerX1=fx+fw-pad,innerW=fw-2*pad;
  function metrics(sw0){
    const sh=sw0/CARD_ASPECT,gridW=3*sw0+2*gapX,gridH=3*sh+2*gapY;
    const gridX=W/2-(1.5*sw0+gapX);
    const leftRoom=gridX-gutter-innerX0,rightRoom=innerX1-(gridX+gridW)-gutter;
    const hwP=sw0,hhP=sh,rowW=4*hwP+3*slotGap;
    const hhOFit=(gridH-3*slotGap)/4,hwOFit=hhOFit*CARD_ASPECT;
    const hwO=Math.min(hwOFit,Math.max(0,leftRoom),sw0*0.62);
    const hhO=hwO/CARD_ASPECT;
    const oNeed=gridTopOff+gridH+botPad;
    const pNeed=gridTopOff+gridH+8+hhP+btnGapY+btnH+botPad;
    const ok=leftRoom>=chanW-0.5&&rightRoom>=chanW-0.5&&rowW<=innerW+0.5&&oNeed+pNeed+split<=fh+0.5&&hwP>=18&&hhP>=22;
    return {sh,gridW,gridH,gridX,hwP,hhP,hwO,hhO,oNeed,pNeed,ok};
  }
  let lo=12,hi=Math.max(13,fw/2.8),best=null;
  for(let i=0;i<28;i++){
    const mid=(lo+hi)/2,met=metrics(mid);
    if(met.ok){best=Object.assign({sw:mid},met);lo=mid;}else hi=mid;
  }
  let m=best||Object.assign({sw:12},metrics(12));
  const slack=Math.max(0,fh-(m.oNeed+m.pNeed+split));
  const oH=m.oNeed+slack/2,pH=m.pNeed+slack/2;
  const boxO={x:fx,y:fy,w:fw,h:oH};
  const boxP={x:fx,y:fy+oH+split,w:fw,h:pH};
  const splitY=fy+oH+split/2;
  const namePad=6,nameGap=8;
  const sw0=m.sw;

  function place(side,box){
    const left=side==='p';
    const barY=box.y+barPad,orbY=barY+barH/2;
    const gridTop=box.y+gridTopOff;
    const gridX=m.gridX,gridW=m.gridW,gridH=m.gridH;
    const chan={
      x:Math.round(left?gridX-gutter-chanW:gridX+gridW+gutter),
      y:gridTop,w:chanW,
      h:Math.max(Math.round(chanW*3.6),Math.min(Math.round(chanW*4.2),gridH)),
      dir:'v'
    };
    chan.x=Math.max(fx+4,Math.min(chan.x,fx+fw-chan.w-4));
    const orb={x:chan.x+chan.w/2,y:orbY,r:orbR};
    const top={x:box.x+pad,y:barY,w:box.w-2*pad,h:barH};
    const badge=left
      ?{x:top.x+top.w-nameGap-scoreR,y:orbY,r:scoreR}
      :{x:top.x+nameGap+scoreR,y:orbY,r:scoreR};
    const name=left
      ?{x:orb.x+orbR+namePad,y:orbY}
      :{x:orb.x-orbR-namePad,y:orbY};
    const nameMax=left
      ?Math.max(20,badge.x-badge.r-nameGap-name.x)
      :Math.max(20,name.x-(badge.x+badge.r+nameGap));
    const hw=left?m.hwP:m.hwO,hh=left?m.hhP:m.hhO;
    let lab=null,hand;
    if(left){
      const rowW=4*hw+3*slotGap;
      const btnY=box.y+box.h-botPad-btnH;
      const handY=btnY-btnGapY-hh;
      let handX=(W-rowW)/2;
      handX=Math.max(innerX0,Math.min(handX,innerX1-rowW));
      hand={x:handX,y:handY,sw:hw,sh:hh,hgap:slotGap};
    }else{
      hand={x:Math.max(innerX0,gridX-gutter-hw),y:gridTop,sw:hw,sh:hh,hgap:slotGap,dir:'v'};
    }
    return {
      top,orb,name,nameMax,badge,chan,
      grid:{x:gridX,y:gridTop},lab,hand,
      sw:sw0,sh:m.sh,gapX,gapY,
      btnY:box.y+box.h-botPad-btnH,
      btnH,fsName:Math.max(10,Math.round(barH*0.4)),
      fsLab:11
    };
  }
  const p=place('p',boxP),o=place('o',boxO);
  const minGap=orbR+scoreR+10;
  if(p.badge.x-p.orb.x<minGap)p.badge.x=Math.min(p.top.x+p.top.w-8-scoreR,p.orb.x+minGap);
  if(o.orb.x-o.badge.x<minGap)o.badge.x=Math.max(o.top.x+8+scoreR,o.orb.x-minGap);
  p.nameMax=Math.max(20,p.badge.x-p.badge.r-nameGap-p.name.x);
  o.nameMax=Math.max(20,o.name.x-(o.badge.x+o.badge.r+nameGap));
  const x0=fx+Math.max(10,pad+4),x1=fx+fw-Math.max(10,pad+4);
  const bGap=8,span=x1-x0,wts=[0.88,1,1.28,1],sum=wts.reduce((a,b)=>a+b,0);
  const inner=span-3*bGap,ws=wts.map(w=>inner*w/sum);
  const y=p.btnY,bh=p.btnH;
  let x=x0;
  const btnForf={x,y,w:ws[0],h:bh};x+=ws[0]+bGap;
  const btnFlip={x,y,w:ws[1],h:bh};x+=ws[1]+bGap;
  const btnEnd={x,y,w:ws[2],h:bh};x+=ws[2]+bGap;
  const btnStand={x,y,w:ws[3],h:bh};
  L={
    frame,splitY,nameRail:null,
    top:p.top,topP:p.top,topO:o.top,
    orbP:p.orb,orbO:o.orb,
    nameP:p.name,nameO:o.name,
    nameMaxP:p.nameMax,nameMaxO:o.nameMax,
    badges:[p.badge,o.badge],
    badgeP:p.badge,badgeO:o.badge,
    chanP:p.chan,chanO:o.chan,
    gridP:p.grid,gridO:o.grid,
    labP:p.lab,labO:null,
    handP:p.hand,handO:o.hand,
    btnForf,btnFlip,btnEnd,btnStand,
    sw:p.sw,sh:p.sh,gap:p.gapY,gapX:p.gapX,gapY:p.gapY,
    vent:null,deco:null,
    toastY:(o.grid.y+p.grid.y)/2+p.sh,
    fsName:p.fsName,fsLab:p.fsLab
  };
  L.fallback=W<180||p.sw<11||!layoutValid();
}
function layoutTable(){
  if(PORTRAIT){layoutPortrait();return;}
  const u=Math.min(W,H)/720;
  const bezel=Math.max(18,Math.round(Math.min(W,H)*0.055));
  const fx=bezel,fy=bezel,fw=W-2*bezel,fh=H-2*bezel;
  const split=Math.max(8,Math.round(10*u));
  const frame={x:fx,y:fy,w:fw,h:fh,r:Math.max(16,Math.round(Math.min(fw,fh)*0.028))};

  function placeHalf(side,box,flags,swLock){
    const left=side==='p';
    const short=box.h<200;
    const barH=Math.max(short?18:24,Math.round(Math.min(box.w,box.h)*0.062));
    const pad=Math.max(8,Math.round(10*u));
    const barY=box.y+Math.max(3,Math.round(4*u));
    const orbR=Math.max(short?11:13,Math.round(barH*(short?0.62:0.92)));
    const scoreR=Math.max(10,Math.round(barH*0.42));
    const orb=left
      ?{x:box.x+pad+orbR,y:barY+barH/2,r:orbR}
      :{x:box.x+box.w-pad-orbR,y:barY+barH/2,r:orbR};
    const tuck=orbR*0.18;
    const top=left
      ?{x:orb.x-tuck,y:barY,w:box.x+box.w-pad-(orb.x-tuck),h:barH}
      :{x:box.x+pad,y:barY,w:(orb.x+tuck)-(box.x+pad),h:barH};
    const badge=left
      ?{x:top.x+top.w-Math.max(8,Math.round(10*u))-scoreR,y:barY+barH/2,r:scoreR}
      :{x:top.x+Math.max(8,Math.round(10*u))+scoreR,y:barY+barH/2,r:scoreR};
    const name=left
      ?{x:orb.x+orbR+Math.max(6,Math.round(7*u)),y:barY+barH/2}
      :{x:orb.x-orbR-Math.max(6,Math.round(7*u)),y:barY+barH/2};
    const nameMax=left
      ?Math.max(20,badge.x-badge.r-Math.max(8,Math.round(8*u))-name.x)
      :Math.max(20,name.x-(badge.x+badge.r+Math.max(8,Math.round(8*u))));

    const chanW=Math.max(20,Math.round(orbR*1.08));
    const btnH=flags.buttons?Math.max(28,Math.round(32*u)):0;
    const labelH=(flags.label||flags.reserveLab)?Math.max(12,Math.round(14*u)):0;
    const orbBottom=orb.y+orb.r;
    const chanY=Math.max(barY+barH+Math.max(3,Math.round(4*u)),orbBottom+Math.max(short?3:6,Math.round(short?3:8*u)));
    const chanMaxH=box.y+box.h-chanY-(btnH?btnH+Math.round(8*u):Math.round(8*u));
    const chanH=Math.max(Math.round(chanW*3.6),Math.min(Math.round(chanW*4.35),chanMaxH));
    const chan={
      x:Math.round(orb.x-chanW/2),
      y:chanY,
      w:chanW,h:chanH,dir:'v'
    };
    const handGap=Math.max(3,Math.round(4*u));
    let gapX=Math.max(4,Math.round(5*u)),gapY=gapX;
    const gutter=Math.max(6,Math.round(7*u));
    const rail=chanW+gutter;
    const gridTop=chan.y;
    const bottom=box.y+box.h-Math.max(4,Math.round(6*u))-btnH-(btnH?Math.round(5*u):0);
    const availH=Math.max(40,bottom-gridTop);
    const maxGridW=Math.max(36,top.w-rail);
    const handScale=flags.handScale||1;
    const handEdge0=left?chan.x+chan.w+gutter:box.x+pad;
    const handEdge1=left?box.x+box.w-pad:chan.x-gutter;
    const maxHandRow=Math.max(36,handEdge1-handEdge0);
    const pack=(sw0,gx,gy)=>{
      const sh=sw0/CARD_ASPECT,gridW=3*sw0+2*gx,gridH=3*sh+2*gy;
      const hw=Math.min(sw0*handScale,(maxHandRow-3*handGap)/4),hh=hw/CARD_ASPECT;
      const used=gridH+Math.max(3,gy)+labelH+(labelH?3:0)+hh;
      return {sh,gridW,gridH,hw,hh,used};
    };
    const swFromHand=(maxHandRow-3*handGap)/(4*Math.max(0.35,handScale));
    let sw=swLock!=null?swLock:Math.max(12,Math.min((maxGridW-2*gapX)/3,swFromHand));
    let p=pack(sw,gapX,gapY);
    for(let i=0;i<40&&p.used>availH&&sw>10;i++){
      sw*=Math.min(0.97,availH/Math.max(p.used,1));
      p=pack(sw,gapX,gapY);
    }
    if(p.gridW>maxGridW){
      sw=Math.max(10,(maxGridW-2*gapX)/3);
      p=pack(sw,gapX,gapY);
    }
    let gridX=left?chan.x+chan.w+gutter:chan.x-gutter-p.gridW;
    const minX=box.x+pad,maxX=box.x+box.w-pad-p.gridW;
    gridX=Math.max(minX,Math.min(gridX,maxX));
    if(left&&gridX<chan.x+chan.w+2){
      sw=Math.max(10,(maxGridW-2*gapX)/3);
      p=pack(sw,gapX,gapY);
      gridX=chan.x+chan.w+gutter;
    }
    if(!left&&gridX+p.gridW>chan.x-2){
      sw=Math.max(10,(maxGridW-2*gapX)/3);
      p=pack(sw,gapX,gapY);
      gridX=chan.x-gutter-p.gridW;
    }
    const labY=gridTop+p.gridH+Math.max(3,gapY);
    const handY=labY+(labelH?labelH+3:0);
    const handW=4*p.hw+3*handGap;
    const handMin=left?chan.x+chan.w+Math.max(4,gutter):box.x+pad;
    const handMax=left?box.x+box.w-pad:chan.x-Math.max(4,gutter);
    let handX=gridX+(p.gridW-handW)/2;
    handX=Math.max(handMin,Math.min(handX,handMax-handW));
    return {
      top,orb,name,nameMax,badge,chan,
      grid:{x:gridX,y:gridTop},
      lab:flags.label?{x:gridX,y:labY,w:p.gridW,h:labelH}:null,
      hand:{x:handX,y:handY,sw:p.hw,sh:p.hh,hgap:handGap},
      sw,sh:p.sh,gapX,gapY,
      btnY:box.y+box.h-Math.max(4,Math.round(6*u))-btnH,
      btnH,fsName:Math.max(10,Math.round(barH*0.4)),
      fsLab:Math.max(9,Math.round((labelH||14)*0.62))
    };
  }

  const flagsP={label:true,buttons:true,handScale:1};
  const flagsO={label:false,reserveLab:true,buttons:true,handScale:0.72};
  const halfW=(fw-split)/2;
  const boxP={x:fx,y:fy,w:halfW,h:fh};
  const boxO={x:fx+halfW+split,y:fy,w:halfW,h:fh};

  let p=placeHalf('p',boxP,flagsP);
  let o=placeHalf('o',boxO,flagsO);
  const sw=Math.min(p.sw,o.sw);
  p=placeHalf('p',boxP,flagsP,sw);
  o=placeHalf('o',boxO,flagsO,sw);

  const btnGap=Math.max(6,Math.round(8*u));
  const pW=3*p.sw+2*p.gapX,oW=3*o.sw+2*o.gapX;
  const pInner=pW-btnGap,oInner=oW-btnGap;
  const forf=pInner*0.46,flip=pInner-forf;
  const stand=oInner/2.27,end=oInner-stand;

  for(let i=0;i<4;i++){
    const b=document.createElement('button');
    b.type='button';b.className='a11y-hit';b.dataset.kind='hand';b.dataset.i=String(i);
    b.addEventListener('click',()=>{
      if(!M||matchDlg||M.phase!=='pAction')return;
      const idx=+b.dataset.i;
      if(!M.p.hand[idx])return;
      if(M.sel===idx)confirmPlay(idx);
      else{AUDIO.play('click');M.sel=idx;M.orient=1;M.varV=1;}
      syncMatchA11y();
    });
    b.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(!M||matchDlg||M.phase!=='pAction')return;
      const idx=+b.dataset.i,card=M.p.hand[idx];
      if(!canFlip(card))return;
      if(M.sel!==idx){M.sel=idx;M.orient=1;M.varV=1;}
      flipArmed();syncMatchA11y();
    });
    root.appendChild(b);
  }
  const actions=[['end','End turn','Space E'],['stand','Stand','Enter S'],['flip','Flip armed card','F'],['forfeit','Forfeit match','']];
  for(const [kind,label,keys] of actions){
    const b=document.createElement('button');
    b.type='button';b.className='a11y-hit';b.dataset.kind=kind;
    b.setAttribute('aria-label',label);
    if(keys)b.setAttribute('aria-keyshortcuts',keys);
    b.addEventListener('click',()=>{
      if(!M||matchDlg)return;
      if(kind==='end')endPlayerTurn();
      else if(kind==='stand')playerStand();
      else if(kind==='flip')flipArmed();
      else if(kind==='forfeit')askForfeit();

  else if(M.phase==='oTurn')phase=opp+' is playing.';

  const armed=M.sel>=0&&M.p.hand[M.sel]?' Armed '+cardSpeak(M.p.hand[M.sel],M.orient,M.varV)+'. ':'';

function syncMatchA11y(){
  const root=ensureMatchA11y();
  const live=$('#match-live');
  if(!root)return;
  if(curScreen!=='match'||!M){
    root.hidden=true;
    return;
  }
  root.hidden=false;
  const ui=typeof tableUI==='function'?tableUI():{act:false,flipOk:false};
  const canAct=!!(ui.act&&!matchDlg&&!(L&&L.fallback));
  for(let i=0;i<4;i++){
    const b=root.querySelector('.a11y-hit[data-kind="hand"][data-i="'+i+'"]');
    const card=M.p.hand[i];
    placeA11yHit(b,L&&L.handP?handSlot(L.handP,i):null);
    if(!b)continue;
    if(!card||L.fallback){b.hidden=true;continue;}
    b.disabled=!canAct;
    const selected=M.sel===i;
    const name=cardSpeak(card,selected?M.orient:1,selected?M.varV:1);
    b.setAttribute('aria-label','Hand card '+(i+1)+', '+name+(selected?', selected, activate to play':canAct?', activate to select':''));

  const map={end:L&&L.btnEnd,stand:L&&L.btnStand,flip:L&&L.btnFlip,forfeit:L&&L.btnForf};

    const b=root.querySelector('.a11y-hit[data-kind="'+kind+'"]');
    placeA11yHit(b,rect);
    if(!b)continue;
    if(L&&L.fallback){b.hidden=true;continue;}

function registerPwa(){
  if(!('serviceWorker' in navigator))return;
  let pendingReload=false;
  const reloadWhenSafe=()=>{
    if(typeof curScreen!=='undefined'&&curScreen==='match'&&typeof M!=='undefined'&&M){pendingReload=true;return;}
    location.reload();
  };
  globalThis.flushPwaReload=()=>{if(pendingReload){pendingReload=false;reloadWhenSafe();}};

  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      reg.addEventListener('updatefound',()=>{
        const sw=reg.installing;if(!sw)return;
        sw.addEventListener('statechange',()=>{if(sw.state==='installed'&&!navigator.serviceWorker.controller)sw.postMessage({type:'SKIP_WAITING'});});
      });
      try{await reg.update();}catch(_){/* ignore */}

      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(err){
      console.warn('PWA register failed:',err);
    }
  });

  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    reloadWhenSafe();
  });
}

    else if(k==='f'){e.preventDefault();flipArmed();}

        document.fonts.load('500 32px "ITC Blair"'),
        document.fonts.load('700 32px "DIN Alternate"'),

      ]);

function fit(){
  const rawDpr=Number(window.devicePixelRatio)||1;
  computeLayout();
  const budget=16000000/Math.max(1,W*H);
  DPR=Math.max(0.5,Math.min(2,rawDpr,Math.sqrt(budget)));
  if(cv){cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));}
  if(M&&ctx){renderStatic();render(performance.now());kickRender();}
  if(typeof syncMatchA11y==='function')syncMatchA11y();
}
function scheduleFit(){
  if(fitQueued)return;
  fitQueued=true;
  requestAnimationFrame(()=>{fitQueued=false;fit();});
}
function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/Math.max(1,r.width)*W, y:(e.clientY-r.top)/Math.max(1,r.height)*H};
}
function askForfeit(){
  if(!canForfeit())return;
  AUDIO.play('click');
  presentDialog('FORFEIT THE MATCH?','THE WAGER WILL BE LOST',()=>{AUDIO.play('lose');leaveMatch();},{cancelText:'NO',onCancel(){}});
}
function hitTable(p){
  if(!M||matchDlg||L.fallback)return null;
  if(L.handP&&!M.sidePlayed){
    for(let i=0;i<4;i++){
      if(inRect(p,handSlot(L.handP,i))&&M.p.hand[i])return {kind:'hand',i};
    }
  }
  const ui=tableUI();
  if(inRect(p,L.btnEnd)&&ui.act)return {kind:'end'};
  if(inRect(p,L.btnStand)&&ui.act)return {kind:'stand'};
  if(inRect(p,L.btnFlip)&&ui.flipOk)return {kind:'flip'};
  if(inRect(p,L.btnForf)&&canForfeit())return {kind:'forfeit'};
  return null;
}
function onTableHover(e){
  if(curScreen!=='match'||!cv)return;
  cv.style.cursor=hitTable(canvasPoint(e))?'pointer':'default';
}
function onTablePointer(e){
  if(curScreen!=='match'||!M||matchDlg)return;
  if(e.button!=null&&e.button!==0)return;
  const hit=hitTable(canvasPoint(e));
  if(!hit)return;
  e.preventDefault();
  if(hit.kind==='hand'){
    if(M.phase!=='pAction')return;
    if(M.sel===hit.i)confirmPlay(hit.i);
    else{AUDIO.play('click');M.sel=hit.i;M.orient=1;M.varV=1;}
  }else if(hit.kind==='end')endPlayerTurn();
  else if(hit.kind==='stand')playerStand();
  else if(hit.kind==='flip')flipArmed();
  else if(hit.kind==='forfeit')askForfeit();
}
function onTableContext(e){
  if(curScreen!=='match')return;
  e.preventDefault();
  if(!M||matchDlg||M.phase!=='pAction')return;
  const hit=hitTable(canvasPoint(e));
  if(!hit||hit.kind!=='hand')return;
  const card=M.p.hand[hit.i];
  if(!canFlip(card))return;
  if(M.sel!==hit.i){M.sel=hit.i;M.orient=1;M.varV=1;}
  flipArmed();
}
